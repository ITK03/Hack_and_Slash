<script>
"use strict";
/* ==========================================================================
   Descent — プロトタイプ v5
   高難度志向。手動戦闘・MP消費・5段階レアリティ・帰還ポータル・宝箱の錠前開け。
   数値は CFG に集約。
   ========================================================================== */
const CFG={
  TILE_W:52,TILE_H:26,DPR_CAP:2,ECO_DPR:1.25,
  LIGHT_R:1.05,LIGHT_STRETCH:1.45,DARKNESS:.86,CAM_Y:.42,CAM_LERP:.30,

  P_SPEED:3.5, ATK_CD:.40, P_RADIUS:.30,
  ATK_MUL:.34,          // 通常攻撃の倍率。スキルを主役にするため大きく下げてある

  HITSTOP:.03,HITSTOP_CRIT:.07,HITSTOP_KILL:.045,
  SHAKE_HIT:1.6,SHAKE_CRIT:5,SHAKE_KILL:2.6,SHAKE_HURT:8,
  KNOCKBACK:.14, FLASH_T:.10, VIBRATE:true,

  /* --- 敵 --- */
  SPAWN_BASE:8, SPAWN_PER_FLOOR:1.05, SPAWN_MAX:46,   // Diablo 1 相当(1階層40〜60体)
  PACK_FROM:4, PACK_CHANCE:.30,          // 群れは深度4から
  HP_SCALE:.38, DMG_SCALE:.44,           // 旧セーブ・表示との互換用（実倍率は進行曲線関数へ集約）
  E_SPEED_BASE:.46, E_SPEED_PER:.028, E_SPEED_MAX:1.0,
  ELITE_CHANCE:.07, ELITE_HP:5, ELITE_DMG:1.7, BOSS_EVERY:5,
  BOSS_MUL:{5:.4,10:.8},    // 旧データ互換用。生成時はボス専用の進行曲線を使う
  BOSS_RATE:{5:.3,10:.5},   // 攻撃頻度の倍率(0.3 = 頻度7割減)
  BOSS_SLOW_TO:15,          // この深度までは動きを緩くする
  BOSS_SLOW_SP:.65,         // 移動速度
  BOSS_SLOW_TEL:1.6,        // 予備動作の長さ
  WIND:.46,

  /* --- ドロップ --- */
  DROP_CHANCE:.048,      // 旧 .24 の 2割
  GOLD_CHANCE:.42, POTION_DROP:.070,
  CHEST_CHANCE:.035,     // 旧 .34 の 1割
  RARITY:[
    ["並",  1000,-26,"#c8c4bc"],
    ["上質", 300,  4,"#5ad06a"],
    ["希少",  62,  5,"#5a8fe0"],
    ["秀逸",   9,  1.6,"#e0c040"],
    ["伝説", 1.5, .9,"RAINBOW"],   // 目標: 実プレイ1時間に1個程度
  ],

  /* --- 進行 --- */
  STAT_PER_LV:5,
  /* 到達目安（層あたりの獲得XPを実測して逆算）
     Lv10 = 1〜10層を3周 / Lv20 = 11〜20層を5周
     Lv30 = 21〜30層を10周 / Lv40 = 31〜40層を20周 */
  XP_ANCHOR:[[1,0],[10,20200],[20,128500],[30,486000],[40,1438000]],
  XP_MID_GROWTH:1.067,   // Lv40〜100の累積XP伸び率
  XP_HIGH_GROWTH:1.217,  // Lv100以降。将来の進行緩和はこの定数だけを下げる
  ENEMY_ACCEL_START:100,ENEMY_ACCEL_GROWTH:1.06,
  CORE_DAILY_CAP:3,CORE_HOLD_CAP:16,CORE_WEEKLY_PURCHASE_CAP:6,
  BREAKTHROUGH_CORE_COST:[0,80,90,100,110,120],
  SKIP_STEP:5,        // 何層ごとにスキップ開始地点を選べるか
  SHRINE_CHANCE:.30,  // フロアに祭壇が出る確率
  SHARD_DROP:.13, SHARD_HEAL:.045,   // 拾った瞬間に少し回復する欠片
  CRYSTAL_ENEMY_DROP:.025, CRYSTAL_BARREL_DROP:.08,
  PICKUP_DELAY:.10, PICKUP_RADIUS:.50, MAGNET_RADIUS:1.5, MAGNET_SPEED:2.5,
  MP_REGEN:3.4,          // 毎秒。遅め
  SELL_DIV:50,
  EXIT_CLEAR:10,         // 帰還/階段に必要な「周囲に敵がいない」距離
  STAIR_MIN:50,          // 階段までの最低距離
};

const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
function xpCum(lv){
  if(lv<=1)return 0;
  const A=CFG.XP_ANCHOR;
  for(let i=1;i<A.length;i++){
    const[a,ca]=A[i-1],[b,cb]=A[i];
    if(lv<=b)return Math.round(ca+(cb-ca)*Math.pow((lv-a)/(b-a),1.7));}
  const[lb,cb]=A[A.length-1];
  if(lv<=100)return Math.round(cb*Math.pow(CFG.XP_MID_GROWTH,lv-lb));
  const at100=cb*Math.pow(CFG.XP_MID_GROWTH,100-lb);
  return Math.round(at100*Math.pow(CFG.XP_HIGH_GROWTH,lv-100));}
const xpNeed=lv=>Math.max(10,xpCum(lv+1)-xpCum(lv));
function legacyXpCum(lv){
  if(lv<=1)return 0;const A=CFG.XP_ANCHOR;
  for(let i=1;i<A.length;i++){const[a,ca]=A[i-1],[b,cb]=A[i];if(lv<=b)return Math.round(ca+(cb-ca)*Math.pow((lv-a)/(b-a),1.7));}
  return Math.round(A[A.length-1][1]*Math.pow(1.1128,lv-A[A.length-1][0]));}
const d2=(ax,ay,bx,by)=>{const x=ax-bx,y=ay-by;return x*x+y*y;};
let _s=(Math.random()*4294967296)>>>0;
function rnd(){_s|=0;_s=(_s+0x6D2B79F5)|0;let t=Math.imul(_s^(_s>>>15),1|_s);
  t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;}
const rr=(a,b)=>a+rnd()*(b-a), ri=(a,b)=>Math.floor(a+rnd()*(b-a+1));
const pick=a=>a[Math.floor(rnd()*a.length)];
const $=id=>document.getElementById(id);
function darken(hex,f){const h=hex.replace("#","");
  const c=v=>Math.round(v*f).toString(16).padStart(2,"0");
  return "#"+c(parseInt(h.slice(0,2),16))+c(parseInt(h.slice(2,4),16))+c(parseInt(h.slice(4,6),16));}
/* 伝説は虹色。時間で色相を回して他と明確に差をつける */
const rainbow=(o)=>`hsl(${(performance.now()/9+(o||0))%360},92%,66%)`;
const rarCol=r=>CFG.RARITY[r][3]==="RAINBOW"?rainbow():CFG.RARITY[r][3];
const RC=["c0","c1","c2","c3","c4"];

/* ---------- 音 ---------- */
let AC=null;
function aInit(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(AC&&AC.state==="suspended")AC.resume();}
function tone(f,d,ty,v,to){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type=ty||"square";o.frequency.setValueAtTime(f,t);
  if(to)o.frequency.exponentialRampToValueAtTime(Math.max(28,to),t+d);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v==null?.13:v,t+.006);
  g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);}
function noise(d,v,c){if(!AC)return;const n=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);
  for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();
  f.type="lowpass";f.frequency.value=c||1400;
  const g=AC.createGain();g.gain.value=v==null?.18:v;s.connect(f);f.connect(g);g.connect(AC.destination);s.start();}
const SFX={
  hit(){noise(.05,.13,1800);tone(200,.04,"square",.05,130);},
  crit(){noise(.085,.24,3400);tone(450,.09,"square",.11,160);},
  kill(c){const k=1+Math.min(12,c||0)*.075;noise(.1,.16,900*k);tone(120*k,.11,"triangle",.08,50*k);},
  hurt(){tone(150,.18,"sawtooth",.15,60);noise(.09,.13,600);},
  gold(){tone(880,.05,"sine",.05,1180);},
  pot(){[440,660].forEach((f,i)=>setTimeout(()=>tone(f,.12,"sine",.12),i*60));},
  cast(f){tone(f||320,.13,"sawtooth",.1,f?f*2.4:780);},
  nova(){tone(90,.26,"triangle",.14,420);noise(.16,.12,700);},
  lvl(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.18,"triangle",.13),i*66));},
  shrine(){[392,523,659,880].forEach((f,i)=>setTimeout(()=>tone(f,.28,"sine",.12),i*80));},
  chest(){[300,420,560].forEach((f,i)=>setTimeout(()=>tone(f,.15,"triangle",.12),i*70));},
  tick(){tone(1200,.02,"square",.04);},
  ok(){[660,990].forEach((f,i)=>setTimeout(()=>tone(f,.12,"triangle",.13),i*70));},
  ng(){tone(180,.22,"sawtooth",.13,90);},
  boss(){[110,90,70].forEach((f,i)=>setTimeout(()=>{tone(f,.55,"sawtooth",.18,f*.5);noise(.35,.14,400);},i*190));},
  drop(r){if(r<=1)tone(r?640:520,.07,"sine",.07,r?800:0);
    else if(r===2)[720,920].forEach((f,i)=>setTimeout(()=>tone(f,.12,"triangle",.11),i*70));
    else if(r===3)[660,880,1100].forEach((f,i)=>setTimeout(()=>tone(f,.2,"triangle",.14),i*80));
    else{[523,784,1046,1318,1568].forEach((f,i)=>setTimeout(()=>tone(f,.4,"triangle",.19),i*95));
      setTimeout(()=>noise(.5,.11,3400),20);}},
  extract(){[392,494,587,784].forEach((f,i)=>setTimeout(()=>tone(f,.26,"sine",.13),i*82));},
  death(){[300,240,180,120].forEach((f,i)=>setTimeout(()=>tone(f,.3,"sawtooth",.14),i*120));},
};
function buzz(m){if(CFG.VIBRATE&&navigator.vibrate)try{navigator.vibrate(m);}catch(e){}}

/* ---------- 画面 ---------- */
const cv=$("cv"),ctx=cv.getContext("2d",{alpha:false});
const mmc=$("mm"),mctx=mmc.getContext("2d");
let VW=0,VH=0,DPR=1;
function resize(){DPR=Math.min(devicePixelRatio||1,S.settings&&S.settings.eco?CFG.ECO_DPR:CFG.DPR_CAP);
  VW=innerWidth;VH=innerHeight;cv.width=Math.floor(VW*DPR);cv.height=Math.floor(VH*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.imageSmoothingEnabled=false;SPR.clear();TSPR=null;}
addEventListener("resize",resize);

/* ---------- 入力 ---------- */
const IN={dx:0,dy:0,id:-1,ox:0,oy:0};
const stick=$("stick"),zone=$("stickZone");
const STICK_MAX=50;
function sStart(x,y,id){const r=stick.getBoundingClientRect();IN.id=id;IN.ox=r.left+r.width/2;IN.oy=r.top+r.height/2;
  stick.style.opacity=".55";

function sMove(x,y){

  let dx=x-IN.ox,dy=y-IN.oy;
  const raw=Math.hypot(dx,dy)||1, cl=Math.min(raw,STICK_MAX);
  dx=dx/raw*cl; dy=dy/raw*cl;
  stick.firstElementChild.style.transform=`translate(${dx}px,${dy}px)`;
  if(cl<7){IN.dx=0;IN.dy=0;}else{IN.dx=dx/STICK_MAX;IN.dy=dy/STICK_MAX;}}

/* ---------- ダンジョン（部屋も通路も広く、通路は少なく） ---------- */
const MW=88,MH=88;
let map=null,rooms=[],seen=null;
function genFloor(fl){
  for(let attempt=0;attempt<26;attempt++){
    map=new Uint8Array(MW*MH);seen=new Uint8Array(MW*MH);rooms=[];
    const target=clamp(6+(fl*.2|0),6,9);   // 部屋は少なく、その分ひとつを大きく
    let g=0;
    while(rooms.length<target&&g++<900){
      const w=ri(15,24),h=ri(15,24),x=ri(1,MW-w-2),y=ri(1,MH-h-2);
      let ok=true;
      for(const r of rooms)if(x<r.x+r.w+4&&x+w+4>r.x&&y<r.y+r.h+4&&y+h+4>r.y){ok=false;break;}
      if(!ok)continue;
      rooms.push({x,y,w,h,cx:x+(w>>1),cy:y+(h>>1)});
      for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)map[j*MW+i]=1;
    }
    if(rooms.length<3)continue;
    // 近い部屋どうしを繋ぐ。生成順のまま繋ぐと通路が異常に長くなる。
    const ord=[rooms[0]],rest=rooms.slice(1);
    while(rest.length){
      const cur=ord[ord.length-1];let bi=0,bd=1e9;
      for(let i=0;i<rest.length;i++){
        const d=Math.hypot(rest[i].cx-cur.cx,rest[i].cy-cur.cy);
        if(d<bd){bd=d;bi=i;}}
      ord.push(rest.splice(bi,1)[0]);}
    rooms=ord;
    const CW=4;                            // 通路幅
    for(let k=1;k<rooms.length;k++){
      const a=rooms[k-1],b=rooms[k];
      const x0=Math.min(a.cx,b.cx),x1=Math.max(a.cx,b.cx);
      const y0=Math.min(a.cy,b.cy),y1=Math.max(a.cy,b.cy);
      for(let i=x0;i<=x1;i++)for(let t=0;t<CW;t++)map[(a.cy+t)*MW+i]=1;
      for(let j=y0;j<=y1+CW;j++)for(let t=0;t<CW;t++)map[j*MW+b.cx+t]=1;
    }
    // 開始部屋から最も遠い部屋を階段にし、最低距離を満たすまで作り直す
    let best=1,bd=-1;
    for(let k=1;k<rooms.length;k++){
      const d=Math.hypot(rooms[k].cx-rooms[0].cx,rooms[k].cy-rooms[0].cy);
      if(d>bd){bd=d;best=k;}}
    if(bd>=CFG.STAIR_MIN||attempt>=25){rooms.stairIdx=best;return;}
  }
}
const solid=(x,y)=>x<0||y<0||x>=MW||y>=MH?true:map[y*MW+x]===0;
const walk=(x,y,r)=>!solid((x-r)|0,(y-r)|0)&&!solid((x+r)|0,(y-r)|0)&&
                    !solid((x-r)|0,(y+r)|0)&&!solid((x+r)|0,(y+r)|0);
function mv(e,dx,dy){if(walk(e.x+dx,e.y+dy,e.r)){e.x+=dx;e.y+=dy;return;}
  if(walk(e.x+dx,e.y,e.r))e.x+=dx;if(walk(e.x,e.y+dy,e.r))e.y+=dy;}

function rarRoll(fl,mf,luk){
  const bonus=1+(mf||0)+(luk||0)*.012;
  const w=CFG.RARITY.map((r,i)=>Math.max(.0001,r[1]*(i>=2?bonus:1))); // 階層ではレア率を変えない
  const t=w.reduce((a,b)=>a+b,0);let v=rnd()*t;
  for(let i=0;i<w.length;i++){v-=w[i];if(v<=0)return i;}return 0;}
const SW={atk:5,matk:5,atkP:4,hp:1,armor:1.4,crit:7,cdmg:2,as:5,ms:3,ls:9,cdr:4,dr:5,
  mf:1.2,mreg:1.5,luk:3,rng:4,agiF:3,mpF:1,lukF:3};
const ENHANCE_PER_LV=.07; // 基礎主能力への加算。複利にはしない
const itemMaxLv=it=>10+Math.floor(Math.sqrt(Math.max(1,Number(it&&it.ilvl)||1)));
const materialTier=depth=>Math.max(1,Math.ceil(Math.log2(Math.max(1,Number(depth)||1)/10+1)));
const materialScale=depth=>Math.max(1,Math.ceil(Math.sqrt(Math.max(1,Number(depth)||1)/10)));
const MAT_QTY=[1,2,5,12,30],crystalQty=it=>MAT_QTY[clamp(it.rar|0,0,4)]*materialScale(it.ilvl);
const matBucket=kind=>S.mats[kind]||(S.mats[kind]={});
const addMat=(kind,tier,n=1)=>{const b=matBucket(kind),k=Math.max(1,tier|0);if(kind==="core")n=Math.max(0,Math.min(n,CFG.CORE_HOLD_CAP-materialCount("core")));b[k]=(b[k]||0)+n;return n;};
const matCapacity=(kind,minTier)=>Object.entries(matBucket(kind)).reduce((sum,[tier,n])=>
  +tier>=minTier?sum+n*Math.pow(4,+tier-minTier):sum,0);
function spendMat(kind,minTier,units){
  if(matCapacity(kind,minTier)<units)return false;
  const b=matBucket(kind);let left=units;
  for(let tier=minTier;left>0;){
    const have=b[tier]||0,value=Math.pow(4,tier-minTier),take=Math.min(have,Math.ceil(left/value));
    if(take){b[tier]-=take;left-=take*value;if(!b[tier])delete b[tier];}tier++;}
  return true;}
// 深度別の収量スケールを強化上限の段数で均し、1枚の完成までの周回数を一定に保つ。
const enhancementDiveScale=depth=>curve(depth,[[10,1.17],[50,1.42],[100,1.67],[300,2.57],[1000,6.15]]);
const crystalNeed=it=>Math.max(1,Math.round(120*Math.max(1,it.ilvl)*materialScale(it.ilvl)*enhancementDiveScale(it.ilvl)/(itemMaxLv(it)-1)));
const coreNeeded=it=>it.lv+1>1+Math.floor((itemMaxLv(it)-1)*2/3);
function upgradeMatCost(it,addedXP){let lv=it.lv,xp=it.xp+addedXP,crystal=0,core=0;
  /* 判定は fuseNeed({lv})、実際の減算は fuseNeed({ilvl,lv}) を使っていた。
     fuseNeed は ilvl だけで決まるため、前者は ilvl=1 の 60 に落ちて条件が緩くなり、
     払えない段階まで回って結晶と核を余計に数えていた。両方 it で揃える。 */
  while(lv<itemMaxLv(it)&&xp>=fuseNeed(it)){const step={ilvl:it.ilvl,lv};xp-=fuseNeed(it);crystal+=crystalNeed(step);if(coreNeeded(step))core++;lv++;}
  return {crystal,core,levels:lv-it.lv};}
const iScore=it=>((it.main?it.main.v*(SW[it.main.id]||1)*(1+((it.lv||1)-1)*ENHANCE_PER_LV):0)
  +it.affs.reduce((s,a)=>s+a.v*(SW[a.id]||1),0))+(it.pw?80:0);
function makeItem(fl,mf,luk,forceRar){
  let rar=rarRoll(fl,mf,luk);
  if(forceRar!=null)rar=Math.max(rar,forceRar);
  const sd=pick(SLOTS),il=Math.max(1,Math.round(fl));
  const it={rar,slot:sd.k,ilvl:il,lv:1,xp:0,affs:[],pw:null,element:pick([...ELEMENT_KEYS,"neutral"])};
  if(sd.k==="weapon"){it.wt=rnd()<.5?"sword":"staff";it.base=pick(WEAPN[it.wt]);}
  else if(ACSLOT(sd.k)){it.ac=pick(ACLS);it.base=pick(BASEN[sd.k][it.ac]);}
  else it.base=pick(BASEN[sd.k]);
  const m=Math.pow(il,.62);
  const mainId=sd.k==="weapon"?(it.wt==="staff"?"matk":"atk"):sd.main;
  it.main={id:mainId,v:Math.max(1,Math.round(rr(sd.lo,sd.hi)*m))};
  const nA=[0,1,ri(3,4),ri(4,5),ri(4,5)][rar];
  const pool=AFF.slice();          // 部位に関係なく何でも付く（剣に魔力など）
  for(let i=0;i<nA&&pool.length;i++){
    const a=pool.splice(Math.floor(rnd()*pool.length),1)[0];
    const q=rr(.75,1.35);           // 当たり外れ。同じ接尾辞でも値が大きく振れる
    it.affs.push({id:a.id,v:Math.max(1,Math.round(a.f(il)*q)),q:+q.toFixed(2)});}
  if(rar===4)it.pw=pick(POWERS).id;
  it.name=rar===0?it.base
    :rar===1?(pick(PRE)+it.base)
    :rar===2?((rnd()<.5?pick(PRE):"")+it.base+pick(SUF))
    :rar===3?(pick(PRE)+it.base+pick(SUF))
    :"《"+pick(PRE)+pick(SUF)+"》"+it.base;
  it.score=iScore(it);return it;}

const armorDR=a=>Math.min(.45,a/(a+120+S.floor*22));
function derive(){

  const t={atk:0,matk:0,atkP:0,hp:0,armor:0,crit:0,cdmg:0,as:0,ms:0,ls:0,cdr:0,dr:0,
    mf:0,mreg:0,luk:0,rng:0,agiF:0,mpF:0,lukF:0};
  const pw=[];
  for(const k of SLOTK){const it=S.gear[k];if(!it)continue;
    if(it.main)t[it.main.id]=(t[it.main.id]||0)+mainV(it);
    for(const a of it.affs)t[a.id]=(t[a.id]||0)+a.v*itemBaseMultiplier(it);
    if(it.pw&&!pw.includes(it.pw))pw.push(it.pw);}
  if(S.admin)for(const k in S.adminOpts)t[k]=(t[k]||0)+(Number(S.adminOpts[k])||0);
  const bt=breakthroughLevel(activeCharacterKey()),baseMul=breakthroughStatMul(bt);
  const str=(C.str+b.str)*baseMul,mag=(C.mag+b.mag)*baseMul,def=(C.def+b.def)*baseMul,
        agi=(C.agi+b.agi)*baseMul+t.agiF,spi=(C.spi+b.spi)*baseMul,luk=(C.luk+b.luk)*baseMul+t.luk+t.lukF+(ch.luk||0),lv=b.lv;

    max:Math.round((C.hp+lv*17+t.hp)*(ch.hp||1)*traitHP*traitOne),
    atkFlat:(C.atkStat==="mag"?specAtk:physAtk), armor,
    /* %系には必ず天井を置く。AFF の抽選上限は深度に比例して伸びるため、

    ls:Math.min(.03,t.ls/100), cdr:Math.min(.5,t.cdr/100+b.spi*.0015),

function curve(fl,points){
  if(fl<=points[0][0])return points[0][1];
  for(let i=1;i<points.length;i++)if(fl<=points[i][0]){
    const[a,av]=points[i-1],[b,bv]=points[i];return lerp(av,bv,(fl-a)/(b-a));}
  const[a,av]=points[points.length-2],[b,bv]=points[points.length-1];
  return bv+(fl-b)*(bv-av)/(b-a);}

const shk=v=>{S.shake=Math.max(S.shake,v);S.shakeT=.2;};

function pDmg(base,mul){const p=S.p;

function hurtE(e,dmg,crit,kx,ky,quiet){

function breakPot(q){if(!q||q.t!=="barrel"||q.hp<=0)return false;

function hitPotsCircle(x,y,r){let hit=false;for(const q of S.props)

function hitPotsCone(x,y,face,range,arc){let hit=false;for(const q of S.props){

  let a=Math.atan2(q.y-y,q.x-x)-face;while(a>Math.PI)a-=TAU;while(a<-Math.PI)a+=TAU;

function hurtP(dm,cause,force,attackerElement="neutral"){const p=S.p;if(S.training||S.returnInvulnerable||(p.hurtT>0&&!force)||p.invulT>0)return;

  p.hp-=d;p.lastHit=0;if(p.returnCast>0){p.returnCast=0;p.returnSlot=-1;toast("帰還詠唱が中断された","ng");}p.hurtT=.42;S.flash=.18;shk(CFG.SHAKE_HURT);SFX.hurt();buzz(38);

function basicAttack(){
  const p=S.p;if(p.itemLock>0)return;const C=p.d.C,range=C.range*p.mRange*p.d.rng;
  // 向いた方向の扇に敵がいればそいつを狙う。いなければその方向へ撃つ(引き撃ち防止)。
  const CONE=C.proj?.55:C.arc;
  let best=null,bd=1e9;
  for(const e of S.enemies){const d=d2(p.x,p.y,e.x,e.y);
    if(d>=(range+e.r)*(range+e.r))continue;
    let a=Math.atan2(e.y-p.y,e.x-p.x)-p.face;
    while(a>Math.PI)a-=TAU;while(a<-Math.PI)a+=TAU;
    if(Math.abs(a)>CONE)continue;
    if(d<bd){bd=d;best=e;}}
  if(best)p.face=Math.atan2(best.y-p.y,best.x-p.x);
  p.atkN++;
  const nextStep=S.cls==="warrior"?(p.comboT>0?(p.comboStep%3)+1:1):1;
  const crit=rnd()<(p.d.crit+p.mCrit);
  const cm=S.cls==="warrior"?[1,1.16,1.4][nextStep-1]:1;
  const mk=()=>{let v=pDmg(C.atk,CFG.ATK_MUL)*cm;if(crit)v*=(p.d.cdmg+p.mCdmg);return v;};
  if(C.proj){
    S.bullets.push({x:p.x,y:p.y,vx:Math.cos(p.face)*C.proj.sp,vy:Math.sin(p.face)*C.proj.sp,
      dmg:mk(),crit,mine:1,col:C.proj.col,r:C.proj.r,t:0,
      boom:(hasPw("burst")&&p.atkN%4===0)?1.6:0});
    SFX.cast(S.cls==="mage"?420:640);
  }else{
    const slashCol=["#fff0c8","#ffd06a","#ff8a3a"][nextStep-1]||"#fff0c8";let landed=false;
    S.fx.push({t:"slash",x:p.x,y:p.y,tm:0,R:range,a:p.face,arc:C.arc,step:nextStep,col:slashCol});
    for(const e of S.enemies.slice()){
      const d=Math.hypot(e.x-p.x,e.y-p.y);if(d>range+e.r)continue;
      let a=Math.atan2(e.y-p.y,e.x-p.x)-p.face;
      while(a>Math.PI)a-=TAU;while(a<-Math.PI)a+=TAU;
      if(Math.abs(a)>C.arc)continue;
      hurtE(e,mk(),crit,Math.cos(p.face),Math.sin(p.face));landed=true;}
    hitPotsCone(p.x,p.y,p.face,range,C.arc);
    if(landed&&S.cls==="warrior"){p.comboStep=nextStep;p.comboT=.78;}
    for(let i=0;i<6+nextStep*4;i++){const a=p.face+rr(-C.arc,C.arc);
      S.parts.push({x:p.x+Math.cos(a)*range*.7,y:p.y+Math.sin(a)*range*.7,
        vx:Math.cos(a)*(2+nextStep*.35),vy:Math.sin(a)*(2+nextStep*.35),t:0,
        life:.12+nextStep*.025,col:slashCol,sz:2+nextStep*.55});}
    shk(1.0+nextStep*.65);}
  if(hasPw("chainL")&&best&&best.hp>0){
    let n2=null,nd=1e9;
    for(const e of S.enemies){if(e===best)continue;const d=d2(best.x,best.y,e.x,e.y);
      if(d<nd&&d<9){nd=d;n2=e;}}
    if(n2){S.fx.push({t:"line",x:best.x,y:best.y,x2:n2.x,y2:n2.y,tm:0,col:"#a0d0ff"});
      hurtE(n2,pDmg(C.atk,CFG.ATK_MUL)*.4,false,0,0,true);}}
  return true;}

const ISO_K=2*Math.sqrt((CFG.TILE_W/2)*(CFG.TILE_H/2));
function s2w(sx,sy){
  const l=Math.hypot(sx,sy)||1,nx=sx/l,ny=sy/l;
  return {x:(nx/(CFG.TILE_W/2)+ny/(CFG.TILE_H/2))/2*ISO_K,
          y:(ny/(CFG.TILE_H/2)-nx/(CFG.TILE_W/2))/2*ISO_K,
          mag:Math.min(1,l)};}

function blinkForward(p,a,len){
  const steps=8,ox=p.x,oy=p.y;let nx=ox,ny=oy;
  for(let n=1;n<=steps;n++){const tx=ox+Math.cos(a)*len*n/steps,ty=oy+Math.sin(a)*len*n/steps;
    if(walk(tx,ty,p.r)){nx=tx;ny=ty;}else break;}
  p.x=nx;p.y=ny;
  S.parts.push({x:p.x,y:p.y,vx:-Math.cos(a)*1.8,vy:-Math.sin(a)*1.8,t:0,life:.22,col:"#8ad8ff",sz:4});}
function useSkill(i){
  if(S.p.itemLock>0)return;
  const p=S.p,C=p.d.C,sk=C.skills[i];
  if(!sk||p.cds[i]>0||p.mp<sk.c)return;
  p.mp-=sk.c;p.cds[i]=sk.cd*p.mCd*(1-p.d.cdr);
  const mul=hasPw("multi")?1.3:1;
  let a=p.face;
  if(IN.dx||IN.dy){const w=s2w(IN.dx,IN.dy);a=Math.atan2(w.y,w.x);}

function automationWaypoint(p,target){
  const start=(p.y|0)*MW+(p.x|0),goal=(target.y|0)*MW+(target.x|0),prev=new Int32Array(MW*MH);prev.fill(-2);prev[start]=-1;

function update(dt){

      if(solid(b.x|0,b.y|0)){dead=true;break;}
      if(b.mine){
        for(const q of S.props)if(q.t==="barrel"&&q.hp>0&&d2(b.x,b.y,q.x,q.y)<.36){
          breakPot(q);if(b.boom)S.fx.push({t:"boom",x:b.x,y:b.y,tm:0,R:b.boom,col:b.col,dmg:b.dmg*.7,hit:new Set()});dead=true;break;}
        if(dead)break;
        for(const e of S.enemies)if(d2(b.x,b.y,e.x,e.y)<Math.pow(.28+e.r,2)){
          if(b.boom)S.fx.push({t:"boom",x:b.x,y:b.y,tm:0,R:b.boom,col:b.col,dmg:b.dmg*.7,hit:new Set()});
          hurtE(e,b.dmg,b.crit,b.vx*.02,b.vy*.02);dead=true;break;}
      }else if(d2(b.x,b.y,p.x,p.y)<.16){
        hurtP(b.dmg,b.homing?"追尾弾":"敵の投射攻撃",false,b.element);
        /* 減速は祭壇とは別の時計で持つ。以前は p.sMs と p.shrineT を流用しており、
           祭壇の効果中に減速を受けると2秒のはずの減速が祭壇の残り時間（最大50秒）続き、
           疾風の祭壇は +28% が -35% に反転したまま張り付いていた。
           逆に祭壇の残りが2秒未満だと祭壇の方が延命されていた。 */
        if(b.slow){p.slowMs=.65;p.slowT=Math.max(p.slowT,2);updBuffs();}
        if(b.st)applyST(p,b.st,2.2,true);
        dead=true;}}
    if(dead)S.bullets.splice(i,1);}

  for(let i=S.fx.length-1;i>=0;i--){
    const f=S.fx[i];const first=f.tm===0;f.tm+=dt;
    if(f.t==="boom"){
      if(first){burst(f.x,f.y,f.col,18,2);
        if(f.en){if(d2(f.x,f.y,p.x,p.y)<f.R*f.R)hurtP(f.dmg,"爆発",false,f.element);}
        else {hitPotsCircle(f.x,f.y,f.R);for(const e of S.enemies.slice()){
          if(f.hit&&f.hit.has(e))continue;
          if(d2(f.x,f.y,e.x,e.y)<Math.pow(f.R+e.r,2)){if(f.hit)f.hit.add(e);
            hurtE(e,f.dmg,false,0,0,true);}}}}
      if(f.tm>.34)S.fx.splice(i,1);}
    else if(f.t==="pool"){f.tick-=dt;
      if(f.tick<=0){f.tick=.4;if(d2(f.x,f.y,p.x,p.y)<f.R*f.R){hurtP(f.dmg*.4,"炎上した地面",false,f.element);applyST(p,"brn",2.5,true);}}
      if(f.tm>f.dur)S.fx.splice(i,1);}
    else if(f.tm>(f.t==="line"?.16:f.t==="slash"?.22:.42))S.fx.splice(i,1);}

  for(let i=S.drops.length-1;i>=0;i--){
    const d=S.drops[i];d.t+=dt;
    const dist=Math.hypot(p.x-d.x,p.y-d.y);
    // 0.1秒後から吸着。0.5m圏内は足元で拾った時と同じく即時回収する。
    // 回復は満タンでも消費して回収できるため、回収不能な落下物として残らない。
    if(d.t>=CFG.PICKUP_DELAY&&dist<=CFG.MAGNET_RADIUS&&dist>CFG.PICKUP_RADIUS&&!(d.pot&&!S.loadout.some((k,j)=>k==="heal"&&S.runItems[j]<CONSUMABLES.heal.max))){
      const pull=Math.min(dist,CFG.MAGNET_SPEED*dt);d.x+=(p.x-d.x)/dist*pull;d.y+=(p.y-d.y)/dist*pull;}
    const pr=CFG.PICKUP_RADIUS;
    if(d.t>=CFG.PICKUP_DELAY&&d2(d.x,d.y,p.x,p.y)<pr*pr){
      if(d.mat){const n=(d.n||1)*(S.dailyMatMul||1),added=d.mat==="core"?earnCore(d.tier,n):addMat(d.mat,d.tier,n);SFX.gold();if(added)toast(`${d.mat==="core"?"核":"結晶"} 階梯${d.tier} +${added}`);}
      else if(d.shard){
        p.hp=Math.min(p.max,p.hp+p.max*CFG.SHARD_HEAL);
        burst(p.x,p.y,"#6ae0a0",6,1);tone(760,.07,"sine",.08,1040);}
      else if(d.gold){S.gold+=d.gold;S.runGold+=d.gold;SFX.gold();}
      else if(d.pot){const j=S.loadout.findIndex((k,j)=>k==="heal"&&S.runItems[j]<CONSUMABLES.heal.max);if(j<0)continue;S.runItems[j]++;S.consumables.heal=(S.consumables.heal||0)+1;SFX.pot();}
      else{S.bag.push(d.it);SFX.gold();}
      S.drops.splice(i,1);}}
  for(const q of S.props)if(q.t==="shrine")q.tm+=dt;

  for(let i=S.parts.length-1;i>=0;i--){const q=S.parts[i];q.t+=dt;
    if(q.t>=q.life){S.parts.splice(i,1);continue;}
    q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.9;q.vy*=.9;}
  for(let i=S.nums.length-1;i>=0;i--){S.nums[i].t+=dt;if(S.nums[i].t>.8)S.nums.splice(i,1);}
  for(let i=S.corpses.length-1;i>=0;i--){S.corpses[i].t+=dt;if(S.corpses[i].t>4)S.corpses.splice(i,1);}
  if(S.comboT>0){S.comboT-=dt;if(S.comboT<=0)S.combo=0;}
  while(S.dmgLog.length&&S.dmgLog[0].t<S.runT-5)S.dmgLog.shift();
  S.dps=Math.round(S.dmgLog.reduce((a,x)=>a+x.v,0)/5);
  S.portal.t+=dt;S.stairs.t+=dt;
  updAction();updHUD();}

function bossAI(e,d,ux,uy,dt){

  if(e.tel>0){e.tel-=dt;
    if(e.tel<=0){
      if(e.telK==="charge")S.fx.push({t:"boom",x:e.x+Math.cos(e.telA)*2.8,y:e.y+Math.sin(e.telA)*2.8,
        tm:0,R:2.4,col:e.col,dmg:e.dmg*1.4,en:1});

function updAction(){

    if(q.t==="shrine"&&!q.used&&d2(q.x,q.y,p.x,p.y)<1.6)sh=q;
    if(q.t==="chest"&&!q.open&&d2(q.x,q.y,p.x,p.y)<1.6)ch=q;}
  const clear=!enemyNear(p.x,p.y,CFG.EXIT_CLEAR);
  if(sh){a.style.display="block";a.className="use";a.textContent=sh.s.n+" — "+sh.s.d;a.dataset.a="shrine";}
  else if(ch){a.style.display="block";a.className="use";a.textContent="宝箱を開ける";a.dataset.a="chest";}
  else if(onS){a.style.display="block";

    else if(S.boss){a.className="no";a.textContent="ボスを倒せ";a.dataset.a="";}
    else if(!clear){a.className="no";a.textContent="周囲に敵がいる（10m以内）";a.dataset.a="";}
    else{a.className="down";a.textContent="深度 "+(S.floor+1)+" へ — "+dangerOf(S.floor+1).n;a.dataset.a="down";}}
  else if(onP){a.style.display="block";
    if(!clear){a.className="no";a.textContent="周囲に敵がいる（10m以内）";a.dataset.a="";}
    else{a.className="up";a.textContent="拠点へ帰還 ("+S.bag.length+"個)";a.dataset.a="up";}}

function doAction(){
  const a=$("act").dataset.a,p=S.p;
  if(!a)return;
  if(a==="down"){ask("深度 "+(S.floor+1)+" へ進む",
    "危険度: "+dangerOf(S.floor+1).n,()=>enterFloor(S.floor+1));}
  else if(a==="up"){ask("拠点へ帰還する",

  else if(a==="shrine"){
    for(const q of S.props)if(q.t==="shrine"&&!q.used&&d2(q.x,q.y,p.x,p.y)<1.6){
      const rate=shrineRate(q.s);
      ask(q.s.n+" に触れる",`${q.s.d}\n成功率 ${Math.round(rate*100)}%（運 ${p.d.luk}）\n失敗すると逆の効果`,
        ()=>{q.used=1;p.shrine=q.s;p.shrineT=q.s.dur;
          if(rnd()<rate){q.s.f(p);p.shrineGood=1;SFX.shrine();buzz([0,30,40,30]);toast("成功: "+q.s.n,"ok");
            S.fx.push({t:"ring",x:q.x,y:q.y,tm:0,R:3,col:"#ffe090"});}
          else{q.s.bad(p);p.shrineGood=0;SFX.ng();buzz(90);

          updBuffs();});

  else if(a==="chest"){
    for(const q of S.props)if(q.t==="chest"&&!q.open&&d2(q.x,q.y,p.x,p.y)<1.6){openLock(q);break;}}

/* ---------- 宝箱の錠前（運に依存するミニゲーム） ---------- */
let LK=null;
function chestRarity(){
  const early=S.floor<4,roll=rnd(),mf=S.p.d.mf+S.p.mDrop+S.p.sDrop-2;
  const bonus=clamp(mf*.04,0,.10);
  if(early)return roll<.72?0:roll<.94?1:2;
  if(roll<.50-bonus)return 0;
  if(roll<.82-bonus*.5)return 1;
  if(roll<.95)return 2;
  return roll<.992?3:4;}
function nextLockTarget(){
  const rar=LK.rar,round=LK.round,luk=S.p.d.luk;
  LK.center=rr(.18,.82);
  const earlyEase=clamp((6-S.floor)*.025,0,.12);
  LK.zone=clamp(.34+earlyEase+luk*.006-rar*.035-round*.065-S.floor*.0025,.09,.52);
  LK.speed=.62+S.floor*.012+rar*.18+round*.22+rnd()*.28;}
function openLock(q){
  S.paused=true;for(let i=0;i<4;i++)HELD[i]=false;
  const luk=S.p.d.luk,rar=q.rar??chestRarity();q.rar=rar;
  LK={q,rar,round:0,ok:0,pos:rnd(),dir:rnd()<.5?1:-1,center:.5,zone:.3,speed:.8,done:false};
  nextLockTarget();
  $("lockD").textContent=`中身 ${CFG.RARITY[rar][0]} / 運 ${luk} — 成功数で中身は変わらない。判定位置は毎回変化し、3回目ほど難しい`;
  renderLock();$("lockPop").classList.add("on");}
function renderLock(){
  const z=$("lockZone"),w=LK.zone*100;
  z.style.left=((LK.center-LK.zone/2)*100)+"%";z.style.width=w+"%";
  $("lockPin").style.left=(LK.pos*100)+"%";
  const ps=$("lockPips");ps.innerHTML="";
  for(let i=0;i<3;i++){const d=document.createElement("div");
    d.className="pip"+(i<LK.round?(LK.res&&LK.res[i]?" ok":" ng"):"");ps.appendChild(d);}}
function lockTick(dt){
  if(!LK||LK.done)return;
  LK.pos+=LK.dir*LK.speed*dt;
  if(LK.pos>1){LK.pos=1;LK.dir=-1;}if(LK.pos<0){LK.pos=0;LK.dir=1;}
  $("lockPin").style.left=(LK.pos*100)+"%";}
function lockHit(){
  if(!LK||LK.done)return;
  LK.res=LK.res||[];
  const hit=Math.abs(LK.pos-LK.center)<LK.zone/2;
  LK.res[LK.round]=hit;if(hit){LK.ok++;SFX.ok();buzz(20);}else{
    // 一度でも失敗したら宝箱は失われ、その場で階層相応の敵が出現する。
    LK.done=true;LK.q.open=1;SFX.ng();buzz(60);renderLock();
    const count=clamp(1+Math.floor(S.floor/12),1,5);
    for(let i=0;i<count;i++)spawnE(rnd()<Math.min(.45,S.floor*.012)?"grunt":"swarm",LK.q.x+rr(-2,2),LK.q.y+rr(-2,2),S.floor,false);
    setTimeout(()=>{$("lockPop").classList.remove("on");S.paused=false;toast("開錠失敗 — 敵が現れた","ng");LK=null;},300);return;}
  LK.round++;if(LK.round<3)nextLockTarget();
  renderLock();
  if(LK.round>=3){
    LK.done=true;
    setTimeout(()=>{
      $("lockPop").classList.remove("on");
      const q=LK.q;q.open=1;S.paused=false;
      SFX.chest();
      dropItem(q.x+rr(-1,1),q.y+rr(-1,1),LK.rar);
      dropGold(q.x,q.y,Math.round((35+S.floor*15)*(1+LK.rar*.35)));
      toast(`${CFG.RARITY[LK.rar][0]}の宝箱 ${LK.ok}/3`);
      LK=null;},520);}}

let camX=0,camY=0;
const iso=(x,y)=>({sx:(x-y)*(CFG.TILE_W/2),sy:(x+y)*(CFG.TILE_H/2)});
const SPR=new Map();
let TSPR=null;
function tileSprites(){
  if(TSPR)return TSPR;
  const HW=CFG.TILE_W/2,HH=CFG.TILE_H/2,WH=28;
  const mk=(w,h,ox,oy,fn)=>{const c=document.createElement("canvas");
    c.width=Math.ceil(w*DPR);c.height=Math.ceil(h*DPR);
    c._w=w;c._h=h;c._ox=ox;c._oy=oy;
    const g=c.getContext("2d");g.setTransform(DPR,0,0,DPR,0,0);fn(g,ox,oy);return c;};
  const floors=[];
  for(let v=0;v<5;v++){const b=v*3;
    floors.push(mk(CFG.TILE_W+2,CFG.TILE_H+2,HW+1,HH+1,(g,ox,oy)=>{
      const fg=g.createLinearGradient(ox-HW,oy-HH,ox+HW,oy+HH);
      fg.addColorStop(0,`rgb(${35+b},${32+b},${42+b})`);fg.addColorStop(.55,`rgb(${24+b},${23+b},${31+b})`);
      fg.addColorStop(1,`rgb(${16+b},${16+b},${22+b})`);g.fillStyle=fg;
      g.beginPath();g.moveTo(ox,oy-HH);g.lineTo(ox+HW,oy);
      g.lineTo(ox,oy+HH);g.lineTo(ox-HW,oy);g.closePath();g.fill();
      g.strokeStyle="rgba(0,0,0,.5)";g.lineWidth=1;g.stroke();
      g.strokeStyle="rgba(150,135,170,.10)";g.lineWidth=.7;g.beginPath();
      g.moveTo(ox-HW*.62,oy+HH*.12);g.lineTo(ox-HW*.18,oy-HH*.08);g.lineTo(ox+HW*.18,oy+HH*.16);
      if(v%2){g.moveTo(ox+HW*.12,oy-HH*.52);g.lineTo(ox+HW*.3,oy-HH*.12);g.lineTo(ox+HW*.58,oy);}g.stroke();
      g.fillStyle="rgba(205,190,220,.08)";for(let i=0;i<4;i++)g.fillRect(ox-HW*.7+((i*17+v*11)%36),oy-HH*.55+((i*7+v*5)%12),1,1);}));}
  const wall=mk(CFG.TILE_W+2,CFG.TILE_H+WH+2,HW+1,HH+WH+1,(g,ox,oy)=>{
    g.fillStyle="#101015";
    g.beginPath();g.moveTo(ox-HW,oy);g.lineTo(ox,oy+HH);
    g.lineTo(ox,oy+HH-WH);g.lineTo(ox-HW,oy-WH);g.closePath();g.fill();
    g.fillStyle="#0b0b0f";
    g.beginPath();g.moveTo(ox+HW,oy);g.lineTo(ox,oy+HH);
    g.lineTo(ox,oy+HH-WH);g.lineTo(ox+HW,oy-WH);g.closePath();g.fill();
    g.fillStyle="#1d1d26";
    g.beginPath();g.moveTo(ox,oy-HH-WH);g.lineTo(ox+HW,oy-WH);
    g.lineTo(ox,oy+HH-WH);g.lineTo(ox-HW,oy-WH);g.closePath();g.fill();
    g.strokeStyle="rgba(150,150,190,.22)";g.lineWidth=1;g.stroke();
    g.strokeStyle="rgba(120,110,140,.18)";g.lineWidth=.8;
    for(let y=oy-WH+6;y<oy;y+=7){g.beginPath();g.moveTo(ox-HW+(y%14?5:0),y);g.lineTo(ox+HW-(y%14?5:0),y);g.stroke();}
    g.strokeStyle="rgba(220,205,235,.12)";g.beginPath();g.moveTo(ox-HW*.8,oy-WH-2);g.lineTo(ox,oy-HH-WH+3);g.stroke();});
  TSPR={floors,wall};return TSPR;}
const blit=(c,sx,sy)=>ctx.drawImage(c,0,0,c.width,c.height,sx-c._ox,sy-c._oy,c._w,c._h);
function eShape(g,k,sx,sy,h,w,body,rim){
  g.fillStyle=body;g.strokeStyle=rim;g.lineWidth=1.7;g.beginPath();
  if(k==="swarm"){
    g.ellipse(sx,sy-h*.42,w*1.05,h*.44,0,0,TAU);
    for(let i=-1;i<=1;i++){g.moveTo(sx+i*w*.6,sy-h*.2);g.lineTo(sx+i*w*.95,sy+1);}
    g.fill();g.stroke();return;}
  if(k==="brute"){
    g.moveTo(sx,sy-h);g.lineTo(sx+w*1.35,sy-h*.74);g.lineTo(sx+w*1.05,sy-h*.12);
    g.lineTo(sx+w*.55,sy+2);g.lineTo(sx-w*.55,sy+2);
    g.lineTo(sx-w*1.05,sy-h*.12);g.lineTo(sx-w*1.35,sy-h*.74);
    g.closePath();g.fill();g.stroke();return;}
  if(k==="caster"){
    g.moveTo(sx,sy-h*1.12);g.quadraticCurveTo(sx+w,sy-h*.3,sx+w*.7,sy+2);
    g.lineTo(sx-w*.7,sy+2);g.quadraticCurveTo(sx-w,sy-h*.3,sx,sy-h*1.12);
    g.moveTo(sx+w*1.1,sy+1);g.lineTo(sx+w*.8,sy-h);
    g.closePath();g.fill();g.stroke();return;}
  if(k==="archer"){
    g.ellipse(sx,sy-h*.5,w*.66,h*.52,0,0,TAU);
    g.moveTo(sx+w+h*.42,sy-h*.5);g.arc(sx+w,sy-h*.5,h*.42,-1.1,1.1);
    g.fill();g.stroke();return;}
  if(k==="bomber"){
    g.arc(sx,sy-h*.5,w,0,TAU);
    g.moveTo(sx,sy-h);g.quadraticCurveTo(sx+w*.7,sy-h*1.3,sx+w*.3,sy-h*1.5);
    g.fill();g.stroke();return;}
  if(k==="boss"){
    g.moveTo(sx,sy-h);g.quadraticCurveTo(sx+w*1.25,sy-h*.7,sx+w*.9,sy+2);
    g.lineTo(sx-w*.9,sy+2);g.quadraticCurveTo(sx-w*1.25,sy-h*.7,sx,sy-h);
    g.moveTo(sx-w*.55,sy-h*.92);g.lineTo(sx-w*1.15,sy-h*1.3);
    g.moveTo(sx+w*.55,sy-h*.92);g.lineTo(sx+w*1.15,sy-h*1.3);
    g.closePath();g.fill();g.stroke();return;}
  g.moveTo(sx,sy-h);
  g.quadraticCurveTo(sx+w,sy-h*.72,sx+w*.78,sy-h*.16);
  g.quadraticCurveTo(sx+w*.5,sy+2,sx,sy+2);

  let cnt=0;for(let i=0;i<MW*MH;i++)if(seen[i])cnt++;
  if(cnt!==mmSeen){mmSeen=cnt;const g=MMBG.getContext("2d");
    g.clearRect(0,0,88,88);g.fillStyle="#3a3a4a";
    for(let y=0;y<MH;y++)for(let x=0;x<MW;x++)
      if(map[y*MW+x]&&seen[y*MW+x])g.fillRect(x*sc,y*sc,sc+.6,sc+.6);}
  mctx.clearRect(0,0,88,88);
  mctx.fillStyle="rgba(20,20,28,.85)";mctx.fillRect(0,0,88,88);
  mctx.drawImage(MMBG,0,0);
  mctx.fillStyle="#e08830";mctx.fillRect(S.stairs.x*sc-1.5,S.stairs.y*sc-1.5,3.5,3.5);
  mctx.fillStyle="#5aa0ff";mctx.fillRect(S.portal.x*sc-1.5,S.portal.y*sc-1.5,3.5,3.5);
  for(const e of S.enemies)if(e.agro||e.elite||e.boss){
    mctx.fillStyle=e.boss?"#ff3030":e.elite?e.elite.col:"#a04040";
    mctx.fillRect(e.x*sc-1,e.y*sc-1,e.boss?4:2.2,e.boss?4:2.2);}
  for(const q of S.props)if(S.tactical.reveal&&(q.t==="chest"||q.t==="shrine")){mctx.fillStyle="#ffd24a";mctx.fillRect(q.x*sc-1.5,q.y*sc-1.5,3,3);}
  for(const d of S.drops)if(d.it){mctx.fillStyle=rarCol(d.rar);
    mctx.fillRect(d.x*sc-1,d.y*sc-1,2.4,2.4);}
  mctx.fillStyle="#fff";mctx.fillRect(p.x*sc-1.5,p.y*sc-1.5,3.5,3.5);}

function repeatBtn(el,fn){
  let tm=null,iv=null;
  const start=()=>{fn();tm=setTimeout(()=>{iv=setInterval(fn,70);},380);};
  const stop=()=>{clearTimeout(tm);clearInterval(iv);tm=iv=null;};
  el.addEventListener("touchstart",e=>{e.preventDefault();e.stopPropagation();aInit();start();},{passive:false});
  el.addEventListener("touchend",stop,{passive:true});
  el.addEventListener("touchcancel",stop,{passive:true});
  el.addEventListener("mousedown",e=>{e.preventDefault();e.stopPropagation();aInit();start();});
  addEventListener("mouseup",stop);}
function allocBlock(host,after){
  const b2=S.base,C=CLASSES[S.cls];
  if(!S.alloc)S.alloc={add:{str:0,mag:0,def:0,agi:0,spi:0,luk:0}};
  const A=S.alloc;
  // 残りは常に「現在の所持 − 仮置き分」で出す。絶対値を保持すると
  // 潜行中に得たポイントが確定時に上書きされて消える。
  const spent=Object.values(A.add).reduce((a,v)=>a+v,0);
  A.pts=b2.pts-spent;
  const dirty=spent>0;
  const c=document.createElement("div");c.className="card pointBox";
  c.innerHTML=`<div class="st">残りポイント <b style="color:#a8e07a">${A.pts}</b>`+
    (dirty?' <span style="color:var(--gold)">— 未確定</span>':"")+`</div>`;
  host.appendChild(c);
  for(const[k,nm,ds]of STATDEF){
    const d=document.createElement("div");d.className="alloc";
    d.innerHTML=`<div><div class="an">${nm}</div><div class="ad">${ds}</div></div>
      <div style="display:flex;align-items:center;gap:7px">
      <div class="av">${C[k]+b2[k]+A.add[k]}`+
      (A.add[k]?`<span style="color:#7ad04e;font-size:11px"> +${A.add[k]}</span>`:"")+`</div></div>`;
    const box=d.lastElementChild;
    const mi=document.createElement("div");mi.className="plus"+(A.add[k]>0?"":" no");mi.textContent="−";
    repeatBtn(mi,()=>{if(A.add[k]<=0)return;A.add[k]--;A.pts++;SFX.tick();after();});
    const pl=document.createElement("div");pl.className="plus"+(A.pts>0?"":" no");pl.textContent="+";
    repeatBtn(pl,()=>{if(A.pts<=0)return;A.add[k]++;A.pts--;SFX.tick();after();});
    box.insertBefore(mi,box.firstChild);box.appendChild(pl);host.appendChild(d);}
  const ok=document.createElement("div");ok.className="btn"+(dirty?" pri":" no");ok.textContent="確定する";
  tapEl(ok,()=>{if(!dirty)return;
    for(const k in A.add){b2[k]+=A.add[k];b2.pts-=A.add[k];}
    S.alloc=null;S.p.d=derive();recalcHP(S.p);

  host.appendChild(ok);
  if(dirty){const cn=document.createElement("div");cn.className="btn gh";cn.textContent="やり直す";
    tapEl(cn,()=>{S.alloc=null;after();});host.appendChild(cn);}
  const cost=Math.round((200+S.deepest*90)*5);   // 商店の掘り出し物の5倍
  const r=document.createElement("div");r.className="btn gh"+(S.gold>=cost?"":" no");
  r.textContent=`振り直し — ${cost} G`;
  tapEl(r,()=>{if(S.gold<cost)return;
    S.gold-=cost;for(const[k]of STATDEF){b2.pts+=b2[k];b2[k]=0;}

  host.appendChild(r);}

function itemStatTotals(it){const t={};if(!it)return t;

function compareItemStats(it,other,isAfter){if(!it)return "効果なし";

  let h=Object.keys(own).map(k=>{const d=(own[k]||0)-(base[k]||0),cls=isAfter?(d>0?"up":d<0?"dn":""):"";
    return `<span class="${cls}">${AFN(k)} +${own[k]}${AFP(k)?"%":""}</span>`;}).join("<br>");

function startDive(){

  const pageSize=6,maxPage=Math.max(0,Math.ceil(starts.length/pageSize)-1);

  const nav=document.createElement("div");nav.className="g2";
  const newer=document.createElement("div");newer.className="btn gh"+(S.startPage<=0?" no":"");newer.textContent="より深い";
  tapEl(newer,()=>{if(S.startPage<=0)return;S.startPage--;startDive();});nav.appendChild(newer);

const KEY="descent_v5";
function save(){storeActiveCharacter();try{localStorage.setItem(KEY,JSON.stringify({cls:S.cls,deepest:S.deepest,
  gold:S.gold,stash:S.stash,gear:S.gear,base:S.base,log:S.log,mats:S.mats,consumables:S.consumables,loadout:S.loadout,consumableVersion:1,
  matTierVersion:2,
  settings:S.settings,admin:S.admin,debug:S.debug,debugFloor:S.debugFloor,adminOpts:S.adminOpts,chars:S.chars,characterStates:S.characterStates,avatars:S.avatars,formation:S.formation,diveFloor:S.diveFloor,stamina:S.stamina,daily:S.daily,premium:S.premium,paidInventory:S.paidInventory,profileAvatar:S.profileAvatar,shopSub:S.shopSub,gearSub:S.gearSub,unlockedCharacters:S.unlockedCharacters,tutorial:S.tutorial,returnInvulnerable:S.returnInvulnerable,breakthroughs:S.breakthroughs,breakthroughProgress:S.breakthroughProgress,weeklyCore:S.weeklyCore,beginnerClaimed:S.beginnerClaimed}));}catch(e){}}
/* セーブの数値は必ず有限な数へ均す。文字列や負値がそのまま入ると
   S.gold+=500 が文字列連結になったり、深度が負のまま階梯計算へ流れる。 */
const numAt=(v,fallback,min)=>{const n=Number(v);return Number.isFinite(n)?(min==null?n:Math.max(min,n)):fallback;};
function load(){try{
  const d=JSON.parse(localStorage.getItem(KEY)||"null");
  if(!d||!d.cls||!CLASSES[d.cls])return false;
  S.cls=d.cls;S.deepest=numAt(d.deepest,1,1);S.gold=numAt(d.gold,0,0);S.stash=Array.isArray(d.stash)?d.stash:[];
  S.mats={crystal:Object.assign({},d.mats&&d.mats.crystal||{}),core:Object.assign({},d.mats&&d.mats.core||{})};
  if((d.matTierVersion||1)<2)for(const kind of ["crystal","core"]){const old=S.mats[kind],moved={};for(const [tier,n] of Object.entries(old))moved[Math.max(1,(+tier||1)-1)]=(moved[Math.max(1,(+tier||1)-1)]||0)+n;S.mats[kind]=moved;}
  const fix=it=>{
    if(!it)return null;
    if(!ELEMENTS[it.element])it.element="neutral"; // 属性導入前の装備は無属性として安全に移行
    if(it.slot==="belt")return null;                 // ベルトは廃止
    if(it.slot==="ring1"||it.slot==="ring2")it.slot="ring";
    if(!it.main){                                    // 旧: 主ステが affs[0] だった
      const sd=SLOTS.find(x=>x.k===it.slot)||SLOTS[1];
      const a=(it.affs&&it.affs.shift())||{id:sd.main,v:1};
      it.main={id:sd.k==="weapon"?"atk":sd.main,v:a.v};}
    if(it.slot==="weapon"&&!it.wt){it.wt="sword";it.base=pick(WEAPN.sword);}
    if(LEGACY_BASE_NAMES[it.base]){const old=it.base;it.base=LEGACY_BASE_NAMES[old];if(it.name)it.name=it.name.replace(old,it.base);}
    if(!it.lv){it.lv=1;it.xp=0;}
    it.affs=(it.affs||[]).filter(a=>AFF.some(x=>x.id===a.id));
    it.score=iScore(it);return it;};
  S.stash=S.stash.map(fix).filter(Boolean);
  S.gear=d.gear||{};
  const ng={};for(const k of SLOTK)ng[k]=null;
  for(const k in S.gear){const it=fix(S.gear[k]);if(it&&!ng[it.slot])ng[it.slot]=it;}
  S.gear=ng;
  S.consumables=Object.assign({},d.consumables||{});if(!d.consumableVersion)S.consumables.heal=(S.consumables.heal||0)+3;S.loadout=(d.loadout||["heal",null,null,null]).slice(0,6);while(S.loadout.length<loadoutCapacity())S.loadout.push(null);S.runItems=[0,0,0,0];S.log=d.log||{runs:[]};
  S.settings=Object.assign({map:1,dmg:1,shake:1,dps:1,loot:1,timer:1,stick:1,eco:0,controlMode:"manual",autoPreset:"aggressive",automationEditor:0},d.settings||{});
  S.admin=!!d.admin;S.debug=!!d.debug;S.debugFloor=numAt(d.debugFloor,1,1);S.adminOpts=d.adminOpts||{};S.chars=d.chars||{};S.characterStates=d.characterStates||{};S.avatars=d.avatars||{};S.breakthroughs=d.breakthroughs||{};S.breakthroughProgress=d.breakthroughProgress||{};S.weeklyCore=d.weeklyCore||{week:"",bought:0};S.beginnerClaimed=!!d.beginnerClaimed;
  S.unlockedCharacters=Array.isArray(d.unlockedCharacters)&&d.unlockedCharacters.length?d.unlockedCharacters:["warrior:gai"];S.tutorial=d.tutorial||{phase:"done",gearIndex:0};S.returnInvulnerable=!!d.returnInvulnerable;
  S.formation=(Array.isArray(d.formation)?d.formation:[]).filter(k=>S.unlockedCharacters.includes(k)).slice(0,formationCapacity());S.diveFloor=numAt(d.diveFloor,1,1);S.daily=d.daily||null;S.stamina=d.daily?clamp(d.stamina==null?3:d.stamina,0,3):3;ensureDaily();S.premium=numAt(d.premium,0,0);S.paidInventory=Object.assign({catalysts:[],feathers:[],slots:[]},d.paidInventory||{});S.profileAvatar=d.profileAvatar||null;S.shopSub=d.shopSub||"gacha";S.gearSub=d.gearSub||"equip";
  if(!S.avatars[S.cls])S.avatars[S.cls]=CHARACTERS[S.cls][0].id;
  const normalizeBase=raw=>{const b=Object.assign({lv:1,xp:0,pts:0,str:0,mag:0,def:0,agi:0,spi:0,luk:0},raw||{});
    if(!b.xpCurveV2){
      const oldLv=Math.max(1,Math.min(1e6,Number(b.lv)||1)|0),oldExtra=Math.max(0,b.para|0);
      let total=legacyXpCum(oldLv)+(Number(b.xp)||0)+oldExtra*Math.max(10,legacyXpCum(100)-legacyXpCum(99));
      /* legacyXpCum は Lv10万あたりで Infinity になり、Infinity<=Infinity が永久に真になって
         起動時に固まっていた（初期化ボタンにも辿り着けない）。管理者モードのレベル入力は
         任意の数を受けるので、必ず有限側で打ち切る。 */
      if(!Number.isFinite(total))total=Number.MAX_VALUE;
      let lv=1;while(lv<1e6){const next=xpCum(lv+1);if(!Number.isFinite(next)||next>total)break;lv++;}
      /* 新カーブは Lv129 あたりから旧カーブより重くなるため、素直に換算すると
         そこから上のセーブはレベルが下がる。移行で弱くなることは無い、を守る。 */
      if(lv<oldLv)lv=oldLv;
      b.pts=Math.max(0,(b.pts||0)+(lv-1)*CFG.STAT_PER_LV-((oldLv-1)*CFG.STAT_PER_LV+oldExtra));
      const carry=total-xpCum(lv);
      b.lv=lv;b.xp=Number.isFinite(carry)?Math.max(0,carry):0;b.xpCurveV2=true;
    }
    delete b.para;delete b.paraConverted;return b;};
  const nb=normalizeBase(d.base);
  delete nb.need;
  if(nb.dex!==undefined||nb.vit!==undefined){   // 旧スキーマは全部振り直しにして返す
    nb.pts+=(nb.str|0)+(nb.dex|0)+(nb.vit|0)+(nb.ene|0)+(nb.luk|0);
    nb.str=nb.mag=nb.def=nb.agi=nb.spi=nb.luk=0;
    delete nb.dex;delete nb.vit;delete nb.ene;}
  S.base=nb;
  for(const st of Object.values(S.characterStates)){st.base=normalizeBase(st.base);const fixed=emptyGear();for(const it of Object.values(st.gear||{})){const x=fix(it);if(x&&!fixed[x.slot])fixed[x.slot]=x;}st.gear=fixed;}
  const active=S.characterStates[activeCharacterKey()];if(active){S.base=active.base;S.gear=active.gear;}else S.characterStates[activeCharacterKey()]={base:S.base,gear:S.gear};
  return true;}catch(e){return false;}}

/* ---------- 起動 ---------- */
resize();
/* チュートリアル中の入力制限。
   誘導先が画面に存在しないときは必ず制限を解除する（fail open）。
   閉じ込めると復帰手段が無くなり、セーブを消す以外に進めなくなるため。 */
function tutorialAllows(el){if(el.closest("#tutorialSkip,#tutorialConfirm,#btnBack")||$("itPop").classList.contains("on")||$("askPop").classList.contains("on"))return true;const p=(S.tutorial||{}).phase;
  if(p&&p.startsWith("tour_")){
    if(!document.querySelector(".tutorialTarget"))return true;   // 案内先が無ければ制限しない
    if($("tutorialBanner").style.display!=="none")return false;
    return !!el.closest(".tutorialTarget,#tutorialSkip");}
  if(!["equip_tab","equip","shop","equip_gacha","char_gacha","formation","formation_slot"].includes(p))return true;
  const selectors={equip_tab:'#scTown .tab[data-t="gear"]',equip:`.slot[data-slot="${TUTORIAL_SLOTS[S.tutorial.gearIndex]}"]`,shop:'#scTown .tab[data-t="shop"]',equip_gacha:'[data-tutorial="equip-gacha"]',char_gacha:'[data-tutorial="char-gacha"]',formation:'#scTown .tab[data-t="prep"]',formation_slot:'.member[data-index="0"]'};
  if(!document.querySelector(selectors[p]))return true;           // 誘導先が無ければ制限しない
  if($("tutorialBanner").style.display!=="none")return false;
  return !!el.closest(selectors[p]);}
/* 弾いた入力を黙って捨てると、案内を閉じた後の画面は「押しても何も起きない」状態に見える。
   （拠点案内の最中に「潜る」を押しても無反応、という報告はこれ。）
   弾いたら案内を出し直して、どこを押せばよいのかを必ず画面に戻す。 */
let tutorialBlockT=0;
for(const ev of ["click","mousedown","touchstart"])document.addEventListener(ev,e=>{if(tutorialAllows(e.target))return;
  e.preventDefault();e.stopImmediatePropagation();
  const now=performance.now();if(now-tutorialBlockT<600)return;tutorialBlockT=now;
  refreshTutorial();toast("案内の場所をタップしてください");},true);
for(let i=0;i<4;i++)holdBtn($("s"+i),i);
(()=>{let down=null;const el=$("cv");el.addEventListener("pointerdown",e=>{if(S.settings.controlMode!=="onehand"||S.scene!=="dungeon")return;down={x:e.clientX,y:e.clientY};IN.ox=e.clientX;IN.oy=e.clientY;});el.addEventListener("pointermove",e=>{if(!down||S.settings.controlMode!=="onehand")return;let dx=e.clientX-down.x,dy=e.clientY-down.y,l=Math.hypot(dx,dy)||1;IN.dx=dx/l;IN.dy=dy/l;});el.addEventListener("pointerup",e=>{if(!down)return;if(Math.hypot(e.clientX-down.x,e.clientY-down.y)<12){HELD[0]=true;setTimeout(()=>HELD[0]=false,80);}IN.dx=IN.dy=0;down=null;});})();
(()=>{const el=$("pot"),fan=$("itemFan");let timer=null,open=false,sel=0;const layout=[[20,105],[65,55],[120,25],[155,72]];const draw=()=>{fan.innerHTML="";S.loadout.forEach((k,i)=>{const d=document.createElement("div");d.className="fanItem"+(i===sel?" sel":"");d.style.left=layout[i][0]+"px";d.style.top=layout[i][1]+"px";d.textContent=k?CONSUMABLES[k].icon+" "+(S.runItems[i]||0):"—";fan.appendChild(d);});};const point=e=>e.touches?e.touches[0]:e;const down=e=>{if(S.scene!=="dungeon"||S.paused)return;e.preventDefault();open=false;timer=setTimeout(()=>{open=true;fan.classList.add("on");draw();},360);};const move=e=>{if(!open)return;e.preventDefault();const q=point(e),r=el.getBoundingClientRect(),x=q.clientX-r.left,y=q.clientY-r.top;let best=1e9;layout.forEach((v,i)=>{const z=(x-v[0]-27)**2+(y-v[1]-27)**2;if(z<best){best=z;sel=i;}});draw();};const up=e=>{clearTimeout(timer);if(open){e.preventDefault();fan.classList.remove("on");open=false;useItem(sel);}else useItem(S.itemSlot);};el.addEventListener("pointerdown",down);el.addEventListener("pointermove",move);el.addEventListener("pointerup",up);el.addEventListener("pointercancel",()=>{clearTimeout(timer);fan.classList.remove("on");open=false;});})();
hook($("act"),()=>{if(S.scene==="dungeon"&&!S.paused)doAction();});
tapEl($("profileIcon"),openProfileIconPick);
hook($("pauseB"),()=>{if(S.scene==="dungeon"&&!S.paused){S.ptab="drops";openPause();}});
tapEl($("btnResume"),()=>{$("scPause").classList.remove("on");S.paused=false;updHUD();});
tapEl($("btnGiveUp"),()=>{$("scPause").classList.remove("on");
  ask("ここで力尽きる",`編成全員を全滅扱いにして、今回拾った ${S.bag.length} 個を失って拠点に戻ります。`,()=>{S.partyIndex=S.formation.length;endRun(false,"探索を断念した");});});
tapEl($("btnBack"),leaveEnd);
tapEl($("askY"),()=>{$("askPop").classList.remove("on");S.paused=askPrevPaused;const f=askFn;askFn=null;if(f)f();});
tapEl($("askN"),()=>{$("askPop").classList.remove("on");S.paused=askPrevPaused;askFn=null;});
hook($("lockHit"),lockHit);
for(const t of document.querySelectorAll("#scTown .tab"))tapEl(t,()=>{
  const phase=(S.tutorial||{}).phase,target=t.dataset.t;
  if(phase&&phase.startsWith("tour_")&&advanceTour(target))return;
  if(phase==="equip_tab"&&target!=="gear"||phase==="shop"&&target!=="shop"||phase==="formation"&&target!=="prep")return;
  S.tab=target;
  if(phase==="equip_tab"&&target==="gear"){S.gearSub="equip";S.tutorial.phase="equip";}
  if(phase==="shop"&&target==="shop"){S.shopSub="gacha";S.tutorial.phase="equip_gacha";}
  if(phase==="formation"&&target==="prep")S.tutorial.phase="formation_slot";
  save();openTown();});
for(const t of document.querySelectorAll("#scPause .tab"))tapEl(t,()=>{S.ptab=t.dataset.p;openPause();});

/* 練習部屋は初回起動でしか組み立てられず、S.scene も保存されない。
   そのため練習中に再読込すると部屋ごと失われ、チュートリアルが training_* のまま
   永久に止まる（深度5ボスの訓練用装備一式も無料ガチャ2回も受け取れなくなる）。
   練習中の再開は、もう一度練習部屋の頭から始める。 */
const TRAINING_PHASES=["training_intro","training_cleave","training_dash","training_slam","training_potion","training_return"];
const freshStart=!load();
if(freshStart){S.cls="warrior";S.avatars.warrior="gai";S.formation=["warrior:gai"];S.profileAvatar="warrior:gai";S.gear={};for(const k of SLOTK)S.gear[k]=null;S.p=newPlayer();save();beginTraining();}
else{if(!S.formation.length)S.formation=["warrior:gai"];S.p=newPlayer();
  if(TRAINING_PHASES.includes((S.tutorial||{}).phase)){S.tutorial={phase:"training_intro",gearIndex:0};beginTraining();}
  else openTown();}

let last=performance.now(),acc=0;
function frame(now){
  requestAnimationFrame(frame);
  const fps=S.settings.eco?30:60;
  if(now-last<1000/fps*.92)return;
  let dt=(now-last)/1000;last=now;
  if(dt>.25)dt=.25;
  if(LK&&!LK.done)lockTick(dt);
  if(S.scene==="dungeon"&&!S.paused){
    const STEP=1/fps;
    acc+=dt;let n=0;
    while(acc>=STEP&&n++<4){update(STEP);acc-=STEP;}
    if(acc>STEP*4)acc=0;
    draw();}}
requestAnimationFrame(frame);
</script>
</body>
</html>
