    if(e.elite.id==="blast")S.fx.push({t:"boom",x:e.x,y:e.y,tm:0,R:3,col:"#ff5040",dmg:e.dmg*2,en:1});}
  const luk=p.d.luk;
  if(e.boss){S.boss=null;$("bossBar").style.display="none";
    S.drops.push({x:e.x+.35,y:e.y,mat:"core",tier:materialTier(S.floor),n:1,t:0});
    {const wasAtFrontier=S.diveFloor>=maxStartFloor();
     S.deepest=Math.max(S.deepest,S.floor+1);
     if(wasAtFrontier)S.diveFloor=maxStartFloor();}
    save();
    if(S.floor===5&&(S.tutorial||{}).phase==="boss"){
      S.bag.push(...TUTORIAL_SLOTS.map(tutorialItem));S.tutorial.phase="boss_message";S.returnInvulnerable=true;save();
      setTimeout(()=>ask("初回ボス撃破おめでとう！","深度3相当の訓練用装備一式を獲得しました。\n確認後はダメージを受けません。ミニマップの青い印が帰還ポータルです。そこまで戻って拠点へ帰りましょう。",()=>{S.tutorial.phase="return";S.paused=false;save();refreshTutorial();}),250);
    }else for(let k=0;k<ri(1,2);k++)dropItem(e.x+rr(-1,1),e.y+rr(-1,1),2);
    dropPart(e);
    dropGold(e.x,e.y,300+S.floor*50);if(S.floor!==5||!["boss_message","return"].includes((S.tutorial||{}).phase))toast("ボス撃破 — 深度 "+(S.floor+1)+" 開始を解放");}
  else if(e.elite){if(rnd()<.5)dropItem(e.x,e.y,1);dropGold(e.x,e.y,50+S.floor*10);}
  else{
    if(rnd()<CFG.CRYSTAL_ENEMY_DROP)S.drops.push({x:e.x,y:e.y,mat:"crystal",tier:materialTier(S.floor),n:materialScale(S.floor),t:0});
    dropPart(e);
    if(rnd()<itemDropChance(p,S.floor))dropItem(e.x,e.y);
    if(rnd()<CFG.GOLD_CHANCE)dropGold(e.x,e.y,Math.round((6+S.floor*3)*rr(.6,1.6)*(1+luk*.012)));
    if(rnd()<CFG.HEART_DROP)S.drops.push({x:e.x,y:e.y,heart:1,t:0});
    if(rnd()<CFG.SHARD_DROP)S.drops.push({x:e.x,y:e.y,shard:1,t:0});}
  if(!S.enemies.length)dailyProgress("clear",S.floor);}
function dropItem(x,y,forceRar){
  const p=S.p;
  const it=makeItem(S.floor,p.d.mf+(hasPw("greed")?.5*pwMul("greed"):0),p.d.luk,forceRar);
  S.drops.push({x,y,it,t:0,rar:it.rar});SFX.drop(it.rar);
  if(it.rar>=4){shk(7);buzz([0,50,60,140]);toast("★★ 伝説");}
  else if(it.rar===3){shk(3);buzz(30);toast("★ 秀逸");}}
function dropGold(x,y,v){S.drops.push({x,y,gold:v,t:0});}
function barrelDrop(x,y){
  if(rnd()<CFG.CRYSTAL_BARREL_DROP)S.drops.push({x,y,mat:"crystal",tier:materialTier(S.floor),n:materialScale(S.floor),t:0});
  /* ポーションは樽の副産物として独立抽選する。ここで return すると、供給を増やした分だけ
     ゴールドや破片を減らしてしまうため、以降の抽選も続ける。 */
  /* 樽から出るのは最下位の癒血の雫だけ。持ち込みに入れていない潜行では
     使い道のない瓶を床へ出さない。上位回復薬の残数へ化けることも防ぐ。 */
  if(S.loadout.includes("mend1")&&rnd()<CFG.POTION_POT_DROP)S.drops.push({x,y,pot:"mend1",t:0});
  if(rnd()<CFG.SHARD_DROP*.5){S.drops.push({x,y,shard:1,t:0});return;}
  if(rnd()<CFG.GOLD_CHANCE*.5)dropGold(x,y,Math.round((6+S.floor*3)*rr(.6,1.6)));
  if(rnd()<CFG.DROP_CHANCE*.5)dropItem(x,y);}
function breakPot(q){if(!q||q.t!=="barrel"||q.hp<=0)return false;
  q.hp=0;burst(q.x,q.y,"#8a6a3a",12,1.4);SFX.chest();barrelDrop(q.x,q.y);return true;}
function hitPotsCircle(x,y,r){let hit=false;for(const q of S.props)
  if(q.t==="barrel"&&q.hp>0&&d2(q.x,q.y,x,y)<r*r)hit=breakPot(q)||hit;return hit;}
function hitPotsCone(x,y,face,range,arc){let hit=false;for(const q of S.props){
  if(q.t!=="barrel"||q.hp<=0)continue;const d=Math.hypot(q.x-x,q.y-y);if(d>range+.35)continue;
  let a=Math.atan2(q.y-y,q.x-x)-face;while(a>Math.PI)a-=TAU;while(a<-Math.PI)a+=TAU;
  if(Math.abs(a)<=arc)hit=breakPot(q)||hit;}return hit;}
function gainXP(v){const b=S.base;b.xp+=v;
  while(b.xp>=xpNeed(b.lv)){
    b.xp-=xpNeed(b.lv);b.lv++;b.pts+=CFG.STAT_PER_LV;
    S.p.d=derive();recalcHP(S.p);SFX.lvl();save();}   // 即保存: 死んでもレベルは残る
  updHUD();}
/* 所持している全キャラクターのレベルを揃える。検証用。
   操作中の1人は S.base、それ以外は characterStates[key].base に入っている。 */
function setLevelForAll(lv){
  const next=Math.max(1,Math.floor(lv));
  storeActiveCharacter();
  S.characterStates=S.characterStates||{};
  for(const key of (S.unlockedCharacters||[])){
    const st=S.characterStates[key]||(S.characterStates[key]={base:newBase(),gear:emptyGear()});
    const b=st.base||(st.base=newBase());
    const gained=Math.max(0,next-b.lv);
    b.lv=next;b.xp=0;b.pts=(b.pts||0)+gained*CFG.STAT_PER_LV;}
  /* 操作中のキャラクターの分を書き戻す */
  const cur=S.characterStates[activeCharacterKey()];
  if(cur&&cur.base)S.base=cur.base;
  S.p.d=derive();recalcHP(S.p);SFX.lvl();
  toast(`全${(S.unlockedCharacters||[]).length}人を Lv${next} にした`,"ok");save();}
function forceLevel(lv){
  const b=S.base,next=Math.max(1,Math.floor(lv)),gained=Math.max(0,next-b.lv);
  b.lv=next;b.xp=0;b.pts+=gained*CFG.STAT_PER_LV;
  S.p.d=derive();recalcHP(S.p);
  if(gained){SFX.lvl();toast(`Lv${next}：能力ポイント +${gained*CFG.STAT_PER_LV}`);}
}
function hurtP(dm,cause,force,attackerElement="neutral"){const p=S.p;if(S.training||S.returnInvulnerable||(p.hurtT>0&&!force)||p.invulT>0)return;
  if(rnd()<dodgeRate()){p.hurtT=.16;
    S.nums.push({x:p.x,y:p.y,v:0,txt:"回避",t:0,c:"#8ad8ff"});
    tone(900,.06,"sine",.06,1300);return;}
  const incoming=attackerElement,r=resonance(),elementGuard=resonanceIncomingMultiplier(r,incoming);
  /* 装備が階層に追いついていないほど、まともに食らう。 */
  const d=dm*elementGuard*gearInMul()*(1-Math.min(.8,p.d.dr+p.mDr+p.sDr+p.buffDr+buffVal("ward","dr",0)+p.guardS*.2*pwMul("guard")));
  p.hp-=d;p.lastHit=0;if(p.returnCast>0){p.returnCast=0;p.returnSlot=-1;toast("帰還詠唱が中断された","ng");}p.hurtT=.42;S.flash=.18;shk(CFG.SHAKE_HURT);SFX.hurt();buzz(38);
  dnum(p.x,p.y,d,"#ff6060");
  if(hasPw("guard")){p.guardS=Math.min(3,p.guardS+1);p.guardT=2;}
  if(p.hp<=0){const feathers=S.paidInventory.feathers||[];if(!S.featherUsed&&feathers.length){feathers.shift();S.featherUsed=true;p.hp=p.max*.5;p.invulT=2;toast("復活の羽で復活","ok");save();}else{p.hp=0;endRun(false,cause||"敵の攻撃");}}}

function basicAttack(){
  const p=S.p;if(p.itemLock>0)return;const C=p.d.C,range=C.range*p.mRange*p.d.rng;
  // 向いた方向の扇に敵がいればそいつを狙う。いなければその方向へ撃つ(引き撃ち防止)。
  /* 扇の広さは職ごと。遠距離職を .55 固定にしていたため、射程6.2まで届くのに
     ほんの少し横へずれただけで素通りしていた。近接の 1.6 とまでは言わないが、
     狙った相手にはきちんと当たる広さを持たせる。 */
  const CONE=C.aim||(C.proj?.55:C.arc);
  let best=null,bd=1e9;
  for(const e of S.enemies){const d=d2(p.x,p.y,e.x,e.y);
    if(d>=(range+e.r)*(range+e.r))continue;
    let a=Math.atan2(e.y-p.y,e.x-p.x)-p.face;
    while(a>Math.PI)a-=TAU;while(a<-Math.PI)a+=TAU;
    if(Math.abs(a)>CONE)continue;
    if(d<bd){bd=d;best=e;}}
  if(best)p.face=Math.atan2(best.y-p.y,best.x-p.x);
  p.atkN++;
  const nextStep=S.cls==="warrior"?(p.comboT>0?(p.comboStep%3)+1:1):1;
  const crit=rnd()<(p.d.crit+p.mCrit);
  const cm=S.cls==="warrior"?[1,1.16,1.4][nextStep-1]:1;
  const mk=()=>{let v=pDmg(C.atk,CFG.ATK_MUL)*cm;if(crit)v*=(p.d.cdmg+p.mCdmg);return v;};
  if(C.proj){
    S.bullets.push({x:p.x,y:p.y,vx:Math.cos(p.face)*C.proj.sp,vy:Math.sin(p.face)*C.proj.sp,
      dmg:mk(),crit,mine:1,col:C.proj.col,r:C.proj.r,t:0,
      pierce:C.proj.pierce||0,hit:C.proj.pierce?new Set():null,kb:C.proj.kb||0,
      boom:(hasPw("burst")&&p.atkN%4===0)?1.6:0,boomMul:pwMul("burst")});
    SFX.cast(S.cls==="mage"?420:640);
  }else{
    const slashCol=["#fff0c8","#ffd06a","#ff8a3a"][nextStep-1]||"#fff0c8";let landed=false;
    S.fx.push({t:"slash",x:p.x,y:p.y,tm:0,R:range,a:p.face,arc:C.arc,step:nextStep,col:slashCol});
    for(const e of S.enemies.slice()){
      const d=Math.hypot(e.x-p.x,e.y-p.y);if(d>range+e.r)continue;
      let a=Math.atan2(e.y-p.y,e.x-p.x)-p.face;
      while(a>Math.PI)a-=TAU;while(a<-Math.PI)a+=TAU;
      if(Math.abs(a)<=C.arc){hurtE(e,mk(),crit,Math.cos(p.face),Math.sin(p.face));landed=true;continue;}
      /* 既存の扇は全威力のまま優先し、剣線より内側で扇から外れた敵だけを半威力で拾う。
         分岐を排他的にすることで、密着時にも二重ヒットしない。 */
      if(S.cls==="warrior"&&d<=range*.55+e.r){hurtE(e,mk()*.5,crit,Math.cos(p.face),Math.sin(p.face));landed=true;}}
    hitPotsCone(p.x,p.y,p.face,range,C.arc);
    if(landed&&S.cls==="warrior"){p.comboStep=nextStep;p.comboT=.78;}
    for(let i=0;i<6+nextStep*4;i++){const a=p.face+rr(-C.arc,C.arc);
      S.parts.push({x:p.x+Math.cos(a)*range*.7,y:p.y+Math.sin(a)*range*.7,
        vx:Math.cos(a)*(2+nextStep*.35),vy:Math.sin(a)*(2+nextStep*.35),t:0,
        life:.12+nextStep*.025,col:slashCol,sz:2+nextStep*.55});}
    shk(1.0+nextStep*.65);}
  if(hasPw("chainL")&&best&&best.hp>0){
    let n2=null,nd=1e9;
    for(const e of S.enemies){if(e===best)continue;const d=d2(best.x,best.y,e.x,e.y);
      if(d<nd&&d<9){nd=d;n2=e;}}
    if(n2){S.fx.push({t:"line",x:best.x,y:best.y,x2:n2.x,y2:n2.y,tm:0,col:"#a0d0ff"});
      hurtE(n2,pDmg(C.atk,CFG.ATK_MUL)*.4*pwMul("chainL"),false,0,0,true);}}
  return true;}

const ISO_K=2*Math.sqrt((CFG.TILE_W/2)*(CFG.TILE_H/2));
function s2w(sx,sy){
  const l=Math.hypot(sx,sy)||1,nx=sx/l,ny=sy/l;
  return {x:(nx/(CFG.TILE_W/2)+ny/(CFG.TILE_H/2))/2*ISO_K,
          y:(ny/(CFG.TILE_H/2)-nx/(CFG.TILE_W/2))/2*ISO_K,
          mag:Math.min(1,l)};}

function blinkForward(p,a,len){
  const steps=8,ox=p.x,oy=p.y;let nx=ox,ny=oy;
  for(let n=1;n<=steps;n++){const tx=ox+Math.cos(a)*len*n/steps,ty=oy+Math.sin(a)*len*n/steps;
    if(walk(tx,ty,p.r)){nx=tx;ny=ty;}else break;}
  p.x=nx;p.y=ny;
  S.parts.push({x:p.x,y:p.y,vx:-Math.cos(a)*1.8,vy:-Math.sin(a)*1.8,t:0,life:.22,col:"#8ad8ff",sz:4});}
function useSkill(i){
  if(S.p.itemLock>0)return;
  const p=S.p,C=p.d.C,sk=activeSkills()[i];
  if(!sk||p.cds[i]>0||p.mp<sk.c)return;
  p.mp-=sk.c;p.cds[i]=sk.cd*p.mCd*(1-p.d.cdr);
  const mul=hasPw("multi")?1+.3*pwMul("multi"):1;
  let a=p.face;
  if(IN.dx||IN.dy){const w=s2w(IN.dx,IN.dy);a=Math.atan2(w.y,w.x);}
  else{let b=null,bd=1e9;for(const e of S.enemies){const d=d2(p.x,p.y,e.x,e.y);if(d<bd){bd=d;b=e;}}
    if(b)a=Math.atan2(b.y-p.y,b.x-p.x);}
  p.face=a;
  const dmg=()=>{const c=rnd()<(p.d.crit+p.mCrit);let v=pDmg(C.atk,CFG.ATK_MUL*(sk.mul||0))*(S.autoSkillCasting?.62:1);
    if(c)v*=(p.d.cdmg+p.mCdmg);return[v,c];};
  switch(sk.k){
  case "cleave":{
    const R=sk.r*mul*p.mRange;let h=0;
    for(const e of S.enemies.slice()){
      const d=Math.hypot(e.x-p.x,e.y-p.y);if(d>R+e.r)continue;
      let ang=Math.atan2(e.y-p.y,e.x-p.x)-a;
      while(ang>Math.PI)ang-=TAU;while(ang<-Math.PI)ang+=TAU;
      if(Math.abs(ang)>sk.arc)continue;
      const[v,c]=dmg();if(e.training)e.trainingSkill=i;hurtE(e,v,c,Math.cos(a),Math.sin(a),h++>0);}
    for(let i2=0;i2<12;i2++){const ang=a+rr(-sk.arc,sk.arc);
      S.parts.push({x:p.x+Math.cos(ang)*R*.75,y:p.y+Math.sin(ang)*R*.75,
        vx:Math.cos(ang)*4,vy:Math.sin(ang)*4,t:0,life:.16,col:"#ffd9a0",sz:3});}
    h+=hitPotsCone(p.x,p.y,a,R,sk.arc)?1:0;SFX.cast(300);if(h)shk(3.2);break;}
  case "dash":{
    p.dashT=.30;p.invulT=Math.max(p.invulT,p.dashT);const spd=sk.len/.30;
    p.dashX=Math.cos(a)*spd;p.dashY=Math.sin(a)*spd;
    const hs=new Set();
    p.dashHit=()=>{for(const e of S.enemies.slice()){if(hs.has(e))continue;
      if(d2(p.x,p.y,e.x,e.y)<Math.pow(sk.w*mul+e.r,2)){hs.add(e);
        const[v,c]=dmg();if(e.training)e.trainingSkill=i;hurtE(e,v,c,Math.cos(a),Math.sin(a));}}};
    const oldHit=p.dashHit;p.dashHit=()=>{oldHit();hitPotsCircle(p.x,p.y,sk.w*mul+.35);};
    SFX.cast(300);shk(3);break;}
  case "slam":{
    const R=sk.r*mul*p.mRange;
    for(const e of S.enemies.slice()){
      const d=Math.hypot(e.x-p.x,e.y-p.y);if(d>R+e.r)continue;
      const[v,c]=dmg();if(e.training)e.trainingSkill=i;hurtE(e,v,c,(e.x-p.x)/(d||1)*2,(e.y-p.y)/(d||1)*2);
      if(e.hp>0)e.stun=Math.max(e.stun,sk.stun);}
    hitPotsCircle(p.x,p.y,R);S.fx.push({t:"ring",x:p.x,y:p.y,tm:0,R,col:"#ffa040"});
    SFX.nova();shk(10);buzz([0,50,40,60]);break;}
  case "ball":{
    S.bullets.push({x:p.x,y:p.y,vx:Math.cos(a)*sk.sp,vy:Math.sin(a)*sk.sp,
      dmg:dmg()[0],crit:false,mine:1,col:sk.col,r:.26,t:0,boom:sk.r*mul});
    SFX.cast(360);break;}
  case "nova":{
    if(sk.blink)blinkForward(p,a,sk.blink);
    const R=sk.r*mul*p.mRange;
    for(const e of S.enemies.slice()){
      const d=Math.hypot(e.x-p.x,e.y-p.y);if(d>R+e.r)continue;
      const[v,c]=dmg();hurtE(e,v,c,(e.x-p.x)/(d||1)*1.5,(e.y-p.y)/(d||1)*1.5);
      if(sk.freeze&&e.hp>0)applyST(e,"frz",sk.freeze,false);}
    hitPotsCircle(p.x,p.y,R);S.fx.push({t:"ring",x:p.x,y:p.y,tm:0,R,col:sk.col||"#9ad8ff"});
    SFX.nova();shk(6);buzz(26);break;}
  case "chain":{
    let cur=null,bd=1e9;
    for(const e of S.enemies){const d=d2(p.x,p.y,e.x,e.y);if(d<bd&&d<64){bd=d;cur=e;}}
    if(!cur){p.cds[i]=0;p.mp+=sk.c;return;}
    const hit=new Set();let fx=p.x,fy=p.y;
    for(let j=0;j<Math.round(sk.jumps*mul)&&cur;j++){
      hit.add(cur);const[v,c]=dmg();
      S.fx.push({t:"line",x:fx,y:fy,x2:cur.x,y2:cur.y,tm:0,col:"#a0d0ff"});
      fx=cur.x;fy=cur.y;
      hurtE(cur,v*Math.pow(.85,j),c,0,0,j>0);
      let nx=null,nd=1e9;
      for(const e of S.enemies){if(hit.has(e))continue;const d=d2(fx,fy,e.x,e.y);
        if(d<nd&&d<sk.range*sk.range){nd=d;nx=e;}}
      cur=nx;}
    SFX.cast(880);shk(4);break;}
  case "pierce":{
    /* 直線を貫く一撃。爆風が無い代わりに並んだ敵を串刺しにする */
    S.bullets.push({x:p.x,y:p.y,vx:Math.cos(a)*sk.sp,vy:Math.sin(a)*sk.sp,
      dmg:dmg()[0],crit:false,mine:1,col:sk.col,r:.22,t:0,
      pierce:Math.round(sk.pierce*mul),hit:new Set()});
    SFX.cast(520);break;}
  case "cry":{
    /* 自己強化。攻撃と被ダメ軽減を一定時間だけ上げる。
       祭壇と同じ時計（shrineT）を使うと祭壇の効果を上書きするので buffT を使う。 */
    p.buffAtk=sk.atk;p.buffDr=sk.dr;p.buffT=sk.dur;
    if(sk.heal)p.hp=Math.min(p.max,p.hp+p.max*sk.heal);

/* 効果は定義から読む。以前は key の文字列で分岐しており、

function useItem(slot=S.itemSlot){const p=S.p,key=S.loadout[slot],def=CONSUMABLES[key];

    for(const e of S.enemies)if(d2(p.x,p.y,e.x,e.y)<=r)e.stun=Math.max(e.stun||0,def.stun);}

/* 効果中の品から値を引く。無ければ既定値。 */

const AUTO_PRESETS={
 aggressive:[{condition:"半径R内に敵N体以上",action:"skill1"},{condition:"自MP > N%",action:"skill2"},{condition:"ボス戦中",action:"skill3"}],
 conserve:[{condition:"ボス戦中",action:"skill3"},{condition:"自HP < N%",action:"item1"},{condition:"状態異常中",action:"item2"}],
 survival:[{condition:"自HP < N%",action:"item1"},{condition:"直前に被弾した",action:"item2"},{condition:"ボスが予備動作中",action:"skill3"}]
};
const AUTOMATION_CONDITIONS=["自HP < N%","自MP > N%","半径R内に敵N体以上","ボス戦中","ボスが予備動作中","状態異常中","バフが切れている","直前に被弾した"];
const AUTOMATION_ACTIONS=["skill1","skill2","skill3","item1","item2","item3","item4","none"];
function automationRules(){const key=S.settings.autoPreset||"aggressive",base=AUTO_PRESETS[key]||AUTO_PRESETS.aggressive;return (S.settings.autoRules&&S.settings.autoRules.length?S.settings.autoRules:base).slice(0,6);}
function autoCondition(c){const p=S.p;if(c==="自HP < N%")return p.hp/p.max<.45;if(c==="自MP > N%")return p.mp/p.d.mpMax>.5;if(c==="半径R内に敵N体以上")return S.enemies.filter(e=>d2(p.x,p.y,e.x,e.y)<25).length>=2;if(c==="ボス戦中")return !!S.boss;if(c==="ボスが予備動作中")return !!(S.boss&&S.boss.wind>0);if(c==="状態異常中")return Object.values(p.st||{}).some(x=>x>0);if(c==="バフが切れている")return !Object.keys(p.itemBuffs).length;if(c==="直前に被弾した")return p.lastHit<2;return false;}
function autoActionAvailable(a){const p=S.p;if(a.startsWith("skill")){const i=+a.slice(-1)-1,sk=activeSkills()[i];return sk&&p.cds[i]<=0&&p.mp>=sk.c;}if(a.startsWith("item")){const i=+a.slice(-1)-1;return !!(S.loadout[i]&&S.runItems[i]&&p.itemCd<=0&&p.itemLock<=0);}return a==="none";}

function automationInput(wx,wy){const sx=(wx-wy)*CFG.TILE_W/2,sy=(wx+wy)*CFG.TILE_H/2,l=Math.hypot(sx,sy)||1;IN.dx=sx/l;IN.dy=sy/l;}
function automationWaypoint(p,target){
  const start=(p.y|0)*MW+(p.x|0),goal=(target.y|0)*MW+(target.x|0),prev=new Int32Array(MW*MH);prev.fill(-2);prev[start]=-1;
  if(start===goal)return target;
  const queue=new Int32Array(MW*MH);let head=0,tail=1;queue[0]=start;
  while(head<tail&&prev[goal]===-2){const at=queue[head++],x=at%MW,y=(at/MW)|0;
    for(const next of [at-1,at+1,at-MW,at+MW]){const nx=next%MW,ny=(next/MW)|0;if(nx<0||ny<0||nx>=MW||ny>=MH||Math.abs(nx-x)+Math.abs(ny-y)!==1||map[next]===0||prev[next]!==-2)continue;prev[next]=at;queue[tail++]=next;}}
  if(prev[goal]===-2)return target;let at=goal,path=[];while(at!==start&&at>=0){path.push(at);at=prev[at];}
  const step=path[path.length-1],x=step%MW,y=(step/MW)|0;return{x:x+.5,y:y+.5};}
function updateAutomation(dt){const mode=S.settings.controlMode||"manual",p=S.p;if(mode==="manual")return;
  let e=null,bd=1e9;for(const x of S.enemies){const d=d2(p.x,p.y,x.x,x.y);if(d<bd){bd=d;e=x;}}
  const attackRange=e?p.d.C.range*p.mRange*p.d.rng+e.r:0,inAttackRange=!!e&&bd<attackRange*attackRange;
  // 片手は移動だけを手動に残す。通常攻撃は敵が射程に入った間だけ押し続ける。
  HELD[0]=inAttackRange;
  if(mode==="auto"&&e&&!p.dashT){
    if(inAttackRange){IN.dx=IN.dy=0;p.face=Math.atan2(e.y-p.y,e.x-p.x);}
    else{p.autoPathT=(p.autoPathT||0)-dt;const moved=Math.hypot(p.x-(p.autoPathX??p.x),p.y-(p.autoPathY??p.y));p.autoStuck=moved<.02?(p.autoStuck||0)+dt:0;p.autoPathX=p.x;p.autoPathY=p.y;if(p.autoPathT<=0||p.autoStuck>.35){p.autoWaypoint=automationWaypoint(p,e);p.autoPathT=.35;p.autoStuck=0;}const waypoint=p.autoWaypoint||e;automationInput(waypoint.x-p.x,waypoint.y-p.y);}}
  const rule=automationRules().find(r=>autoCondition(r.condition)&&autoActionAvailable(r.action));if(!rule){p.autoDelay=0;return;}p.autoDelay=(p.autoDelay||0)+dt;if(p.autoDelay>=.35){p.autoDelay=0;runAutoAction(rule.action);}}

/* ---------- 更新 ---------- */
function update(dt){
  if(S.paused||!S.p)return;
  if(S.hitstop>0){S.hitstop-=dt;return;}
  const p=S.p,moveX0=S.p.x,moveY0=S.p.y,skillMoving=p.dashT>0;
  S.runT+=dt;
  /* ボスの激昂。戦いが長引くほど一撃が重くなる。
     時間を味方にできる限り、装備を整える理由も、間合いを詰める理由も無くなる。 */
  if(S.boss&&S.boss.hp>0&&S.boss.agro){
    const b=S.boss;b.rageT+=dt;
    const m=bossRageMul(b.rageT);
    b.dmg=b.dmg0*m;
    if(m>1)b.hp=Math.min(b.max,b.hp+b.max*CFG.BOSS_ENRAGE_REGEN*(m-1)*dt);}
  if(S.shakeT>0){S.shakeT-=dt;if(S.shakeT<=0)S.shake=0;}
  if(S.flash>0)S.flash-=dt;
  if(p.hurtT>0)p.hurtT-=dt;p.lastHit=(p.lastHit||0)+dt;
  if(p.returnCast>0){p.returnCast-=dt;if(p.returnCast<=0){const slot=p.returnSlot,key=S.loadout[slot];S.runItems[slot]--;S.consumables[key]=Math.max(0,(S.consumables[key]||0)-1);p.returnSlot=-1;endRun(true);return;}}
  if(p.invulT>0)p.invulT-=dt;
  if(p.itemCd>0)p.itemCd=Math.max(0,p.itemCd-dt);if(p.itemLock>0)p.itemLock=Math.max(0,p.itemLock-dt);
  for(const k in p.itemBuffs)if((p.itemBuffs[k].t-=dt)<=0)delete p.itemBuffs[k];
  updateAutomation(dt);
  if(p.hotT>0){const tick=Math.min(dt,p.hotT);p.hp=Math.min(p.max,p.hp+p.hot/Math.max(p.hotT,tick)*tick);p.hot-=p.hot/Math.max(p.hotT,tick)*tick;p.hotT-=tick;}
  if(p.buffT>0){p.buffT-=dt;if(p.buffT<=0){p.buffAtk=1;p.buffDr=0;}}
  if(p.guardT>0){p.guardT-=dt;if(p.guardT<=0)p.guardS=0;}
  if(p.comboT>0){p.comboT-=dt;if(p.comboT<=0)p.comboStep=0;}
  if(p.shrineT>0){p.shrineT-=dt;
    if(p.shrineT<=0){p.sAtk=1;p.sDr=0;p.sMs=1;p.sAs=1;p.sDrop=1;p.shrine=null;updBuffs();}}
  if(p.slowT>0){p.slowT-=dt;if(p.slowT<=0){p.slowMs=1;updBuffs();}}
  p.st=p.st||{};tickST(p,dt,true);if(p.hp<=0)return;
  p.mp=clamp(p.mp+p.d.mpReg*buffVal("clear","mreg",1)*dt,0,p.d.mpMax);

  if(p.dashT>0){p.dashT-=dt;mv(p,p.dashX*dt,p.dashY*dt);
    if(p.dashHit)p.dashHit();
    S.parts.push({x:p.x,y:p.y,vx:rr(-.3,.3),vy:rr(-.3,.3),t:0,life:.2,col:"#cfe6ff",sz:2.2});
    if(p.dashT<=0){p.dashT=0;p.invulT=.18;p.dashHit=null;}}
  else if((IN.dx||IN.dy)&&!stActive(p,"frz")&&p.itemLock<=0){
    const w=s2w(IN.dx,IN.dy),
      sp=CFG.P_SPEED*p.d.ms*p.mMs*p.sMs*(p.slowMs||1)*buffVal("swift","ms",1)*w.mag*(stActive(p,"par")?.55:1);
    mv(p,w.x*sp*dt,w.y*sp*dt);
    const fl=Math.hypot(w.x,w.y)||1;p.face=Math.atan2(w.y/fl,w.x/fl);}

  revealAround(p.x,p.y);

  p.cd-=dt;
  if(S.settings.controlMode==="onehand"){
    let target=null,bd=1e9,range=0;for(const e of S.enemies){const d=d2(p.x,p.y,e.x,e.y);if(d<bd){bd=d;target=e;}}
    if(target){range=p.d.C.range*p.mRange*p.d.rng+target.r;if(bd<range*range)p.face=Math.atan2(target.y-p.y,target.x-p.x);}
  }
  if(p.cd<=0&&HELD[0]){if(basicAttack())p.cd=CFG.ATK_CD/(p.d.as*p.mAs*p.sAs);else p.cd=.04;}
  for(let i=0;i<3;i++)p.cds[i]=Math.max(0,p.cds[i]-dt);
  for(let i=1;i<=3;i++)if(HELD[i])useSkill(i-1);

  const esp=eSpeedMul(S.floor);
  /* 深いほど「当てにくい動き」になる。速度だけを上げると回避不能な事故が増えるだけなので、
     蛇行の振れ幅・回り込みの速さ・横跳びの頻度をここで一括して伸ばす。
     深度1で0、深度100で約1、以降も緩やかに伸びる。 */
  const evasion=Math.min(.75,Math.max(0,(S.floor-8)/160));
  for(const e of S.enemies){
    if(e.flash>0)e.flash-=dt;
    if(e.dotT>0){e.dotT-=dt;
      /* 希少敵は燃焼・毒も1回1ダメージ。フレームごとに1へ丸めると逆に毎秒60ダメージになるため、
         継続時間を1秒ずつためて hurtE の最終減衰へ通す。 */
      if(e.metal){e.metalDotClock=(e.metalDotClock||0)+dt;while(e.metalDotClock>=1&&e.hp>0){e.metalDotClock-=1;hurtE(e,e.dot,false,0,0,true);}}
      else{e.hp-=e.dot*dt;if(e.hp<=0){killE(e);continue;}}}
    tickST(e,dt,false);if(e.hp<=0)continue;
    if(e.frz>0||stActive(e,"frz")){e.frz=Math.max(0,e.frz-dt);continue;}
    if(e.stun>0){e.stun-=dt;continue;}
    const slowMul=stActive(e,"par")?.5:1;
    if(e.regen)e.hp=Math.min(e.max,e.hp+e.regen*dt);
    e.x+=e.kbx;e.y+=e.kby;e.kbx*=.78;e.kby*=.78;
    if(!walk(e.x,e.y,e.r)){e.x-=e.kbx;e.y-=e.kby;e.kbx=e.kby=0;}
    const d=Math.hypot(p.x-e.x,p.y-e.y);
    if(e.weaken>0)e.weaken=Math.max(0,e.weaken-dt);if(S.tactical.trap&&d2(e.x,e.y,S.tactical.trap.x,S.tactical.trap.y)<.5){applyST(e,"par",S.tactical.trap.dur||4,false);S.tactical.trap=null;}
    /* 索敵。既定は11だが、遠くから撃つ型はもっと早く気づく。
       ここが一律11だと、走って離れ続けるだけでどの敵も起きず、
       深部でも「時間をかければ無傷で勝てる」状態になっていた。 */
    if(!e.agro&&d<(e.sight||11))e.agro=true;
    if(!e.agro)continue;
    /* 盾番の向きはゆっくりしか変わらない。速く回り込めば背中を取れる。 */
    if(e.front){const want=Math.atan2(p.y-e.y,p.x-e.x);
      if(e.faceA==null)e.faceA=want;
      let diff=want-e.faceA;while(diff>Math.PI)diff-=TAU;while(diff<-Math.PI)diff+=TAU;
      e.faceA+=clamp(diff,-1.7*dt,1.7*dt);}
    const ux=(p.x-e.x)/(d||1),uy=(p.y-e.y)/(d||1);
    let sx=0,sy=0;

      if(dd<.8&&dd>.0001){const l=Math.sqrt(dd);sx+=(e.x-o.x)/l;sy+=(e.y-o.y)/l;}}
    if(e.boss){bossAI(e,d,ux,uy,dt);continue;}
    if(e.wind>0){

      if(e.wind<=0){
        if(e.boom){S.fx.push({t:"boom",x:e.x,y:e.y,tm:0,R:2.4,col:"#ffd040",dmg:e.dmg,en:1,element:e.element});killE(e);}
        else if(e.rng){
          /* 烙印の弾は「振り切れない」。速度はプレイヤー(3.5)より速い5.0で、
             6秒のあいだ曲がり続ける。走って距離を取る戦法だけを潰す狙い。 */
          S.bullets.push({x:e.x,y:e.y,
            vx:ux*(e.seek?5:e.homing?5.5:8),vy:uy*(e.seek?5:e.homing?5.5:8),
            dmg:e.dmg,t:0,r:e.seek?.26:.2,
            col:e.seek?"#ff5aa0":e.homing?"#e07aa0":e.slow?"#3fa08a":"#c89aff",
            slow:e.slow?1:0,homing:e.homing?1:0,seek:e.seek?1:0,
            seekT:e.seek?6:0,life:e.seek?6.5:0,

    let mx=0,my=0;

        if(e.fuseT<=0){S.fx.push({t:"boom",x:e.x,y:e.y,tm:0,R:3.4,col:"#c0d040",dmg:e.dmg,en:1,element:e.element});killE(e);continue;}
        if(rnd()<dt*12)S.parts.push({x:e.x+rr(-.3,.3),y:e.y+rr(-.3,.3),vx:rr(-.4,.4),vy:rr(-.4,.4),t:0,life:.35,col:"#d8e060",sz:2.5});}

  /* 弾: 細かく刻んで壁抜けを防ぐ */
  for(let i=S.bullets.length-1;i>=0;i--){
    /* 途中で hurtP → endRun が走ると配列が空になる。空になった後も i は残るので守る。 */
    const b=S.bullets[i];if(!b)continue;b.t+=dt;
    /* 追尾。homing は緩く short（走れば振り切れる）、seek は強く long。
       seek はプレイヤーより速く、寿命の限り曲がり続けるので「移動では避けられない」。
       ただし当たれば hurtP を通るので、素早さ（回避率）では避けられる。
       壁は遮る — 走って逃げるのは通らないが、地形を使う立ち回りは残す。 */
    const turn=b.seek?.13:(b.t<1.8?.045:0);
    if((b.homing||b.seek)&&turn>0&&b.t<(b.seekT||1.8)){
      const dx=p.x-b.x,dy=p.y-b.y,l=Math.hypot(dx,dy)||1,s0=Math.hypot(b.vx,b.vy);
      b.vx=lerp(b.vx,dx/l*s0,turn);b.vy=lerp(b.vy,dy/l*s0,turn);}
    let dead=b.t>(b.life||2.8);
    const steps=Math.max(1,Math.ceil(Math.hypot(b.vx,b.vy)*dt/.35));
    for(let st=0;st<steps&&!dead;st++){
      b.x+=b.vx*dt/steps;b.y+=b.vy*dt/steps;
      if(solid(b.x|0,b.y|0)){dead=true;break;}
      if(b.mine){
        for(const q of S.props)if(q.t==="barrel"&&q.hp>0&&d2(b.x,b.y,q.x,q.y)<.36){
          breakPot(q);if(b.boom)S.fx.push({t:"boom",x:b.x,y:b.y,tm:0,R:b.boom,col:b.col,dmg:b.dmg*.7*(b.boomMul||1),hit:new Set()});dead=true;break;}
        if(dead)break;
        for(const e of S.enemies)if(d2(b.x,b.y,e.x,e.y)<Math.pow(.28+e.r,2)){
          /* 貫通弾は同じ敵を二度殴らないよう、当てた相手を覚えて素通りする */
          const bl=Math.hypot(b.vx,b.vy)||1,kbx=b.vx/bl*(b.kb||.24),kby=b.vy/bl*(b.kb||.24);
          if(b.pierce){if(b.hit.has(e))continue;b.hit.add(e);
            hurtE(e,b.dmg,b.crit,kbx,kby,b.hit.size>1);
            if(b.hit.size>=b.pierce)dead=true;break;}
          if(b.boom)S.fx.push({t:"boom",x:b.x,y:b.y,tm:0,R:b.boom,col:b.col,dmg:b.dmg*.7*(b.boomMul||1),hit:new Set()});
          hurtE(e,b.dmg,b.crit,kbx,kby);dead=true;break;}
      }else if(d2(b.x,b.y,p.x,p.y)<.16){
        hurtP(b.dmg,b.homing?"追尾弾":"敵の投射攻撃",false,b.element);
        /* 減速は祭壇とは別の時計で持つ。以前は p.sMs と p.shrineT を流用しており、
           祭壇の効果中に減速を受けると2秒のはずの減速が祭壇の残り時間（最大50秒）続き、
           疾風の祭壇は +28% が -35% に反転したまま張り付いていた。
           逆に祭壇の残りが2秒未満だと祭壇の方が延命されていた。 */
        if(b.slow){p.slowMs=.65;p.slowT=Math.max(p.slowT,2);updBuffs();}
        if(b.st)applyST(p,b.st,2.2,true);
        dead=true;}}
    if(dead)S.bullets.splice(i,1);}

  for(let i=S.fx.length-1;i>=0;i--){
    const f=S.fx[i];if(!f)continue;const first=f.tm===0;f.tm+=dt;
    if(f.t==="boom"){
      const armed=f.tm>=(f.delay||0),firstHit=armed&&!f.hitDone;if(firstHit){f.hitDone=true;burst(f.x,f.y,f.col,18,2);
        if(f.en){if(d2(f.x,f.y,p.x,p.y)<f.R*f.R)hurtP(f.dmg,"爆発",false,f.element);}
        else {hitPotsCircle(f.x,f.y,f.R);for(const e of S.enemies.slice()){
          if(f.hit&&f.hit.has(e))continue;
          if(d2(f.x,f.y,e.x,e.y)<Math.pow(f.R+e.r,2)){if(f.hit)f.hit.add(e);
            hurtE(e,f.dmg,false,0,0,true);}}}}
      if(f.tm>(f.delay||0)+.34)S.fx.splice(i,1);}
    else if(f.t==="pool"){f.tick-=dt;
      if(f.tick<=0){f.tick=.4;if(d2(f.x,f.y,p.x,p.y)<f.R*f.R){
        const st=f.st||"brn";
        hurtP(f.dmg*.4,st==="psn"?"毒の沼":"炎上した地面",false,f.element);applyST(p,st,2.5,true);}}
      if(f.tm>f.dur)S.fx.splice(i,1);}
    else if(f.tm>(f.t==="line"?.16:f.t==="slash"?.22:.42))S.fx.splice(i,1);}

  for(let i=S.drops.length-1;i>=0;i--){
    const d=S.drops[i];if(!d)continue;d.t+=dt;
    const dist=Math.hypot(p.x-d.x,p.y-d.y);
    // 0.1秒後から吸着。0.5m圏内は足元で拾った時と同じく即時回収する。
    // 回復薬は枠、ハートはHPに空きがあるときだけ吸着する。
    if(d.t>=CFG.PICKUP_DELAY&&dist<=CFG.MAGNET_RADIUS&&dist>CFG.PICKUP_RADIUS
      &&!(d.pot&&!S.loadout.some((k,j)=>k===d.pot&&S.runItems[j]<runCap(k)))
      &&!(d.heart&&p.hp>=p.max)){
      const pull=Math.min(dist,CFG.MAGNET_SPEED*dt);d.x+=(p.x-d.x)/dist*pull;d.y+=(p.y-d.y)/dist*pull;}
    const pr=CFG.PICKUP_RADIUS;
    if(d.t>=CFG.PICKUP_DELAY&&d2(d.x,d.y,p.x,p.y)<pr*pr){
      if(d.part){const def=PARTS[d.part];addPart(d.part,d.n||1);runPick().parts[d.part]=(runPick().parts[d.part]||0)+(d.n||1);SFX.chest();toast(`${def.n} +${d.n||1}`,"ok");}
      else if(d.mat){const n=(d.n||1)*(S.dailyMatMul||1),added=d.mat==="core"?earnCore(d.tier,n):addMat(d.mat,d.tier,n);runPick()[d.mat]+=added||0;SFX.gold();if(added)toast(`${d.mat==="core"?"核":"結晶"} 階梯${d.tier} +${added}`);}
      else if(d.shard){
        p.hp=Math.min(p.max,p.hp+p.max*CFG.SHARD_HEAL);
        burst(p.x,p.y,"#6ae0a0",6,1);tone(760,.07,"sine",.08,1040);}
      else if(d.heart){if(p.hp>=p.max)continue;p.hp=Math.min(p.max,p.hp+p.max*.04);
        burst(p.x,p.y,"#ff6080",7,1.1);tone(820,.07,"sine",.08,1100);}
      else if(d.gold){S.gold+=d.gold;S.runGold+=d.gold;SFX.gold();}
      else if(d.pot){const j=S.loadout.findIndex((k,j)=>k===d.pot&&S.runItems[j]<runCap(k));if(j<0)continue;const key=d.pot;S.runItems[j]++;S.consumables[key]=(S.consumables[key]||0)+1;runPick().pots++;SFX.pot();}
      else{S.bag.push(d.it);SFX.gold();}
      S.drops.splice(i,1);}}
  for(const q of S.props)if(q.t==="shrine")q.tm+=dt;

  for(let i=S.parts.length-1;i>=0;i--){const q=S.parts[i];if(!q)continue;q.t+=dt;
    if(q.t>=q.life){S.parts.splice(i,1);continue;}
    q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.9;q.vy*=.9;}
  for(let i=S.nums.length-1;i>=0;i--){const n=S.nums[i];if(!n)continue;n.t+=dt;if(n.t>.8)S.nums.splice(i,1);}
  for(let i=S.corpses.length-1;i>=0;i--){const c=S.corpses[i];if(!c)continue;c.t+=dt;if(c.t>4)S.corpses.splice(i,1);}
  if(S.comboT>0){S.comboT-=dt;if(S.comboT<=0)S.combo=0;}
  while(S.dmgLog.length&&S.dmgLog[0].t<S.runT-5)S.dmgLog.shift();
  S.dps=Math.round(S.dmgLog.reduce((a,x)=>a+x.v,0)/5);
  S.portal.t+=dt;S.stairs.t+=dt;
  updAction();updHUD();}

/* ボスの共通処理。予備動作の解決と激昂だけを見て、動きは pat ごとの関数へ渡す。 */
function bossAI(e,d,ux,uy,dt){
  const p=S.p,tm=e.telMul||1;
  if(e.phase===1&&e.hp<e.max*.5){e.phase=2;e.sp*=1.15;e.cd*=.8;toast("ボスが激昂した");shk(9);SFX.boss();}
  if(e.tel>0){e.tel-=dt;if(e.tel<=0)bossRelease(e,d,dt);return;}
  e.cdT-=dt;
  (BOSS_AI[e.pat]||BOSS_AI.charger)(e,d,ux,uy,dt,tm);
  /* 触れている間の削り。どのボスも密着し続けると痛い。 */
  if(d<e.aR+p.r+e.r*.4){e.touch-=dt;
    if(e.touch<=0){e.touch=1.2*tm;hurtP(e.dmg*.3,e.n+"の攻撃",false,e.element);}}}
/* 予備動作が明けた瞬間の処理。telK ごとに出るものが違う。 */
function bossRelease(e,d,dt){
  const p=S.p;
  if(e.telK==="charge"){
    /* 突進: 溜めた向きへ実際に走り、通った跡を残す。
       dashHit は「この突進でもう当てたか」。無いと重なっている間ずっと毎フレーム殴る。 */
    e.dashT=.45;e.dashA=e.telA;e.trailT=0;e.dashHit=false;shk(7);}
  else if(e.telK==="slam"){
    S.fx.push({t:"boom",x:e.telX,y:e.telY,tm:0,R:3.6,col:e.col,dmg:e.dmg*1.8,en:1,element:e.element});shk(9);}
  else if(e.telK==="barrage"){
    /* 円状の弾幕。第2形態は本数が増えて隙間が狭くなる */
    const n=e.phase===2?16:11,off=rnd()*TAU;
    for(let i=0;i<n;i++){const a=off+i/n*TAU;
      S.bullets.push({x:e.x,y:e.y,vx:Math.cos(a)*5.2,vy:Math.sin(a)*5.2,
        dmg:e.dmg*.55,t:0,col:e.col,r:.22,element:e.element});}
    tone(220,.2,"square",.09,120);shk(4);}
  else if(e.telK==="beam"){
    /* 光線: 溜めた向きの直線上を薄く広く焼く */
    for(let i=1;i<=7;i++)S.fx.push({t:"boom",x:e.x+Math.cos(e.telA)*i*1.5,y:e.y+Math.sin(e.telA)*i*1.5,
      tm:0,R:1.15,col:e.col,dmg:e.dmg*.85,en:1,element:e.element});
    tone(920,.22,"sine",.1,1400);shk(6);}
  else if(e.telK==="ring"){
    /* 広がる輪。輪の帯だけが痛いので、外へ抜けるか内側へ入れば当たらない */
    e.ringR=1.2;e.ringT=0;}
  else if(e.telK==="ambush"){
    /* 背後へ出現して斬る */
    const a=Math.atan2(p.y-e.y,p.x-e.x)+Math.PI;
    const tx=p.x+Math.cos(a)*1.1,ty=p.y+Math.sin(a)*1.1;
    if(walk(tx,ty,e.r)){e.x=tx;e.y=ty;}
    e.vanish=0;
    S.fx.push({t:"boom",x:e.x,y:e.y,tm:0,delay:.45,R:2.2,col:e.col,dmg:e.dmg*1.5,en:1,element:e.element});
    burst(e.x,e.y,e.col,20,2);shk(8);}
  else if(e.telK==="pools"){
    for(let i=0;i<(e.phase===2?5:3);i++){const a=rnd()*TAU,r=i===0?0:rr(1.5,4.5);
      S.fx.push({t:"pool",x:p.x+Math.cos(a)*r,y:p.y+Math.sin(a)*r,tm:0,dur:7,R:1.5,
        col:e.col,dmg:e.dmg*.5,en:1,tick:0,element:e.element,st:"psn"});}
    tone(180,.2,"triangle",.08,120);}}
const BOSS_AI={
  /* 火1: 長距離を突進し、走った跡を燃やす。直線を外れれば当たらない。 */
  charger(e,d,ux,uy,dt,tm){
    if(e.dashT>0){e.dashT-=dt;
      mv(e,Math.cos(e.dashA)*e.sp*3.2*dt,Math.sin(e.dashA)*e.sp*3.2*dt);
      e.trailT-=dt;
      if(e.trailT<=0){e.trailT=.09;
        S.fx.push({t:"pool",x:e.x,y:e.y,tm:0,dur:3.4,R:.95,col:e.col,dmg:e.dmg*.4,en:1,tick:0,element:e.element,st:"brn"});}
      if(!e.dashHit&&d2(e.x,e.y,S.p.x,S.p.y)<Math.pow(e.r+S.p.r+.35,2)){
        e.dashHit=true;hurtP(e.dmg*.9,e.n+"の突進",false,e.element);}
      return;}
    if(e.cdT<=0){e.cdT=e.cd;e.tel=.7*tm;e.telK="charge";e.telA=Math.atan2(uy,ux);
      tone(140,.3,"sawtooth",.12,90);return;}
    if(d>e.aR*.9)bossMove(e,ux,uy,dt,1);},
  /* 火2: ほとんど動かず円状に弾を撒く。隙間を縫って詰める相手。 */
  barrage(e,d,ux,uy,dt,tm){
    if(e.cdT<=0){e.cdT=e.cd*.85;e.tel=.55*tm;e.telK="barrage";tone(300,.2,"square",.07,200);return;}
    /* 近づかれると離れる。張り付かせない。 */
    if(d<4.5)bossMove(e,-ux,-uy,dt,.9);else if(d>9)bossMove(e,ux,uy,dt,.7);},
  /* 水1: 周囲を回り続け、たまに突っ込む。追いかけると永久に当たらない。 */
  circler(e,d,ux,uy,dt,tm){
    if(e.dashT>0){e.dashT-=dt;
      mv(e,Math.cos(e.dashA)*e.sp*2.6*dt,Math.sin(e.dashA)*e.sp*2.6*dt);
      if(!e.dashHit&&d2(e.x,e.y,S.p.x,S.p.y)<Math.pow(e.r+S.p.r+.3,2)){
        e.dashHit=true;hurtP(e.dmg*.85,e.n+"の突進",false,e.element);}
      return;}
    if(e.cdT<=0){e.cdT=e.cd;e.tel=.5*tm;e.telK="charge";e.telA=Math.atan2(uy,ux);
      tone(200,.2,"sawtooth",.1,120);return;}
    const want=e.phase===2?3.4:4.4;
    e.orbit+=e.orbitDir*dt*(e.phase===2?1.5:1.1);
    const tx=S.p.x+Math.cos(e.orbit)*want,ty=S.p.y+Math.sin(e.orbit)*want;
    const l=Math.hypot(tx-e.x,ty-e.y)||1;
    bossMove(e,(tx-e.x)/l,(ty-e.y)/l,dt,1.25);},
  /* 水2: 足元から凍る輪を広げる。輪の帯だけが痛い。 */
  expand(e,d,ux,uy,dt,tm){
    if(e.ringR>0){e.ringR+=dt*4.4;e.ringT=(e.ringT||0)+dt;
      const band=.9;
      if(Math.abs(d-e.ringR)<band){hurtP(e.dmg*.55,e.n+"の氷輪",false,e.element);applyST(S.p,"frz",.7,true);e.ringR=0;}
      else if(e.ringR>11)e.ringR=0;
      else if(e.ringT>.06){e.ringT=0;
        for(let i=0;i<18;i++){const a=i/18*TAU;
          S.parts.push({x:e.x+Math.cos(a)*e.ringR,y:e.y+Math.sin(a)*e.ringR,vx:0,vy:0,t:0,life:.22,col:e.col,sz:3});}}
      return;}
    if(e.cdT<=0){e.cdT=e.cd*1.15;e.tel=.7*tm;e.telK="ring";tone(520,.28,"sine",.09,760);return;}
    if(d>e.aR*.9)bossMove(e,ux,uy,dt,.85);},
  /* 木1: 動かず配下を呼び続ける。増援を切るか押し切るかの二択を迫る。 */
  summoner(e,d,ux,uy,dt,tm){
    e.sumT-=dt;
    if(e.sumT<=0){e.sumT=(e.phase===2?4.5:7)*tm;
      const kinds=e.phase===2?["grunt","stalker","archer","weaver"]:["grunt","swarm","archer"];
      for(let i=0;i<(e.phase===2?4:3);i++)
        spawnE(pick(kinds),e.x+rr(-3.5,3.5),e.y+rr(-3.5,3.5),S.floor,false);
      burst(e.x,e.y,e.col,16,1.6);toast("増援");}
    if(e.cdT<=0){e.cdT=e.cd*1.3;e.tel=.9*tm;e.telK="slam";e.telX=S.p.x;e.telY=S.p.y;
      tone(120,.3,"sawtooth",.11,80);return;}
    if(d>6)bossMove(e,ux,uy,dt,.7);},
  /* 木2: 毒沼を撒いて距離を取る。踏まずに追い詰める必要がある。 */
  zoner(e,d,ux,uy,dt,tm){
    if(e.cdT<=0){e.cdT=e.cd;e.tel=.55*tm;e.telK="pools";tone(240,.2,"triangle",.08,160);return;}
    if(d<5)bossMove(e,-ux,-uy,dt,1.15);else if(d>8)bossMove(e,ux,uy,dt,.8);
    else{e.orbit+=e.orbitDir*dt*1.2;
      bossMove(e,Math.cos(e.orbit),Math.sin(e.orbit),dt,.7);}},
  /* 光1: 瞬間移動してから光線。近づいても逃げられる。 */
  blinker(e,d,ux,uy,dt,tm){
    if(e.cdT<=0){e.cdT=e.cd;
      /* 逃げ先は自分から離れつつ、プレイヤーを射線に入れられる位置 */
      for(let i=0;i<12;i++){const a=rnd()*TAU,r=rr(4.5,7.5);
        const tx=S.p.x+Math.cos(a)*r,ty=S.p.y+Math.sin(a)*r;
        if(walk(tx,ty,e.r)){burst(e.x,e.y,e.col,14,1.6);e.x=tx;e.y=ty;burst(tx,ty,e.col,14,1.6);break;}}
      e.tel=.75*tm;e.telK="beam";e.telA=Math.atan2(S.p.y-e.y,S.p.x-e.x);
      tone(1200,.2,"sine",.08,1600);return;}
    if(d<3.5)bossMove(e,-ux,-uy,dt,1);},
  /* 光2: 正面からの攻撃をほぼ通さない。回り込ませるための相手。 */
  guardian(e,d,ux,uy,dt,tm){
    e.facing=Math.atan2(uy,ux);           // hurtE 側がこの向きを見て正面を判定する
    if(e.cdT<=0){e.cdT=e.cd;
      if(d>5){e.tel=.6*tm;e.telK="charge";e.telA=e.facing;}
      else{e.tel=.8*tm;e.telK="slam";e.telX=S.p.x;e.telY=S.p.y;}
      tone(160,.3,"sawtooth",.11,100);return;}
    if(e.dashT>0){e.dashT-=dt;
      mv(e,Math.cos(e.dashA)*e.sp*2.8*dt,Math.sin(e.dashA)*e.sp*2.8*dt);
      if(!e.dashHit&&d2(e.x,e.y,S.p.x,S.p.y)<Math.pow(e.r+S.p.r+.3,2)){
        e.dashHit=true;hurtP(e.dmg*.9,e.n+"の突進",false,e.element);}
      return;}
    if(d>e.aR*.9)bossMove(e,ux,uy,dt,1);},
  /* 闇1: 姿を消して背後から出る。消えている間に位置を変えるのが正解。 */
  vanisher(e,d,ux,uy,dt,tm){
    if(e.vanish>0){e.vanish-=dt;
      if(rnd()<dt*8)S.parts.push({x:e.x+rr(-.5,.5),y:e.y+rr(-.5,.5),vx:0,vy:0,t:0,life:.3,col:e.col,sz:2});
      if(e.vanish<=0){e.tel=.35*tm;e.telK="ambush";}
      return;}
    if(e.cdT<=0){e.cdT=e.cd*1.1;e.vanish=(e.phase===2?.9:1.3);
      burst(e.x,e.y,e.col,22,2);tone(90,.3,"sawtooth",.1,60);return;}
    if(d>e.aR*.9)bossMove(e,ux,uy,dt,1.1);},
  /* 闇2: 骸に守られ、受けた分を撃ち返す。守りを剥がしてから叩く。 */
  reflector(e,d,ux,uy,dt,tm){
    e.sumT-=dt;
    if(e.sumT<=0){e.sumT=(e.phase===2?6:9)*tm;
      const live=S.enemies.filter(x=>x!==e&&x.hp>0).length;
      if(live<(e.phase===2?7:5))for(let i=0;i<3;i++)
        spawnE(pick(["grunt","brute","warden"]),e.x+rr(-3,3),e.y+rr(-3,3),S.floor,false);
      /* 守りは配下の数で決まる。配下を残すほどボスが硬い。 */
      toast("骸が集まる");}
    e.guardStacks=S.enemies.filter(x=>x!==e&&x.hp>0).length;
    if(e.cdT<=0){e.cdT=e.cd;e.tel=.8*tm;e.telK="slam";e.telX=S.p.x;e.telY=S.p.y;

let LK=null;
function chestRarity(){
  const early=S.floor<4,roll=rnd(),mf=S.p.d.mf+S.p.mDrop+S.p.sDrop-2;
  const bonus=clamp(mf*.04,0,.10);
  if(early)return roll<.72?0:roll<.94?1:2;
  if(roll<.50-bonus)return 0;

function nextLockTarget(){

  /* 印はすべて踏み込んだ場所にだけ出す。未踏の先に階段や強敵が浮かんでいたら、
     矢印を消して部屋ごとに開ける意味が無くなる。
     探知の香（tactical.reveal）だけは、それを使ったぶんとして未踏でも出す。 */
  const known=t=>seen[(t.y|0)*MW+(t.x|0)];
  const dot=(t,col,w)=>{mctx.fillStyle=col;mctx.fillRect(t.x*sc-w/2*k,t.y*sc-w/2*k,w*k,w*k);};
  if(known(S.stairs)||S.tactical.reveal)dot(S.stairs,"#e08830",3.5);
  if(known(S.portal))dot(S.portal,"#5aa0ff",3.5);
  for(const e of S.enemies)if((e.agro||e.elite||e.boss)&&known(e))
    dot(e,e.metal?"#ffffff":e.boss?"#ff3030":e.elite?e.elite.col:"#a04040",e.metal?3.4:e.boss?4:2.2);
  for(const q of S.props)if(S.tactical.reveal&&(q.t==="chest"||q.t==="shrine"))dot(q,"#ffd24a",3);
  for(const d of S.drops){
    if(!known(d))continue;
    if(d.it)dot(d,rarCol(d.rar),2.4);
    else if(d.pot)dot(d,"#f0506a",2.4);
    else if(d.heart)dot(d,"#ff8aaa",2.4);} // 回復薬とハートも地図に出す
  mctx.fillStyle="#fff";mctx.fillRect(p.x*sc-1.5*k,p.y*sc-1.5*k,3.5*k,3.5*k);}

function updHUD(){

  {const v=$("hurtVig");
   if(v){const hit=p.hurtT>0?p.hurtT/.42:0,low=p.hp/p.max<.3?.30:0;
     v.style.opacity=Math.max(low,Math.min(1,hit)).toFixed(2);}}
  $("hpT").textContent=Math.ceil(p.hp)+"/"+Math.ceil(p.max);
  $("mpF").style.width=(p.mp/p.d.mpMax*100)+"%";
  $("mpT").textContent="MP "+Math.floor(p.mp)+"/"+p.d.mpMax;
  const b=S.base;
  $("xpF").style.width=(b.xp/xpNeed(b.lv)*100)+"%";
  $("lvT").textContent="Lv"+b.lv;
  const dg=dangerOf(S.floor);
  /* 潜っている間も装備の追いつきは階を下るごとに落ちる。深度の隣に出す。 */
  const fit=gearFitText(S.floor);
  $("flT").innerHTML=S.floor+' <span style="color:'+dg.c+';font-size:11px">'+dg.n+'</span>'
    +(fit.reach<1?' <span style="color:'+fit.c+';font-size:11px">装備'+fit.n+'</span>':"");
  // 潜行中は所持金の総額より「今回いくら拾ったか」の方が意味がある。
  $("goldT").textContent="+"+S.runGold+" G";
  $("dpsT").style.display=S.settings.dps?"block":"none";
  $("dpsT").textContent="DPS "+S.dps;
  const t=Math.floor(S.runT);
  $("tmT").style.display=S.settings.timer?"block":"none";
  $("tmT").textContent=Math.floor(t/60)+":"+String(t%60).padStart(2,"0");
  /* 拾った物の一覧は戦闘中に出さない。HP/MPのすぐ下で数字が増減すると、
     盤面から目を離させるだけで、戦っている間にできることが何も無い。
     同じ内容は一時停止の「戦利品」にゴールド・素材・道具まで含めて出る。 */
  $("s0").querySelector(".cd").style.transform=
    "scaleY("+clamp(p.cd/(CFG.ATK_CD/(p.d.as*p.mAs*p.sAs)),0,1)+")";
  {const skills=activeSkills();
   for(let i=1;i<=3;i++){const sk=skills[i-1],el=$("s"+i);if(!sk)continue;
    const full=sk.cd*p.mCd*(1-p.d.cdr);
    el.querySelector(".cd").style.transform="scaleY("+(full>0?p.cds[i-1]/full:0)+")";
    el.classList.toggle("no",p.mp<sk.c);
    /* 名前と消費MPもここで書く。別経路で書いていたころは、交代時に
       「名前は前のキャラ・中身は次のキャラ」という食い違いが起きていた。 */
    const n=$("w"+i).querySelector(".skName"),c=el.querySelector(".cost");
    if(n&&n.textContent!==sk.n)n.textContent=sk.n;
    if(c&&c.textContent!==String(sk.c))c.textContent=sk.c;}}
  // 右端のアイテムは1個ずつ独立したボタン。残数と使用可否をそれぞれ更新する。
  for(const el of document.querySelectorAll("#railR .railBtn")){
    const i=+el.dataset.slot,key=S.loadout[i];
    /* 空き枠は「押せない道具」ではなく「まだ何も入れていない場所」。
       使用不能と同じ34%まで落とすと、枠があること自体が読めなくなる。 */
    if(!key){el.classList.remove("no");continue;}
    const n=el.querySelector("b");if(n)n.textContent=S.runItems[i]||0;
    el.classList.toggle("no",!S.runItems[i]||p.itemCd>0||p.itemLock>0);}
  const cb=$("combo");
  if(S.combo>=4){cb.classList.add("on");cb.innerHTML=S.combo+'<small>COMBO</small>';
    cb.style.fontSize=Math.min(46,24+S.combo*.6)+"px";}
  else cb.classList.remove("on");
  if(S.boss){$("bossF").style.width=(S.boss.hp/S.boss.max*100)+"%";
    /* 激昂は隠さない。何が起きているか分からないまま殺されると、
       「長引かせない」という正しい答えに辿り着けない。 */
    const m=bossRageMul(S.boss.rageT),n=$("bossN");
    if(n){const left=Math.ceil(CFG.BOSS_ENRAGE_AT-(S.boss.rageT||0));
      n.innerHTML=S.boss.n+(m>1
        ?` <span style="color:#ff6a4a">激昂 ×${m.toFixed(1)} — 傷が塞がる</span>`
        :(S.boss.agro&&left<=20?` <span style="color:#e0a53c">激昂まで ${left}秒</span>`:""));}}}

function endRun(alive,cause){
  S.paused=true;
  if(!alive&&S.formation&&S.partyIndex+1<S.formation.length){
    S.partyIndex++;const [k,id]=S.formation[S.partyIndex].split(":");
    selectCharacter(k,id,()=>{S.p=newPlayer();S.paused=false;enterFloor(S.floor);
      /* 交代で技も持ち物の使い勝手も変わる。表示を新しいキャラクターに合わせ直す。 */
      refreshSkillButtons();renderRail();updBuffs();updHUD();toast(`${currentCharacter().n}に交代`);});return;}
  /* 潜行専用の表示と場の状態をここで必ず片付ける。updHUD は潜行中しか回らないので、
     戦闘HUDを消す責任を updHUD に持たせると、拠点へ戻っても出たままになる。 */
  clearRunVisuals();
  const got=S.bag.slice();
  // boss_message は深度5ボス撃破時に設定され、そこから先へ進む経路が無かった。
  // 帰還した時点で装備・商店・編成の案内へ繋ぐ（無料ガチャ2回もこの枝にある）。
  if(alive&&["return","boss_message"].includes((S.tutorial||{}).phase)){S.tutorial.phase="equip_tab";hideTutorial();}
  if(alive){extractLootToStash(got);gainRankXP(returnRankXP(S.floor));SFX.extract();}else SFX.death();
  S.log.runs.push({t:Math.round(S.runT),floor:S.floor,start:S.startFloor,alive,
    items:got.length,kills:S.p.kills,lv:S.base.lv,gold:S.gold,ups:S.p.ups.slice()});
  save();
  $("endT").textContent=alive?"帰還":"死亡";
  $("endS").textContent=alive?`深度 ${S.floor} から ${got.length} 個を持ち帰った`
    :`深度 ${S.floor} で力尽きた — ${got.length} 個を失った`;
  const body=$("endB");body.innerHTML=`<div class="card">
    <div class="stat"><span>潜行時間</span><b>${Math.floor(S.runT/60)}分${Math.floor(S.runT%60)}秒</b></div>
    <div class="stat"><span>到達深度</span><b>${S.floor}</b></div>
    <div class="stat"><span>撃破</span><b>${S.p.kills}</b></div>
    <div class="stat"><span>ラン強化</span><b>${S.p.ups.join(" / ")||"なし"}</b></div></div>`;
  if(!alive){const why=document.createElement("div");why.className="card deathCause";
    why.innerHTML=`<div class="skull">☠</div><div class="ty">死因</div><b>${cause||"敵の攻撃"}</b>
      <div class="sub">未帰還の装備 ${got.length} 個を失った</div>`;body.prepend(why);}
  /* 最深記録の更新はいちばん嬉しい瞬間なので、専用の行で出す。
     小さなトーストだと流れて気付けなかった。 */
  if(alive&&S.floor>=S.deepest&&S.floor>S.startFloor){
    const rec=document.createElement("div");rec.className="card recordRow";
    rec.innerHTML=`<div class="nm" style="color:var(--gold)">最深記録を更新</div>`
      +`<div class="st">${S.startFloor}F から ${S.floor}F まで（+${S.floor-S.startFloor}）</div>`;
    body.appendChild(rec);}
  if(alive&&got.length){
    const h=document.createElement("h3");h.textContent="持ち帰った装備";body.appendChild(h);
    /* レア度が高いものほど後に出す。順に現れることで「何が出るか」の間が生まれる。 */
    got.sort((a,z)=>a.rar-z.rar);
    let step=0;
    for(const it of got){const d=document.createElement("div");d.className="card lootIn rar"+it.rar;
      // 拾った物が今の装備より強いかどうかを、倉庫を開かずにここで分かるようにする。
      const cur=S.gear[it.slot],up=!cur||it.score>cur.score;
      d.innerHTML=`<div class="row" style="align-items:flex-start">
        <div class="${RC[it.rar]}" style="flex:0 0 auto">${icon(iconKey(it),24)}</div>
        <div style="flex:1"><div class="nm ${RC[it.rar]}">${it.name}
        <span class="tag ${RC[it.rar]}">${CFG.RARITY[it.rar][0]}</span>
        ${up?'<span class="tag" style="color:#7ad04e;border-color:#7ad04e">▲ 装備中より強い</span>':""}</div>
        <div class="ty">${SLOTN(it.slot)} / 深度${it.ilvl}</div>
        <div class="st">${statsHTML(it,cur)}</div></div></div>`;
      /* 演出は最大12枚ぶんで打ち切る。大量に持ち帰ったときに待たされないようにする。 */
      d.style.animationDelay=(Math.min(step,12)*0.09).toFixed(2)+"s";step++;
      d.style.borderColor=hexA(rarCol(it.rar),it.rar>=2?.7:.3);
      body.appendChild(d);}}
  S.bag.length=0;$("scEnd").classList.add("on");
  clearTimeout(deathReturnTimer);clearInterval(deathCountdownTimer);
  /* 「拠点へ戻る（10秒）」だと10秒待たされるように読める。押せばすぐ戻れることを書く。 */
  if(!alive){let left=10;const paint=()=>{$("btnBack").innerHTML=`拠点へ戻る<small>あと${Math.max(0,left)}秒で自動 / 押せばすぐ</small>`;};
    paint();deathCountdownTimer=setInterval(()=>{left--;paint();},1000);
    deathReturnTimer=setTimeout(leaveEnd,10000);}else $("btnBack").textContent="拠点へ";}

function openCharacterChoices(k){const c=$("itC");

/* 押しっぱなしで連続加算。1点ずつ連打させない。
   速度は押し続けるほど上げる。一定のままだと、ポイントが100あるときに
   押し続ける時間だけが延びて、操作が作業になる。 */
function repeatBtn(el,fn){
  el.dataset.tap="1";
  let tm=null,iv=null,held=0;
  const tick=()=>{
    held++;
    /* 0.4秒ごとに間隔を詰め、1秒を超えたら1回で複数進める。 */
    const step=held>34?10:held>20?5:1;
    for(let i=0;i<step;i++)fn();
    const wait=held>24?40:held>12?55:80;
    clearInterval(iv);iv=setInterval(tick,wait);};
  const start=()=>{held=0;fn();tm=setTimeout(()=>{iv=setInterval(tick,80);},360);};
  const stop=()=>{clearTimeout(tm);clearInterval(iv);tm=iv=null;held=0;};
  el.addEventListener("touchstart",e=>{e.preventDefault();e.stopPropagation();aInit();start();},{passive:false});
  el.addEventListener("touchend",stop,{passive:true});
  el.addEventListener("touchcancel",stop,{passive:true});
  el.addEventListener("mousedown",e=>{e.preventDefault();e.stopPropagation();aInit();start();});
  addEventListener("mouseup",stop);}

function askQuantity(title,note,max,onOk){

    const set=v=>{n=Math.max(1,Math.min(max,Math.floor(v)||1));val.value=n;info.textContent=`最大 ${max}`;};
    repeatBtn(minus,()=>set(n-1));repeatBtn(plus,()=>set(n+1));

      if(Number.isFinite(v))n=Math.max(1,Math.min(max,v));});

function allRoster(){const a=[];for(const k of CKEYS)for(const ch of CHARACTERS[k])a.push({k,ch});return a;}
/* ガチャの排出。N（配布枠）は絶対に出さない。等級を先に引いてから、その等級の中で
   未所持を優先する。未所持が無ければ同じ等級の所持済みへ回して限界突破に変える。 */
/* 装備ガチャのレア度。フィールドのドロップ表とは別に持つ。
   以前は ri(1,4) を最低レア度に使っており、4回に1回が伝説になっていた。
   伝説はキャラクターのSSR（約4%）と同じくらいの重みに揃える。 */
const GACHA_RARITY=[
  [1,360],   // 上質
  [2,400],   // 希少
  [3,200],   // 秀逸
  [4,40],    // 伝説  … 4.0%
];
function gachaRarity(guaranteeRare){
  const box=guaranteeRare?GACHA_RARITY.filter(([r])=>r>=2):GACHA_RARITY;
  const total=box.reduce((a,[,w])=>a+w,0);
  let roll=rnd()*total;
  for(const [r,w] of box){if(roll<w)return r;roll-=w;}
  return box[0][0];}
function rollCharacter(guaranteeSR){
  const pool=allRoster().filter(x=>charTier(x.ch).weight>0);
  const tiers=guaranteeSR?["SR","SSR"]:TIER_ORDER;
  const box=pool.filter(x=>tiers.includes(x.ch.tier));
  const total=box.reduce((a,x)=>a+CTIER[x.ch.tier].weight,0);
  let roll=rnd()*total,tier=box.length?box[0].ch.tier:"R";
  for(const t of tiers){const w=box.filter(x=>x.ch.tier===t).reduce((a,x)=>a+CTIER[t].weight,0);
    if(roll<w){tier=t;break;}roll-=w;}
  const same=box.filter(x=>x.ch.tier===tier);
  const fresh=same.filter(x=>!S.unlockedCharacters.includes(x.k+":"+x.ch.id));
  return pick(fresh.length?fresh:(same.length?same:box));}
const unlockedRoster=()=>allRoster().filter(x=>(S.unlockedCharacters||[]).includes(x.k+":"+x.ch.id));

/* ---------- データ引き継ぎの画面 ---------- */
/* ファイルに落とす。93KBにもなるので、貼り付けよりこちらを主にする。 */
async function saveTransferFile(){
  let code;try{code=await makeTransferCode();}catch(e){return toast(e.message,"ng");}
  const d=new Date(),z=n=>String(n).padStart(2,"0");
  const name=`descent-${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}.txt`;
  const url=URL.createObjectURL(new Blob([code],{type:"text/plain"}));
  const a=document.createElement("a");a.href=url;a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
  toast("引き継ぎファイルを保存しました","ok");}
/* ファイルから読む。中身を見せてから確認する。 */
function pickTransferFile(after){
  const inp=document.createElement("input");inp.type="file";
  inp.accept="text/plain,application/json,.txt,.json";
  inp.style.display="none";document.body.appendChild(inp);
  inp.addEventListener("change",async()=>{
    const f=inp.files&&inp.files[0];inp.remove();if(!f)return;
    let got;try{got=await readTransferCode(await f.text());}catch(e){return toast(e.message,"ng");}
    confirmTransfer(got);});
  inp.click();}
/* コードを出す。全文を選べる形で置き、あわせて写しも取る。 */
async function showTransferCode(after){
  let code;try{code=await makeTransferCode();}catch(e){return toast(e.message,"ng");}
  invMenu("引き継ぎコード",c=>{
    const n=document.createElement("div");n.className="st";
    n.innerHTML=`このコードだけで、いまの進行をそのまま別の端末へ移せます（${code.length.toLocaleString()}文字）。`
      +`<br><b style="color:var(--gold)">他人に渡さないでください。</b>渡した相手が同じデータで遊べてしまいます。`;
    c.appendChild(n);
    const ta=document.createElement("textarea");ta.readOnly=true;ta.value=code;
    ta.style.cssText="width:100%;height:120px;margin-top:9px;background:#0a0810;border:1px solid var(--line);color:var(--ink2);font-size:11px;word-break:break-all";
    c.appendChild(ta);
    const cp=document.createElement("div");cp.className="btn gold";cp.textContent="コードを写す";
    tapEl(cp,async()=>{
      try{await navigator.clipboard.writeText(code);toast("コードを写しました","ok");}
      catch(e){ta.select();toast("長押しして選び、写してください","ng");}});
    c.appendChild(cp);
    const f=document.createElement("div");f.className="btn gh";f.textContent="ファイルに保存";
    tapEl(f,()=>saveTransferFile());c.appendChild(f);},after);}

/* ---------- 倉庫: アイコン格子 + フィルタ/並べ替え/売却 ---------- */
/* 結晶の売値。上位1個＝下位4個の交換比に合わせて4倍ずつ。
   強化材としての価値を下回らせるため、単価そのものは低く置く。 */
const matSellValue=tier=>5*Math.pow(4,Math.max(0,tier-1));
function materialCount(kind){return Object.values(matBucket(kind)).reduce((a,n)=>a+(+n||0),0);}
function spendAny(kind,n){const b=matBucket(kind);for(const t of Object.keys(b).sort((a,z)=>+a-+z)){const take=Math.min(n,b[t]||0);b[t]-=take;n-=take;if(!n)break;}return n===0;}
const paidId=()=>"paid_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2);
/* ---------- 継承（装備の階層引き上げ） ----------
   深く潜るたび、良いオプションが付いた装備が階層差だけで置き去りになる。
   拾い直しを強いると「気に入った1本を育てる」楽しみが消えるので、
   同じレア度の装備を素材にして、お気に入りの1本を今の階層へ引き上げられるようにする。

   引き上げ先は「投入した素材のうち最も浅い階層」。素材より上には行けないので、
   深層の装備を配らないかぎりインフレしない。素材はレア度が同じものだけ受け付ける。
   伝説を伸ばすには伝説を差し出すことになるので、価値の交換として釣り合う。 */
const INHERIT_NEED=3;                       // 素材に要る同レア装備の数
const inheritStock=()=>(S.paidInventory.sigils||[]).length;
/* 引き上げ候補。同じレア度で、装備中でなく、対象より深い階層のもの。 */
const inheritCandidates=it=>S.stash.filter(x=>x!==it&&!x.locked&&x.rar===it.rar&&x.ilvl>it.ilvl
  &&!SLOTK.some(k=>S.gear[k]===x));
/* 素材から決まる引き上げ先。最も浅い素材の階層まで。 */
const inheritTarget=(it,picked)=>picked.length<INHERIT_NEED?null
  :Math.min(...picked.map(x=>x.ilvl));
/* 引き上げ後の姿を作る。オプションの構成と品質はそのままに、値だけ新しい階層で引き直す。
   「同じ装備が今の階層の強さになる」ことが目的なので、名前も固有効果も変えない。
   予測表示と実行の両方がここを通るので、画面の数字と結果が食い違わない。 */
function inheritedCopy(it,ilvl){
  const out=Object.assign({},it,{ilvl,
    main:it.main?Object.assign({},it.main):null,
    affs:it.affs.map(a=>Object.assign({},a))});
  if(out.main){const sd=SLOTS.find(x=>x.k===out.slot);
    if(sd){const m=Math.pow(ilvl,.62);
      /* 主能力は生成時と同じ式で引き直す。振れ幅は残さず中央値にする
         （引き上げのたびに引き直せる「振り直し」にしないため）。 */
      out.main.v=Math.max(1,Math.round((sd.lo+sd.hi)/2*m));}}
  for(const a of out.affs){const rule=AFF.find(c=>c.id===a.id);
    if(rule)a.v=Math.max(1,Math.round(rule.f(ilvl)*(a.q||1)));}
  out.lv=Math.min(out.lv,itemMaxLv(out));
  out.score=iScore(out);
  return out;}
function applyInherit(it,ilvl){
  const before=iScore(it),next=inheritedCopy(it,ilvl);
  it.ilvl=next.ilvl;it.main=next.main;it.affs=next.affs;it.lv=next.lv;it.score=next.score;
  return {before,after:it.score};}

function buyPaid(kind,cost){if(S.premium<cost)return false;if(kind==="slots"&&(S.paidInventory.slots||[]).length>=2)return false;S.premium-=cost;const rec={id:paidId(),kind,source:"purchase",createdAt:Date.now()};S.paidInventory[kind].push(rec);save();return true;}
function adminGrantPaid(kind){if(!S.admin||!S.paidInventory[kind])return false;S.paidInventory[kind].push({id:paidId(),kind,source:"admin",admin:true,createdAt:Date.now()});save();return true;}
function useCatalyst(fromTier){const a=S.paidInventory.catalysts;if(!a.length||(S.mats.crystal[fromTier]||0)<4)return false;S.mats.crystal[fromTier]-=4;S.mats.crystal[+fromTier+1]=(S.mats.crystal[+fromTier+1]||0)+1;a.shift();save();return true;}
function loadoutCapacity(){return Math.min(6,4+(S.paidInventory.slots||[]).length);}
/* いま何個作れるか。結晶・核・固有素材・保有上限のうち、いちばん少ないところで決まる。 */
function craftableCount(key){const d=CONSUMABLES[key],r=d.craft||{};
  let n=CFG.CRAFT_STOCK_CAP-(S.consumables[key]||0);
  if(r.crystal)n=Math.min(n,Math.floor(materialCount("crystal")/r.crystal));
  if(r.core)n=Math.min(n,Math.floor(materialCount("core")/r.core));
  for(const [pk,need] of Object.entries(r.parts||{}))n=Math.min(n,Math.floor(partCount(pk)/need));
  return Math.max(0,n);}
/* 足りない材料の一覧。何が足りなくて作れないのかを画面に出すため。 */
function craftMissing(key){const r=CONSUMABLES[key].craft||{},out=[];
  if(r.crystal&&materialCount("crystal")<r.crystal)out.push(`結晶 ${materialCount("crystal")}/${r.crystal}`);
  if(r.core&&materialCount("core")<r.core)out.push(`核 ${materialCount("core")}/${r.core}`);
  for(const [pk,need] of Object.entries(r.parts||{}))
    if(partCount(pk)<need){const d=PARTS[pk],src=(ET[d.from[0]]&&ET[d.from[0]].n)||"";
      out.push(`${d.n} ${partCount(pk)}/${need}${src?`（${src}）`:""}`);}
  return out;}
/* 材料の内訳を文字にする。確認と一覧の両方で使う。 */
function craftCostText(key,n=1){const r=CONSUMABLES[key].craft||{},out=[];
  if(r.crystal)out.push(`結晶${r.crystal*n}`);
  if(r.core)out.push(`核${r.core*n}`);
  for(const [pk,need] of Object.entries(r.parts||{}))out.push(`${PARTS[pk].n}${need*n}`);
  return out.join(" / ");}
/* n個まとめて調合する。確認してから消費する。 */
function craftItem(key,n=1){
  const d=CONSUMABLES[key];n=Math.min(Math.max(1,Math.floor(n)),craftableCount(key));
  if(n<1)return false;
  const r=d.craft||{},have=S.consumables[key]||0;
  const lines=[`使う材料: ${craftCostText(key,n)}`];
  if(r.crystal)lines.push(`結晶 ${materialCount("crystal")} → ${materialCount("crystal")-r.crystal*n}`);
  if(r.core)lines.push(`核 ${materialCount("core")} → ${materialCount("core")-r.core*n}`);
  for(const [pk,need] of Object.entries(r.parts||{}))
    lines.push(`${PARTS[pk].n} ${partCount(pk)} → ${partCount(pk)-need*n}`);
  lines.push(`${d.n} ${have} → ${have+n}個`);
  ask(`${d.n} を ${n}個 調合`,lines.join("\n"),()=>{
    if(craftableCount(key)<n)return;
    if(r.crystal)spendAny("crystal",r.crystal*n);
    if(r.core)spendAny("core",r.core*n);
    for(const [pk,need] of Object.entries(r.parts||{}))spendPart(pk,need*n);
    S.consumables[key]=have+n;SFX.chest();toast(`${d.n} +${n}`,"ok");save();S.tab="inv";S.invSub="craft";openTown();});
  return true;}

/* 調合。倉庫のタブ内に直接置く（以前はポップアップだった）。
   系統ごとにまとめ、段階が上がるほど強く・作りにくいことが見えるようにする。 */
function renderCraftPanel(b){
  const head=document.createElement("div");head.className="matLine";
  head.innerHTML=`<span>${icon("m_crystal",14)} 結晶 <b>${materialCount("crystal")}</b></span>`
    +`<span>${icon("m_core",14)} 核 <b>${materialCount("core")}</b></span>`;
  b.appendChild(head);
  hint(b,"craft",`上の段ほど強く、特定の敵からしか落ちない素材が要ります。1種あたり${CFG.CRAFT_STOCK_CAP}個まで保有できます。`);
  /* 22種を全部開いて並べると、下まで延々スクロールすることになる。
     系統ごとに畳み、見出しに「いくつ作れるか」を出して、開く前に判断できるようにする。 */
  S.craftOpen=S.craftOpen||{};
  const fams=[];for(const k of CONSUMABLE_KEYS){const f=CONSUMABLES[k].fam;if(!fams.includes(f))fams.push(f);}
  for(const fam of fams){
    const keys=CONSUMABLE_KEYS.filter(k=>CONSUMABLES[k].fam===fam);
    const canMake=keys.filter(k=>craftableCount(k)>0).length;
    const held=keys.reduce((a,k)=>a+(S.consumables[k]||0),0);
    const open=!!S.craftOpen[fam];
    const h=document.createElement("div");h.className="fold craftFold"+(open?" on":"");
    h.innerHTML=`<span>${conIcon(keys[0],16)} ${fam}</span>`
      +`<em>${canMake?`作れる ${canMake}種`:"材料不足"} / 所持 ${held}</em>`;
    tapEl(h,()=>{S.craftOpen[fam]=!open;save();openTown();});
    b.appendChild(h);
    if(!open)continue;
    for(const k of keys){
      const x=CONSUMABLES[k],have=S.consumables[k]||0,max=craftableCount(k),miss=craftMissing(k);
      /* 1品1行。作る個数は押してから選ぶので、枠ごとに ×1 ×5 ×10 を並べない。 */
      const d=document.createElement("div");d.className="card tap craftRow"+(max?"":" no");
      d.style.borderColor=hexA(rareFrame(x.rar),.75);
      d.innerHTML=`<div class="row"><div class="nm">${conIcon(k,18)} ${x.n}`
        +` <b class="${RC[rarIdx(x.rar)]}" style="font-size:11px">${rareName(x.rar)}</b></div>`
        +`<span class="tag">所持 ${have}</span></div>`
        +`<div class="st">${x.d}</div>`
        +`<div class="ty">材料 ${craftCostText(k)}</div>`
        +`<div class="ty">`+(max?`<b style="color:#7ad04e">いま${max}個まで作れる — 押して個数を選ぶ</b>`
             :`<b style="color:#d05a54">不足: ${miss.join(" / ")}</b>`)+`</div>`;
      tapEl(d,()=>{if(!max)return toast("材料が足りません","ng");
        askQuantity(`${x.n} を作る`,`材料 ${craftCostText(k)}（1個あたり） / 所持 ${have}`,max,
          n=>craftItem(k,n));});
      b.appendChild(d);}}
}

  for(const [k,n] of INV_TABS){const d=document.createElement("div");d.className="btn "+(sub===k?"gold":"gh");d.textContent=n;
    tapEl(d,()=>{S.invSub=k;F.sellMode=false;F.dismantleMode=false;F.sellSel=[];save();openTown();});tabs.appendChild(d);}

(()=>{let down=null;const el=$("cv");el.addEventListener("pointerdown",e=>{if(S.settings.controlMode!=="onehand"||S.scene!=="dungeon")return;down={x:e.clientX,y:e.clientY};IN.ox=e.clientX;IN.oy=e.clientY;});el.addEventListener("pointermove",e=>{if(!down||S.settings.controlMode!=="onehand")return;let dx=e.clientX-down.x,dy=e.clientY-down.y,l=Math.hypot(dx,dy)||1;IN.dx=dx/l;IN.dy=dy/l;});el.addEventListener("pointerup",e=>{if(!down)return;if(Math.hypot(e.clientX-down.x,e.clientY-down.y)<12){HELD[0]=true;setTimeout(()=>HELD[0]=false,80);}IN.dx=IN.dy=0;down=null;});})();
/* 右端の縦一列。いちばん下に操作モード切替、その上に持ち込み枠ぶんのアイテムボタン。
   アイテムは1タップで使える（長押しの扇は廃止）。枠が5つ以上のときは少し小さくして、
   縦に伸びすぎて上部HUDへ食い込まないようにする。 */
const CONTROL_MODES=[["manual","手動"],["onehand","片手"],["auto","オート"]];
function autoAllowed(){return S.floor<S.deepest;}   // 未到達の深度は自力で越えてほしい
/* 切替は 手動 → 片手 → オート の3つを必ず一巡する。
   以前は未到達の深度でオートを黙って飛ばしていたので、
   最深で潜っている間は2択にしか見えず「オートが無い」と読めた。
   飛ばすのをやめて、代わりに理由を出す。 */
/* 左右反転を body の class へ写す。CSS 側で left/right を入れ替える。 */
const MIRRORS=[["mirStick","移動キー"],["mirSkill","技"],["mirItem","道具"]];
function applyMirror(){
  for(const [k] of MIRRORS)document.body.classList.toggle(k,!!S.settings[k]);}
function cycleControlMode(){
  const order=CONTROL_MODES.map(x=>x[0]);let i=order.indexOf(S.settings.controlMode||"manual");
  i=(i+1)%order.length;
  S.settings.controlMode=order[i];save();
  const label=(CONTROL_MODES.find(x=>x[0]===order[i])||[])[1];
  const cut=order[i]==="onehand"?CFG.ONEHAND_DMG:order[i]==="auto"?CFG.AUTO_DMG:1;
  toast("操作: "+label+(cut<1?`（与ダメージ ${Math.round((1-cut)*100)}%減）`:"")
    +(order[i]==="auto"&&!autoAllowed()?" — 未到達の深度です":""),
    order[i]==="auto"&&!autoAllowed()?"ng":"ok");
  IN.dx=IN.dy=0;renderRail();updHUD();}
function renderRail(){
  const rail=$("railR");if(!rail)return;
  /* 一辺は44px。40pxで作ると全体規則の min-height:44px に引き伸ばされ、
     border-radius:50% が真円ではなく縦長の楕円になる。 */
  const cap=loadoutCapacity(),sz=44;
  rail.innerHTML="";
  /* 操作の切替は列のいちばん下に固定する（column-reverse なので先に入れる）。
     いつも同じ場所にある方が、盤面を見たまま指で探せる。
     その上に道具の枠を並べる。 */
  const a=document.createElement("div");a.id="autoBtn";a.style.width=a.style.height=sz+"px";
  const mode=CONTROL_MODES.find(x=>x[0]===(S.settings.controlMode||"manual"))||CONTROL_MODES[0];
  a.classList.toggle("on",mode[0]!=="manual");
  a.innerHTML=`${mode[1]}<small>切替</small>`;
  hook(a,()=>{if(S.scene==="dungeon")cycleControlMode();});
  rail.appendChild(a);
  for(let i=0;i<cap;i++){
    const key=S.loadout[i],def=key&&CONSUMABLES[key];
    const d=document.createElement("div");d.className="railBtn"+(def?"":" empty");
    /* 空き枠も出す。持ち込んでいない時だけ列の長さが変わると、
       同じ道具が毎回ちがう高さに来て、見ずに押せなくなる。 */
    if(i===0)d.id="pot";                      // 練習部屋の案内が指す先
    d.dataset.slot=i;d.style.width=d.style.height=sz+"px";
    if(def){/* 枠＝等級、絵と地＝系統の色。倉庫・持ち込み・戦闘の3画面で同じ規則にする。 */
      const col=def.col||"#cfc6dd";
      d.style.borderColor=hexA(rareFrame(def.rar),.7);
      d.style.background=`radial-gradient(circle at 34% 28%,${hexA(col,.20)},rgba(14,11,20,.86) 72%)`;
      d.style.color=col;}
    d.innerHTML=def?`${conIcon(key,15)}<b>${S.runItems[i]||0}</b>`:'<small>空き</small>';
    if(def)hook(d,()=>{if(S.scene==="dungeon"&&!S.paused)useItem(i);});
    rail.appendChild(d);}}
hook($("act"),()=>{if(S.scene==="dungeon"&&!S.paused)doAction();});
tapEl($("mmW"),()=>{if(S.scene==="dungeon")toggleMap();});
tapEl($("profileIcon"),openProfileIconPick);
tapEl($("townName"),editPlayerName);
hook($("pauseB"),()=>{if(S.scene==="dungeon"&&!S.paused){S.ptab="drops";openPause();}});
tapEl($("btnResume"),()=>{$("scPause").classList.remove("on");S.paused=false;updHUD();});
tapEl($("btnGiveUp"),()=>{$("scPause").classList.remove("on");
  ask("ここで力尽きる",`編成全員を全滅扱いにして、今回拾った ${S.bag.length} 個を失って拠点に戻ります。`,()=>{S.partyIndex=S.formation.length;endRun(false,"探索を断念した");});});
tapEl($("btnBack"),leaveEnd);
tapEl($("askY"),()=>{$("askPop").classList.remove("on");S.paused=askPrevPaused;const f=askFn;askFn=askNoFn=null;if(f)f();});
tapEl($("askN"),()=>{$("askPop").classList.remove("on");S.paused=askPrevPaused;const f=askNoFn;askFn=askNoFn=null;if(f)f();});
hook($("lockHit"),lockHit);
for(const t of document.querySelectorAll("#scTown .tab"))tapEl(t,()=>{
  const phase=(S.tutorial||{}).phase,target=t.dataset.t;
  if(phase&&phase.startsWith("tour_")&&advanceTour(target))return;
  if(phase==="equip_tab"&&target!=="gear"||phase==="shop"&&target!=="shop"||phase==="formation"&&target!=="prep")return;
  S.tab=target;
  if(target!=="gear"){S.gearSlot=null;S.gearCompareChoice=null;}
  if(phase==="equip_tab"&&target==="gear"){S.gearSub="equip";S.tutorial.phase="equip";}
  if(phase==="shop"&&target==="shop"){S.shopSub="gacha";S.tutorial.phase="equip_gacha";}
  if(phase==="formation"&&target==="prep")S.tutorial.phase="formation_slot";
  save();openTown();});
for(const t of document.querySelectorAll("#scPause .tab"))tapEl(t,()=>{S.ptab=t.dataset.p;openPause();});

/* 練習部屋は初回起動でしか組み立てられず、S.scene も保存されない。
   そのため練習中に再読込すると部屋ごと失われ、チュートリアルが training_* のまま
   永久に止まる（深度5ボスの訓練用装備一式も無料ガチャ2回も受け取れなくなる）。
   練習中の再開は、もう一度練習部屋の頭から始める。 */
const TRAINING_PHASES=["training_intro","training_cleave","training_dash","training_slam","training_potion","training_return"];
const freshStart=!load();
applyMirror();   // 反転設定は起動した時点で効かせる（潜るまで待たせない）
if(freshStart){S.cls="warrior";S.avatars.warrior="gai";S.formation=["warrior:gai"];S.profileAvatar="warrior:gai";S.gear={};for(const k of SLOTK)S.gear[k]=null;S.p=newPlayer();save();beginTraining();}
else{if(!S.formation.length)S.formation=["warrior:gai"];S.p=newPlayer();
  if(TRAINING_PHASES.includes((S.tutorial||{}).phase)){S.tutorial={phase:"training_intro",gearIndex:0};beginTraining();}
  else openTown();}
updTutorialBar();

let last=performance.now(),acc=0;
function frame(now){
  requestAnimationFrame(frame);
  const fps=S.settings.eco?30:60;
  if(now-last<1000/fps*.92)return;
  let dt=(now-last)/1000;last=now;
  if(dt>.25)dt=.25;
  if(LK&&!LK.done)lockTick(dt);
  if(S.scene==="dungeon"&&!S.paused){
    const STEP=1/fps;
    acc+=dt;let n=0;
    while(acc>=STEP&&n++<4){update(STEP);acc-=STEP;}
    if(acc>STEP*4)acc=0;
    draw();}}
requestAnimationFrame(frame);
</script>
</body>
</html>
