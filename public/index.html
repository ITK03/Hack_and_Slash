<style>
:root{
  --bg:#08070c;--bg2:#0d0b13;--panel:#15121f;--panel2:#100e18;
  --line:#2a2338;--line2:#3a3050;--ink:#ded7ec;--ink2:#8e86a2;--ink3:#5b5470;
  --gold:#e0a53c;--blood:#d64550;
  --c0:#c8c4bc;--c1:#5ad06a;--c2:#5a8fe0;--c3:#e0c040;--c4:#ff8adf;
  --fs:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:var(--fs);
  color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none;
  overscroll-behavior:none;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.2;
  background:repeating-linear-gradient(117deg,transparent 0 7px,rgba(255,255,255,.018) 8px 9px),
    radial-gradient(circle at 18% 12%,rgba(112,75,145,.18),transparent 35%),
    radial-gradient(circle at 82% 88%,rgba(120,55,35,.12),transparent 40%)}
canvas#cv{display:block;width:100%;height:100%;position:absolute;inset:0}

#hud{position:absolute;top:0;left:0;right:56px;padding:calc(env(safe-area-inset-top) + 7px) 8px 8px 11px;
  pointer-events:none;z-index:10;background:linear-gradient(180deg,rgba(6,5,10,.94),rgba(6,5,10,0))}
.bar{height:9px;border-radius:2px;background:#0c0a12;overflow:hidden;
  box-shadow:inset 0 0 0 1px var(--line),inset 0 2px 5px rgba(0,0,0,.8)}
.bar>i{display:block;height:100%;width:100%;box-shadow:0 0 10px currentColor}
#hpF{background:linear-gradient(180deg,#f0555e,#8e1220);color:#e04048;transition:width .25s ease-out}
#mpF{background:linear-gradient(180deg,#6ab4f0,#1a3e70);color:#4f8fe0}
#xpF{background:linear-gradient(180deg,#9ae05a,#3d6a24);color:#7cd44c}
.hrow{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.hrow .bar{flex:1}
.hval{font-size:10px;font-weight:700;min-width:48px;text-align:right;color:var(--ink2)}
#meta{margin-top:5px;display:flex;justify-content:space-between;font-size:10px;
  color:var(--ink3);font-weight:600;letter-spacing:.03em;align-items:center}
#meta b{color:var(--ink);font-weight:800}
#goldT{color:var(--gold)}
#loot{margin-top:4px;font-size:10px;font-weight:800;display:flex;gap:7px}
#pauseB{position:absolute;right:9px;top:calc(env(safe-area-inset-top) + 6px);z-index:14;
  width:34px;height:34px;border-radius:3px;border:1px solid var(--line2);background:rgba(14,11,22,.88);
  display:none;align-items:center;justify-content:center;pointer-events:auto;color:var(--ink2)}
#pauseB.show{display:flex}
#pauseB span{width:3px;height:13px;background:currentColor;margin:0 2px;border-radius:1px}
#mmW{position:absolute;right:9px;top:calc(env(safe-area-inset-top) + 74px);z-index:11;
  width:88px;border-radius:3px;overflow:hidden;border:1px solid var(--line);
  background:rgba(8,7,14,.72);pointer-events:none}
#mm{width:88px;height:88px;display:block}
#mmGuide{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid rgba(80,70,105,.7)}
.mmDist{height:22px;display:flex;align-items:center;justify-content:center;gap:3px;font-size:9px;font-weight:900;background:rgba(10,8,16,.82)}
.mmDist i{display:block;width:0;height:0;border-top:4px solid transparent;border-bottom:4px solid transparent;
  border-left:7px solid currentColor;filter:drop-shadow(0 0 3px currentColor);transform:rotate(var(--dir,0rad))}
#mmStair{color:#e08830}#mmPortal{color:#5aa0ff}
#buffs{position:absolute;left:11px;top:calc(env(safe-area-inset-top) + 108px);z-index:11;
  display:flex;flex-direction:column;gap:4px;pointer-events:none}
.buff{font-size:10px;font-weight:700;padding:4px 9px;border-radius:2px;background:rgba(10,8,16,.85);
  border-left:2px solid var(--gold);color:#d8cbe8;white-space:nowrap}
#combo{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 128px);
  z-index:13;pointer-events:none;font-size:26px;font-weight:900;opacity:0;color:var(--gold);
  text-shadow:0 2px 12px rgba(224,165,60,.6),0 1px 3px #000;transition:opacity .18s}
#combo.on{opacity:1}
#combo small{display:block;font-size:9px;font-weight:700;letter-spacing:.22em;
  color:var(--ink2);text-align:center;margin-top:-2px;text-shadow:none}
#bossBar{position:absolute;left:50%;transform:translateX(-50%);
  top:calc(env(safe-area-inset-top) + 92px);z-index:12;width:62%;display:none;pointer-events:none}
#bossBar .bn{font-size:11px;font-weight:800;color:#f09a86;text-align:center;margin-bottom:4px;
  letter-spacing:.08em;text-shadow:0 1px 4px #000}
#bossF{background:linear-gradient(180deg,#f0404a,#5e0a12);color:#d8342c}

#stickZone{position:absolute;left:0;bottom:0;width:50%;height:46%;z-index:20}
#stick{position:absolute;width:114px;height:114px;border-radius:50%;
  border:1px solid rgba(200,190,220,.14);background:rgba(18,15,26,.3);
  transform:translate(-50%,-50%);opacity:.16;transition:opacity .1s;pointer-events:none}
#stick>i{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;
  border-radius:50%;background:rgba(222,215,236,.26);
  box-shadow:0 0 16px rgba(255,240,210,.22),inset 0 0 0 1px rgba(255,255,255,.14)}
#pad{position:absolute;right:6px;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:20;
  width:200px;height:190px;pointer-events:none}
.sk{position:absolute;border-radius:50%;pointer-events:auto;overflow:hidden;
  border:1px solid rgba(190,178,214,.22);
  background:radial-gradient(circle at 34% 28%,#3b3450,#151222 72%);
  box-shadow:0 3px 10px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.07);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:10px;font-weight:800;color:#efe6d6;text-align:center;line-height:1.15;padding:3px}
.sk .cd{position:absolute;inset:0;background:rgba(5,4,9,.76);transform-origin:bottom;pointer-events:none}
.sk .cost{font-size:8px;color:#7fb4f0;font-weight:700;margin-top:2px}
.sk.no{opacity:.34;filter:grayscale(.6)}
.sk:active{transform:scale(.92)}
#s0{width:80px;height:80px;right:3px;bottom:3px;font-size:12px;border-color:rgba(224,165,60,.4);
  background:radial-gradient(circle at 34% 28%,#4a3a26,#1a1410 72%)}
#s1{width:58px;height:58px;right:86px;bottom:8px}
#s2{width:58px;height:58px;right:64px;bottom:76px}
#s3{width:58px;height:58px;right:6px;bottom:94px}
#pot{position:absolute;left:0;bottom:10px;width:56px;height:56px;border-radius:50%;
  pointer-events:auto;border:1px solid rgba(214,69,80,.55);
  background:radial-gradient(circle at 34% 28%,#5e1622,#220810 72%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:8px;font-weight:700;color:#ffb0b4}
#pot b{font-size:17px;line-height:1;font-weight:900}
#pot.no{opacity:.3;filter:grayscale(.7)}
#act{position:absolute;left:50%;transform:translateX(-50%);
  bottom:calc(env(safe-area-inset-bottom) + 112px);z-index:22;padding:12px 20px;border-radius:3px;
  font-size:13px;font-weight:800;display:none;white-space:nowrap;max-width:86vw;text-align:center}
#act.down{background:linear-gradient(180deg,#5e3c14,#2a1a06);border:1px solid var(--gold);color:#ffdca4}
#act.up{background:linear-gradient(180deg,#1a3e5e,#0a1a2a);border:1px solid #4f9fd8;color:#cfe8ff}
#act.use{background:linear-gradient(180deg,#3e2660,#180c28);border:1px solid #9c6cd8;color:#e8d0ff}
#act.no{background:#1a1622;border:1px solid var(--line2);color:var(--ink3)}

.screen{position:absolute;inset:0;z-index:40;background:var(--bg);display:none;flex-direction:column}
.screen.on{display:flex}
.shead{padding:calc(env(safe-area-inset-top) + 14px) 15px 10px;flex:0 0 auto;
  background:linear-gradient(180deg,var(--bg2),var(--bg));border-bottom:1px solid var(--line)}
.sbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:14px 15px 20px}
.sfoot{flex:0 0 auto;padding:11px 15px calc(env(safe-area-inset-bottom) + 13px);
  border-top:1px solid var(--line);background:var(--bg2)}
h2{font-size:17px;font-weight:900;letter-spacing:.06em;color:#f0e9dc}
.sub{font-size:11px;color:var(--ink3);margin-top:3px;font-weight:600}
.tabs{display:flex;gap:4px;margin-top:12px}
.tab{flex:1;padding:9px 2px;text-align:center;font-size:11px;font-weight:800;border-radius:2px;
  background:#100e18;border:1px solid var(--line);color:var(--ink3)}
.tab.on{background:linear-gradient(180deg,#2a2238,#1c1728);border-color:var(--line2);color:#f0e6d4}
h3{font-size:10px;font-weight:800;color:var(--ink3);margin:18px 0 8px;letter-spacing:.18em}
.sbody>h3:first-child{margin-top:0}
.card{background:linear-gradient(135deg,rgba(255,255,255,.025),transparent 38%),
  repeating-linear-gradient(118deg,transparent 0 9px,rgba(255,255,255,.012) 10px 11px),
  linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);
  border-radius:3px;padding:12px;margin-bottom:8px;position:relative;overflow:hidden}
.card.tap:active{background:#1c1728}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.nm{font-size:13px;font-weight:800}
.ty{font-size:10px;color:var(--ink3);margin-top:3px;font-weight:600}
.st{font-size:11px;color:#a49cb8;margin-top:7px;line-height:1.7}
.st .up{color:#7ad04e;font-weight:700}.st .dn{color:#d05a54;font-weight:700}
.leg{color:#ff8adf;font-size:11px;margin-top:7px;line-height:1.55;font-weight:700;
  padding-top:7px;border-top:1px solid var(--line)}
.c0{color:var(--c0)}.c1{color:var(--c1)}.c2{color:var(--c2)}.c3{color:var(--c3)}
.c4{background:linear-gradient(90deg,#ff6a6a,#ffd24a,#6ae86a,#5ac8ff,#c07aff,#ff6adf);
  -webkit-background-clip:text;background-clip:text;color:transparent;font-weight:900}
.tag{display:inline-block;font-size:8px;padding:2px 5px;border-radius:2px;border:1px solid currentColor;
  opacity:.75;margin-left:5px;vertical-align:1px;font-weight:800}
.btn{padding:13px;border-radius:3px;text-align:center;font-size:13px;font-weight:800;
  border:1px solid var(--line2);background:linear-gradient(90deg,rgba(255,255,255,.025),transparent 35%),linear-gradient(180deg,#2a2238,#15111f);
  color:#e6dfd2;margin-top:8px}
.btn:active{filter:brightness(1.4)}
.btn.pri{background:linear-gradient(180deg,#7e2430,#3e0c14);border-color:#b04452;color:#ffd9d4}
.btn.gold{background:linear-gradient(180deg,#6e5418,#382a06);border-color:var(--gold);color:#ffeab4}
.btn.gh{background:transparent;border-color:var(--line);color:var(--ink2);font-weight:700;
  font-size:11px;padding:10px}
.btn.no{opacity:.35;filter:grayscale(.6)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.slot{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);
  border-radius:3px;padding:9px 5px;text-align:center;min-height:78px;display:flex;
  flex-direction:column;justify-content:center;gap:3px}
.slot .ic{color:var(--ink3);margin-bottom:2px}
.slot .ic.e{opacity:.28}
.slot .sl{font-size:9px;color:var(--ink3);font-weight:700}
.slot .si{font-size:10px;font-weight:800;line-height:1.3;word-break:break-all}
.slot.empty{border-style:dashed;border-color:#221c30}
.slot.empty .si{color:#3d3750}
.slot:active{background:#1c1728}
.stat{display:flex;justify-content:space-between;font-size:12px;padding:7px 0;
  border-bottom:1px solid var(--line);color:var(--ink2);font-weight:600}
.stat:last-child{border-bottom:none}
.stat b{color:#efe7d8;font-weight:800}
.alloc{display:flex;align-items:center;justify-content:space-between;padding:10px 0;
  border-bottom:1px solid var(--line)}
.alloc .an{font-size:12px;color:#cfc7dd;font-weight:800}
.alloc .ad{font-size:10px;color:var(--ink3);margin-top:3px;font-weight:600}
.alloc .av{font-size:17px;font-weight:900;min-width:34px;text-align:right;color:#f0e8d8}
.plus{width:32px;height:32px;border-radius:3px;background:linear-gradient(180deg,#2e2648,#1e1830);
  border:1px solid #4a3e70;color:#c8bcf0;font-size:18px;font-weight:900;
  display:flex;align-items:center;justify-content:center}
.plus.no{opacity:.2}

/* 倉庫: アイコン格子 + 固定バー */
#invBar{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap}
.chip{font-size:10px;font-weight:800;padding:6px 9px;border-radius:2px;background:#100e18;
  border:1px solid var(--line);color:var(--ink3)}
.chip.on{border-color:var(--line2);color:#f0e6d4;background:#221c30}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cell{aspect-ratio:1;border:1px solid var(--line);border-radius:3px;position:relative;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,var(--panel),var(--panel2))}
.cell:active{filter:brightness(1.5)}
.cell.sel{outline:2px solid var(--gold);outline-offset:-2px}
.cell .eq{position:absolute;top:2px;right:3px;font-size:8px;font-weight:900;color:var(--gold)}
.cell .lvl{position:absolute;bottom:1px;right:3px;font-size:8px;color:var(--ink3);font-weight:700}
#sellBar{position:sticky;bottom:-20px;background:var(--bg2);border-top:1px solid var(--line);
  margin:10px -15px -20px;padding:10px 15px calc(env(safe-area-inset-bottom) + 12px);z-index:5;
  box-shadow:0 -10px 20px rgba(8,7,12,.9)}
.grid{padding-bottom:74px}   /* 固定バーの裏に最終行が隠れないように */

#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 150px);
  z-index:70;padding:9px 17px;border-radius:2px;background:rgba(9,7,14,.95);
  border-left:2px solid var(--gold);font-size:12px;font-weight:800;opacity:0;
  transition:opacity .2s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}

.pop{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
  background:rgba(3,2,6,.92);padding:18px}
.pop.on{display:flex}
.popc{width:100%;max-width:340px;background:linear-gradient(180deg,#191424,#0f0d16);
  border:1px solid var(--line2);border-radius:4px;padding:20px;max-height:84vh;overflow-y:auto;
  touch-action:pan-y;box-shadow:0 20px 60px rgba(0,0,0,.7);
  animation:pop .26s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.66);opacity:0}100%{transform:scale(1);opacity:1}}
#lvPop{background:#06050a;flex-direction:column;justify-content:center}
.up3{background:linear-gradient(180deg,#141a10,#0e120c);border:1px solid #34432a;border-radius:3px;
  padding:15px;margin-bottom:10px;position:relative;overflow:hidden}
.up3::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:#7cd44c}
.up3:active{background:#1a2114}
.up3 .t{font-size:15px;font-weight:900;color:#aae87e}
.up3 .d{font-size:11px;color:#7e8c74;margin-top:4px;font-weight:600}
/* 宝箱のミニゲーム */
#lockBar{height:44px;border:1px solid var(--line2);border-radius:3px;position:relative;
  background:#0b0912;overflow:hidden;margin:14px 0}
#lockZone{position:absolute;top:0;bottom:0;background:linear-gradient(180deg,#2a6a30,#12401a);
  border-left:1px solid #6ae86a;border-right:1px solid #6ae86a;transition:left .16s,width .16s}
#lockPin{position:absolute;top:-2px;bottom:-2px;width:3px;background:#ffe08a;
  box-shadow:0 0 10px #ffd24a}
#lockPips{display:flex;gap:6px;justify-content:center;margin-bottom:6px}
.pip{width:22px;height:5px;border-radius:2px;background:#241f33}
.pip.ok{background:#6ae86a}.pip.ng{background:#d64550}
textarea{width:100%;height:96px;background:#0a0810;border:1px solid var(--line);border-radius:3px;
  color:var(--ink3);font-size:10px;padding:8px;font-family:ui-monospace,monospace;margin-top:8px}

.filterGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin:7px 0 10px}
.filterGrid.rarity{grid-template-columns:repeat(5,1fr)}
.fbtn{padding:10px 4px;border-radius:3px;border:1px solid var(--line);background:#100e18;color:var(--ink3);font-size:10px;font-weight:900;text-align:center}
.fbtn.on{border-color:var(--gold);background:linear-gradient(180deg,#6e5418,#2c2108);color:#ffeab4}
.popClose{background:linear-gradient(180deg,#3a3348,#171320)!important;border-color:#746886!important;color:#efe8ff!important}
.quickDelta{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin:10px 0}
.qd{border:1px solid var(--line);background:#100d18;border-radius:3px;padding:7px 8px;font-size:10px}
.qd b{display:block;font-size:13px;color:#efe8ff}.qd .up{color:#6ae86a}.qd .dn{color:#ff7070}
.optBox{max-height:180px;overflow-y:auto;touch-action:pan-y;border-top:1px solid var(--line);margin-top:8px;padding-top:8px}
.bagList{display:flex;flex-direction:column;gap:7px}.bagRow{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);background:#100e18;border-radius:3px;padding:9px 10px;font-size:11px;font-weight:800}
.gearPanel{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:8px;align-items:start}
.gearPanel h3{margin:4px 0 6px}.gearPanel .g3{grid-template-columns:repeat(2,1fr);gap:5px}
.gearPanel .slot{min-height:58px;padding:5px 3px}.gearPanel .slot .si{font-size:8px}.gearPanel .slot .sl{font-size:8px}
.gearStats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));padding:6px!important}
.gearStats .ty{grid-column:1/-1}.gearStats .stat{font-size:9px;padding:4px 3px;gap:4px;min-width:0}
.gearStats .stat span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.gearStats .stat b{white-space:nowrap}
.gearCompare{width:min(720px,calc(100vw - 24px));max-width:720px}.gearCompare .optBox{max-height:none;overflow:visible}
.gearCompare .grid,#itC>.grid{padding-bottom:0}
.compareHead{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.compareItem{border:1px solid var(--line);background:#100d18;padding:10px;border-radius:3px;text-align:center;min-width:0}
.compareItem .nm{font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.compareStats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}
.compareStats .after.up,.compareItem.after .up{color:#70e878;text-shadow:0 0 8px rgba(80,220,100,.2)}
.compareStats .after.dn,.compareItem.after .dn{color:#ff6f72;text-shadow:0 0 8px rgba(255,70,75,.18)}
.deathCause{border-color:#6e2028;background:radial-gradient(circle at 50% 0,rgba(150,35,45,.26),transparent 65%),var(--panel2);text-align:center}
.deathCause b{display:block;color:#ff8588;font-size:18px;margin:8px 0}.deathCause .skull{font-size:34px;filter:drop-shadow(0 0 12px #9e2630)}
@media(max-width:520px){.gearPanel{grid-template-columns:1fr}.gearPanel .g3{grid-template-columns:repeat(4,1fr)}
  .gearPanel .slot{min-height:54px}.compareStats{grid-template-columns:1fr}.gearCompare{padding:14px}}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud">
  <div class="hrow"><div class="bar"><i id="hpF"></i></div><div class="hval" id="hpT">0/0</div></div>
  <div class="hrow"><div class="bar" style="height:6px"><i id="mpF"></i></div><div class="hval" id="mpT">MP</div></div>
  <div class="hrow"><div class="bar" style="height:4px"><i id="xpF"></i></div><div class="hval" id="lvT">Lv1</div></div>
  <div id="meta">
    <div>深度 <b id="flT">1</b></div><div id="goldT">0 G</div>

  o.type=ty||"square";o.frequency.setValueAtTime(f,t);
  if(to)o.frequency.exponentialRampToValueAtTime(Math.max(28,to),t+d);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v==null?.13:v,t+.006);
  g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);}
function noise(d,v,c){if(!AC)return;const n=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);
  for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();
  f.type="lowpass";f.frequency.value=c||1400;
  const g=AC.createGain();g.gain.value=v==null?.18:v;s.connect(f);f.connect(g);g.connect(AC.destination);s.start();}

const IN={dx:0,dy:0,id:-1,ox:0,oy:0};
const stick=$("stick"),zone=$("stickZone");
const STICK_MAX=50;
function sStart(x,y,id){IN.id=id;IN.ox=x;IN.oy=y;
  stick.style.left=x+"px";stick.style.top=y+"px";stick.style.opacity="1";
  stick.firstElementChild.style.transform="translate(0,0)";aInit();}
function sMove(x,y){
  /* 生の距離で割ると、遠くまで引くほど遅くなる（クランプ後のベクトルを
     クランプ前の長さで割っていたのが原因）。クランプ後の長さで正規化する。 */
  let dx=x-IN.ox,dy=y-IN.oy;
  const raw=Math.hypot(dx,dy)||1, cl=Math.min(raw,STICK_MAX);
  dx=dx/raw*cl; dy=dy/raw*cl;
  stick.firstElementChild.style.transform=`translate(${dx}px,${dy}px)`;
  if(cl<7){IN.dx=0;IN.dy=0;}else{IN.dx=dx/STICK_MAX;IN.dy=dy/STICK_MAX;}}

/* ---------- ダンジョン（部屋も通路も広く、通路は少なく） ---------- */
const MW=88,MH=88;
let map=null,rooms=[],seen=null;
function genFloor(fl){
  for(let attempt=0;attempt<26;attempt++){
    map=new Uint8Array(MW*MH);seen=new Uint8Array(MW*MH);rooms=[];
    const target=clamp(6+(fl*.2|0),6,9);   // 部屋は少なく、その分ひとつを大きく
    let g=0;
    while(rooms.length<target&&g++<900){
      const w=ri(15,24),h=ri(15,24),x=ri(1,MW-w-2),y=ri(1,MH-h-2);
      let ok=true;
      for(const r of rooms)if(x<r.x+r.w+4&&x+w+4>r.x&&y<r.y+r.h+4&&y+h+4>r.y){ok=false;break;}
      if(!ok)continue;
      rooms.push({x,y,w,h,cx:x+(w>>1),cy:y+(h>>1)});
      for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)map[j*MW+i]=1;
    }
    if(rooms.length<3)continue;
    // 近い部屋どうしを繋ぐ。生成順のまま繋ぐと通路が異常に長くなる。
    const ord=[rooms[0]],rest=rooms.slice(1);
    while(rest.length){
      const cur=ord[ord.length-1];let bi=0,bd=1e9;
      for(let i=0;i<rest.length;i++){
        const d=Math.hypot(rest[i].cx-cur.cx,rest[i].cy-cur.cy);
        if(d<bd){bd=d;bi=i;}}
      ord.push(rest.splice(bi,1)[0]);}
    rooms=ord;
    const CW=4;                            // 通路幅
    for(let k=1;k<rooms.length;k++){
      const a=rooms[k-1],b=rooms[k];
      const x0=Math.min(a.cx,b.cx),x1=Math.max(a.cx,b.cx);
      const y0=Math.min(a.cy,b.cy),y1=Math.max(a.cy,b.cy);
      for(let i=x0;i<=x1;i++)for(let t=0;t<CW;t++)map[(a.cy+t)*MW+i]=1;
      for(let j=y0;j<=y1+CW;j++)for(let t=0;t<CW;t++)map[j*MW+b.cx+t]=1;
    }
    // 開始部屋から最も遠い部屋を階段にし、最低距離を満たすまで作り直す
    let best=1,bd=-1;
    for(let k=1;k<rooms.length;k++){
      const d=Math.hypot(rooms[k].cx-rooms[0].cx,rooms[k].cy-rooms[0].cy);
      if(d>bd){bd=d;best=k;}}
    if(bd>=CFG.STAIR_MIN||attempt>=25){rooms.stairIdx=best;return;}
  }
}
const solid=(x,y)=>x<0||y<0||x>=MW||y>=MH?true:map[y*MW+x]===0;
const walk=(x,y,r)=>!solid((x-r)|0,(y-r)|0)&&!solid((x+r)|0,(y-r)|0)&&
                    !solid((x-r)|0,(y+r)|0)&&!solid((x+r)|0,(y+r)|0);
function mv(e,dx,dy){if(walk(e.x+dx,e.y+dy,e.r)){e.x+=dx;e.y+=dy;return;}
  if(walk(e.x+dx,e.y,e.r))e.x+=dx;if(walk(e.x,e.y+dy,e.r))e.y+=dy;}

  const w=CFG.RARITY.map((r,i)=>Math.max(.0001,(r[1]+r[2]*fl)*(i>=2?bonus:1)));
  const t=w.reduce((a,b)=>a+b,0);let v=rnd()*t;
  for(let i=0;i<w.length;i++){v-=w[i];if(v<=0)return i;}return 0;}

/* ---------- 敵生成 ---------- */
const eSpeedMul=fl=>Math.min(CFG.E_SPEED_MAX,CFG.E_SPEED_BASE+CFG.E_SPEED_PER*(fl-1));
function spawnE(k,x,y,fl,elite){
  const t=ET[k],soft=(fl>=6&&fl<=10?.90:1),hs=(1+CFG.HP_SCALE*(fl-1))*soft,ds=(1+CFG.DMG_SCALE*(fl-1))*soft;

    ai:t.ai,rng:!!t.rng,keep:t.keep||0,slow:!!t.slow,boom:!!t.boom,heavy:!!t.heavy,
    hp:t.hp*hs,max:t.hp*hs,dmg:t.dmg*ds,hopT:rr(0,1),st:{},touch:t.touch||0,touchT:0,
    homing:!!t.homing,fuse:t.fuse||0,stKind:t.st||null,
    flash:0,kbx:0,kby:0,agro:false,frz:0,stun:0,elite:null,shield:0,regen:0,dot:0,dotT:0,wind:0};

function enterFloor(fl){
  S.floor=fl;S.deepest=Math.max(S.deepest,fl);
  if((fl-1)%CFG.SKIP_STEP===0)autoRefillPots();
  genFloor(fl);
  S.enemies.length=0;S.drops.length=0;S.bullets.length=0;S.parts.length=0;
  S.nums.length=0;S.props.length=0;S.fx.length=0;S.corpses.length=0;
  S.boss=null;S.combo=0;S.comboT=0;MMBG=null;mmSeen=-1;
  $("bossBar").style.display="none";
  const r0=rooms[0],rl=rooms[rooms.stairIdx];
  S.p.x=r0.cx+.5;S.p.y=r0.cy+.5;
  S.stairs={x:rl.cx+.5,y:rl.cy+.5,t:0};
  // 帰還ポータルはランダムな部屋に置く（入口＝帰還ではない）
  const cand=rooms.map((r,i)=>i).filter(i=>i!==0&&i!==rooms.stairIdx);
  const pr=rooms[cand.length?pick(cand):rooms.length-1];
  S.portal={x:pr.cx+rr(-3,3),y:pr.cy+rr(-3,3),t:0};

  const isBoss=fl%CFG.BOSS_EVERY===0;
  const n=Math.min(CFG.SPAWN_MAX,
    Math.round((CFG.SPAWN_BASE+CFG.SPAWN_PER_FLOOR*(fl-1))*(isBoss?.5:1)));
  const avail=EKEYS.filter(k=>k==="swarm"?fl>=2:k==="archer"?fl>=3:k==="stalker"?fl>=4:
    k==="brute"?fl>=5:k==="ticker"?fl>=6:k==="caster"?fl>=7:k==="seeker"?fl>=8:
    k==="bomber"?fl>=9:true);
  for(let i=0;i<n&&S.enemies.length<CFG.SPAWN_MAX;i++){
    const rm=rooms[ri(1,rooms.length-1)];
    const x=rr(rm.x+2,rm.x+rm.w-2),y=rr(rm.y+2,rm.y+rm.h-2);
    if(!walk(x,y,.4))continue;                     // 壁の中には湧かせない
    const el=rnd()<CFG.ELITE_CHANCE*(1+fl*.015);
    spawnE(pick(avail),x,y,fl,el);
    // 序盤は1体ずつ。群れは深度4から徐々に
    if(!el&&fl>=CFG.PACK_FROM&&rnd()<CFG.PACK_CHANCE*Math.min(1,(fl-CFG.PACK_FROM+1)/6)){
      const c=ri(2,3);
      for(let j=0;j<c&&S.enemies.length<CFG.SPAWN_MAX;j++){
        const px2=x+rr(-2,2),py2=y+rr(-2,2);
        if(walk(px2,py2,.4))spawnE(pick(avail),px2,py2,fl,false);}}
  }
  if(isBoss)spawnBoss(fl);
  for(let i=1;i<rooms.length;i++){
    const rm=rooms[i];
    for(let j=0;j<ri(1,3);j++)
      S.props.push({t:"barrel",x:rr(rm.x+2,rm.x+rm.w-2),y:rr(rm.y+2,rm.y+rm.h-2),hp:1});
    if(rnd()<CFG.CHEST_CHANCE)
      S.props.push({t:"chest",x:rm.cx+rr(-3,3),y:rm.cy+rr(-3,3),open:0});}
  if(rnd()<CFG.SHRINE_CHANCE){
    const bad=new Set([0,rooms.stairIdx,rooms.indexOf(pr)]);   // 階段/ポータルと同室にしない
    const ok=rooms.map((r,i)=>i).filter(i=>!bad.has(i));
    if(ok.length){const rm=rooms[pick(ok)];
      S.props.push({t:"shrine",x:rm.cx+.5,y:rm.cy+.5,used:0,s:pick(SHRINES),tm:0});}}
  toast("深度 "+fl+" — "+dangerOf(fl).n+(isBoss?" / ボス":""));}

function dangerOf(fl){
  const gap=fl-(S.base.lv*.55+1);
  if(gap<-3)return{i:0,n:"余裕",c:"#6bbf5a"};
  if(gap<0) return{i:1,n:"適正",c:"#c8c04a"};
  if(gap<2) return{i:2,n:"危険",c:"#e08830"};
  if(gap<4) return{i:3,n:"高危険",c:"#e0503a"};
  return      {i:4,n:"致命的",c:"#d040c0"};}
const enemyNear=(x,y,d)=>S.enemies.some(e=>d2(e.x,e.y,x,y)<d*d);

function dnum(x,y,v,c){if(S.nums.length>26)return;S.nums.push({x,y,v:Math.round(v),t:0,c});}
const PART_MAX=260;
function burst(x,y,col,n,pw){if(S.parts.length>PART_MAX)return;
  for(let i=0;i<n;i++){const a=rnd()*TAU,s=rr(1.2,4.4)*(pw||1);
    S.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:0,life:rr(.22,.5),col,sz:rr(1.6,3.4)});}}
const shk=v=>{S.shake=Math.max(S.shake,v);S.shakeT=.2;};
const hasPw=id=>S.p&&S.p.d.pw.includes(id);
function pDmg(base,mul){const p=S.p;
  let m=(mul||1)*p.mAtk*p.sAtk*p.buffAtk*p.d.atkMul;
  if(hasPw("berserk"))m*=1+(1-p.hp/p.max)*.8;
  return (rr(base[0],base[1])+p.d.atkFlat)*m;}
function hurtE(e,dmg,crit,kx,ky,quiet){
  if(e.hp<=0)return;
  if(e.shield>0){const a=Math.min(e.shield,dmg);e.shield-=a;dmg-=a;
    dnum(e.x,e.y,a,"#d8d040");if(dmg<=0){e.flash=CFG.FLASH_T;return;}}
  e.hp-=dmg;e.flash=CFG.FLASH_T;e.agro=true;
  S.dmgLog.push({t:S.runT,v:dmg});
  if(!e.boss&&!e.heavy){e.kbx+=(kx||0)*CFG.KNOCKBACK;e.kby+=(ky||0)*CFG.KNOCKBACK;}
  dnum(e.x,e.y,dmg,crit?"#ffd45e":"#fff0e2");
  if(!quiet){burst(e.x,e.y,crit?"#ffd86a":"#ff7a6a",crit?8:4,crit?1.4:1);
    if(crit){S.hitstop=Math.max(S.hitstop,CFG.HITSTOP_CRIT);shk(CFG.SHAKE_CRIT);SFX.crit();buzz(16);}
    else{S.hitstop=Math.max(S.hitstop,CFG.HITSTOP);shk(CFG.SHAKE_HIT);SFX.hit();buzz(5);}}
  const p=S.p,heal=dmg*(p.d.ls+p.mLs);
  if(heal>0)p.hp=Math.min(p.max,p.hp+heal);
  if(crit&&hasPw("vamp"))p.hp=Math.min(p.max,p.hp+p.max*.006);
  if(e.hp<=0)killE(e);}
function killE(e){
  const i=S.enemies.indexOf(e);if(i<0)return;

    if(e.elite.id==="blast")S.fx.push({t:"boom",x:e.x,y:e.y,tm:0,R:3,col:"#ff5040",dmg:e.dmg*2,en:1});}

  else{const dm=p.mDrop*p.sDrop*(hasPw("greed")?1.8:1)*(1+p.d.mf);
    if(rnd()<CFG.DROP_CHANCE*dm)dropItem(e.x,e.y);
    if(rnd()<CFG.GOLD_CHANCE)dropGold(e.x,e.y,Math.round((6+S.floor*3)*rr(.6,1.6)*(1+luk*.012)));
    if(rnd()<CFG.POTION_DROP)S.drops.push({x:e.x,y:e.y,pot:1,t:0});
    else if(rnd()<CFG.SHARD_DROP)S.drops.push({x:e.x,y:e.y,shard:1,t:0});}}
function dropItem(x,y,forceRar){
  const p=S.p;

function dropGold(x,y,v){S.drops.push({x,y,gold:v,t:0});}
function autoRefillPots(){if(S.pots<CFG.POTION_BASE){S.pots=CFG.POTION_BASE;toast("ポーション自動補充");}}
function barrelDrop(x,y){
  if(rnd()<CFG.POTION_POT_DROP){S.drops.push({x,y,pot:1,t:0});return;}
  if(rnd()<CFG.SHARD_DROP*.5){S.drops.push({x,y,shard:1,t:0});return;}
  if(rnd()<CFG.GOLD_CHANCE*.5)dropGold(x,y,Math.round((6+S.floor*3)*rr(.6,1.6)));
  if(rnd()<CFG.DROP_CHANCE*.5)dropItem(x,y);}
function breakPot(q){if(!q||q.t!=="barrel"||q.hp<=0)return false;
  q.hp=0;burst(q.x,q.y,"#8a6a3a",12,1.4);SFX.chest();barrelDrop(q.x,q.y);return true;}
function hitPotsCircle(x,y,r){let hit=false;for(const q of S.props)
  if(q.t==="barrel"&&q.hp>0&&d2(q.x,q.y,x,y)<r*r)hit=breakPot(q)||hit;return hit;}
function hitPotsCone(x,y,face,range,arc){let hit=false;for(const q of S.props){
  if(q.t!=="barrel"||q.hp<=0)continue;const d=Math.hypot(q.x-x,q.y-y);if(d>range+.35)continue;
  let a=Math.atan2(q.y-y,q.x-x)-face;while(a>Math.PI)a-=TAU;while(a<-Math.PI)a+=TAU;
  if(Math.abs(a)<=arc)hit=breakPot(q)||hit;}return hit;}
function gainXP(v){const b=S.base;
  if(b.lv>=CFG.LV_CAP){b.para++;return;}
  b.xp+=v;
  while(b.lv<CFG.LV_CAP&&b.xp>=xpNeed(b.lv)){
    b.xp-=xpNeed(b.lv);b.lv++;b.pts+=CFG.STAT_PER_LV;
    S.p.d=derive();recalcHP(S.p);SFX.lvl();save();}   // 即保存: 死んでもレベルは残る
  updHUD();}
function hurtP(dm,cause){const p=S.p;if(p.hurtT>0||p.invulT>0)return;
  if(rnd()<dodgeRate()){p.hurtT=.16;
    S.nums.push({x:p.x,y:p.y,v:0,txt:"回避",t:0,c:"#8ad8ff"});
    tone(900,.06,"sine",.06,1300);return;}
  const d=dm*(1-Math.min(.8,p.d.dr+p.mDr+p.sDr+p.buffDr+p.guardS*.2));
  p.hp-=d;p.hurtT=.42;S.flash=.18;shk(CFG.SHAKE_HURT);SFX.hurt();buzz(38);
  dnum(p.x,p.y,d,"#ff6060");
  if(hasPw("guard")){p.guardS=Math.min(3,p.guardS+1);p.guardT=2;}
  if(p.hp<=0){p.hp=0;endRun(false,cause||"敵の攻撃");}}

function basicAttack(){
  const p=S.p,C=p.d.C,range=C.range*p.mRange*p.d.rng;
  // 向いた方向の扇に敵がいればそいつを狙う。いなければその方向へ撃つ(引き撃ち防止)。
  const CONE=C.proj?.55:C.arc;
  let best=null,bd=1e9;
  for(const e of S.enemies){const d=d2(p.x,p.y,e.x,e.y);
    if(d>=(range+e.r)*(range+e.r))continue;
    let a=Math.atan2(e.y-p.y,e.x-p.x)-p.face;
    while(a>Math.PI)a-=TAU;while(a<-Math.PI)a+=TAU;
    if(Math.abs(a)>CONE)continue;
    if(d<bd){bd=d;best=e;}}
  if(best)p.face=Math.atan2(best.y-p.y,best.x-p.x);
  p.atkN++;
  const nextStep=S.cls==="warrior"?(p.comboT>0?(p.comboStep%3)+1:1):1;
  const crit=rnd()<(p.d.crit+p.mCrit);
  const cm=S.cls==="warrior"?[1,1.16,1.4][nextStep-1]:1;
  const mk=()=>{let v=pDmg(C.atk,CFG.ATK_MUL)*cm;if(crit)v*=(p.d.cdmg+p.mCdmg);return v;};
  if(C.proj){
    S.bullets.push({x:p.x,y:p.y,vx:Math.cos(p.face)*C.proj.sp,vy:Math.sin(p.face)*C.proj.sp,
      dmg:mk(),crit,mine:1,col:C.proj.col,r:C.proj.r,t:0,
      boom:(hasPw("burst")&&p.atkN%4===0)?1.6:0});
    SFX.cast(S.cls==="mage"?420:640);
  }else{
    const slashCol=["#fff0c8","#ffd06a","#ff8a3a"][nextStep-1]||"#fff0c8";let landed=false;
    S.fx.push({t:"slash",x:p.x,y:p.y,tm:0,R:range,a:p.face,arc:C.arc,step:nextStep,col:slashCol});
    for(const e of S.enemies.slice()){
      const d=Math.hypot(e.x-p.x,e.y-p.y);if(d>range+e.r)continue;
      let a=Math.atan2(e.y-p.y,e.x-p.x)-p.face;
      while(a>Math.PI)a-=TAU;while(a<-Math.PI)a+=TAU;
      if(Math.abs(a)>C.arc)continue;
      hurtE(e,mk(),crit,Math.cos(p.face),Math.sin(p.face));landed=true;}
    hitPotsCone(p.x,p.y,p.face,range,C.arc);
    if(landed&&S.cls==="warrior"){p.comboStep=nextStep;p.comboT=.78;}
    for(let i=0;i<6+nextStep*4;i++){const a=p.face+rr(-C.arc,C.arc);
      S.parts.push({x:p.x+Math.cos(a)*range*.7,y:p.y+Math.sin(a)*range*.7,
        vx:Math.cos(a)*(2+nextStep*.35),vy:Math.sin(a)*(2+nextStep*.35),t:0,
        life:.12+nextStep*.025,col:slashCol,sz:2+nextStep*.55});}
    shk(1.0+nextStep*.65);}
  if(hasPw("chainL")&&best&&best.hp>0){
    let n2=null,nd=1e9;
    for(const e of S.enemies){if(e===best)continue;const d=d2(best.x,best.y,e.x,e.y);
      if(d<nd&&d<9){nd=d;n2=e;}}
    if(n2){S.fx.push({t:"line",x:best.x,y:best.y,x2:n2.x,y2:n2.y,tm:0,col:"#a0d0ff"});
      hurtE(n2,pDmg(C.atk,CFG.ATK_MUL)*.4,false,0,0,true);}}
  return true;}

const ISO_K=2*Math.sqrt((CFG.TILE_W/2)*(CFG.TILE_H/2));
function s2w(sx,sy){
  const l=Math.hypot(sx,sy)||1,nx=sx/l,ny=sy/l;
  return {x:(nx/(CFG.TILE_W/2)+ny/(CFG.TILE_H/2))/2*ISO_K,
          y:(ny/(CFG.TILE_H/2)-nx/(CFG.TILE_W/2))/2*ISO_K,
          mag:Math.min(1,l)};}

function blinkForward(p,a,len){
  const steps=8,ox=p.x,oy=p.y;let nx=ox,ny=oy;
  for(let n=1;n<=steps;n++){const tx=ox+Math.cos(a)*len*n/steps,ty=oy+Math.sin(a)*len*n/steps;
    if(walk(tx,ty,p.r)){nx=tx;ny=ty;}else break;}
  p.x=nx;p.y=ny;
  S.parts.push({x:p.x,y:p.y,vx:-Math.cos(a)*1.8,vy:-Math.sin(a)*1.8,t:0,life:.22,col:"#8ad8ff",sz:4});}
function useSkill(i){
  const p=S.p,C=p.d.C,sk=C.skills[i];
  if(!sk||p.cds[i]>0||p.mp<sk.c)return;
  p.mp-=sk.c;p.cds[i]=sk.cd*p.mCd*(1-p.d.cdr);
  const mul=hasPw("multi")?1.3:1;
  let a=p.face;
  if(IN.dx||IN.dy){const w=s2w(IN.dx,IN.dy);a=Math.atan2(w.y,w.x);}
  else{let b=null,bd=1e9;for(const e of S.enemies){const d=d2(p.x,p.y,e.x,e.y);if(d<bd){bd=d;b=e;}}
    if(b)a=Math.atan2(b.y-p.y,b.x-p.x);}
  p.face=a;
  const dmg=()=>{const c=rnd()<(p.d.crit+p.mCrit);let v=pDmg(sk.dmg);
    if(c)v*=(p.d.cdmg+p.mCdmg);return[v,c];};
  switch(sk.k){
  case "cleave":{
    const R=sk.r*mul*p.mRange;let h=0;
    for(const e of S.enemies.slice()){
      const d=Math.hypot(e.x-p.x,e.y-p.y);if(d>R+e.r)continue;
      let ang=Math.atan2(e.y-p.y,e.x-p.x)-a;
      while(ang>Math.PI)ang-=TAU;while(ang<-Math.PI)ang+=TAU;
      if(Math.abs(ang)>sk.arc)continue;
      const[v,c]=dmg();hurtE(e,v,c,Math.cos(a),Math.sin(a),h++>0);}
    for(let i2=0;i2<12;i2++){const ang=a+rr(-sk.arc,sk.arc);
      S.parts.push({x:p.x+Math.cos(ang)*R*.75,y:p.y+Math.sin(ang)*R*.75,
        vx:Math.cos(ang)*4,vy:Math.sin(ang)*4,t:0,life:.16,col:"#ffd9a0",sz:3});}
    h+=hitPotsCone(p.x,p.y,a,R,sk.arc)?1:0;SFX.cast(300);if(h)shk(3.2);break;}
  case "dash":{
    p.dashT=.30;const spd=sk.len/.30;
    p.dashX=Math.cos(a)*spd;p.dashY=Math.sin(a)*spd;
    const hs=new Set();
    p.dashHit=()=>{for(const e of S.enemies.slice()){if(hs.has(e))continue;
      if(d2(p.x,p.y,e.x,e.y)<Math.pow(sk.w*mul+e.r,2)){hs.add(e);
        const[v,c]=dmg();hurtE(e,v,c,Math.cos(a),Math.sin(a));}}};
    const oldHit=p.dashHit;p.dashHit=()=>{oldHit();hitPotsCircle(p.x,p.y,sk.w*mul+.35);};
    SFX.cast(300);shk(3);break;}
  case "slam":{
    const R=sk.r*mul*p.mRange;
    for(const e of S.enemies.slice()){
      const d=Math.hypot(e.x-p.x,e.y-p.y);if(d>R+e.r)continue;
      const[v,c]=dmg();hurtE(e,v,c,(e.x-p.x)/(d||1)*2,(e.y-p.y)/(d||1)*2);
      if(e.hp>0)e.stun=Math.max(e.stun,sk.stun);}
    hitPotsCircle(p.x,p.y,R);S.fx.push({t:"ring",x:p.x,y:p.y,tm:0,R,col:"#ffa040"});
    SFX.nova();shk(10);buzz([0,50,40,60]);break;}
  case "ball":{
    S.bullets.push({x:p.x,y:p.y,vx:Math.cos(a)*sk.sp,vy:Math.sin(a)*sk.sp,
      dmg:dmg()[0],crit:false,mine:1,col:sk.col,r:.26,t:0,boom:sk.r*mul});
    SFX.cast(360);break;}
  case "nova":{
    if(sk.blink)blinkForward(p,a,sk.blink);
    const R=sk.r*mul*p.mRange;
    for(const e of S.enemies.slice()){
      const d=Math.hypot(e.x-p.x,e.y-p.y);if(d>R+e.r)continue;
      const[v,c]=dmg();hurtE(e,v,c,(e.x-p.x)/(d||1)*1.5,(e.y-p.y)/(d||1)*1.5);
      if(sk.freeze&&e.hp>0)applyST(e,"frz",sk.freeze,false);}
    hitPotsCircle(p.x,p.y,R);S.fx.push({t:"ring",x:p.x,y:p.y,tm:0,R,col:sk.col||"#9ad8ff"});
    SFX.nova();shk(6);buzz(26);break;}
  case "chain":{
    let cur=null,bd=1e9;
    for(const e of S.enemies){const d=d2(p.x,p.y,e.x,e.y);if(d<bd&&d<64){bd=d;cur=e;}}
    if(!cur){p.cds[i]=0;p.mp+=sk.c;return;}
    const hit=new Set();let fx=p.x,fy=p.y;
    for(let j=0;j<Math.round(sk.jumps*mul)&&cur;j++){
      hit.add(cur);const[v,c]=dmg();
      S.fx.push({t:"line",x:fx,y:fy,x2:cur.x,y2:cur.y,tm:0,col:"#a0d0ff"});
      fx=cur.x;fy=cur.y;
      hurtE(cur,v*Math.pow(.85,j),c,0,0,j>0);
      let nx=null,nd=1e9;
      for(const e of S.enemies){if(hit.has(e))continue;const d=d2(fx,fy,e.x,e.y);
        if(d<nd&&d<sk.range*sk.range){nd=d;nx=e;}}
      cur=nx;}
    SFX.cast(880);shk(4);break;}}
  updHUD();}
function usePotion(){const p=S.p;
  if(S.pots<=0||p.hp>=p.max)return;
  S.pots--;p.hp=Math.min(p.max,p.hp+p.max*CFG.POTION_HEAL);
  SFX.pot();buzz(18);burst(p.x,p.y,"#ff5060",12,1.2);updHUD();}

/* ---------- 更新 ---------- */
function update(dt){
  if(S.paused||!S.p)return;
  if(S.hitstop>0){S.hitstop-=dt;return;}
  const p=S.p;
  S.runT+=dt;
  if(S.shakeT>0){S.shakeT-=dt;if(S.shakeT<=0)S.shake=0;}
  if(S.flash>0)S.flash-=dt;
  if(p.hurtT>0)p.hurtT-=dt;
  if(p.invulT>0)p.invulT-=dt;
  if(p.buffT>0){p.buffT-=dt;if(p.buffT<=0){p.buffAtk=1;p.buffDr=0;}}
  if(p.guardT>0){p.guardT-=dt;if(p.guardT<=0)p.guardS=0;}
  if(p.comboT>0){p.comboT-=dt;if(p.comboT<=0)p.comboStep=0;}
  if(p.shrineT>0){p.shrineT-=dt;
    if(p.shrineT<=0){p.sAtk=1;p.sDr=0;p.sMs=1;p.sAs=1;p.sDrop=1;p.shrine=null;updBuffs();}}
  p.st=p.st||{};tickST(p,dt,true);if(p.hp<=0)return;
  p.mp=clamp(p.mp+p.d.mpReg*dt,0,p.d.mpMax);

  if(p.dashT>0){p.dashT-=dt;mv(p,p.dashX*dt,p.dashY*dt);
    if(p.dashHit)p.dashHit();
    S.parts.push({x:p.x,y:p.y,vx:rr(-.3,.3),vy:rr(-.3,.3),t:0,life:.2,col:"#cfe6ff",sz:2.2});
    if(p.dashT<=0){p.dashT=0;p.invulT=.18;p.dashHit=null;}}
  else if((IN.dx||IN.dy)&&!stActive(p,"frz")){
    const w=s2w(IN.dx,IN.dy),
      sp=CFG.P_SPEED*p.d.ms*p.mMs*p.sMs*w.mag*(stActive(p,"par")?.55:1);
    mv(p,w.x*sp*dt,w.y*sp*dt);
    const fl=Math.hypot(w.x,w.y)||1;p.face=Math.atan2(w.y/fl,w.x/fl);}

  const tx=p.x|0,ty=p.y|0;
  for(let j=-6;j<=6;j++)for(let i=-6;i<=6;i++){
    const X=tx+i,Y=ty+j;if(X<0||Y<0||X>=MW||Y>=MH)continue;
    if(i*i+j*j<=36)seen[Y*MW+X]=1;}

  p.cd-=dt;
  if(p.cd<=0&&HELD[0]){if(basicAttack())p.cd=CFG.ATK_CD/(p.d.as*p.mAs*p.sAs);else p.cd=.04;}
  for(let i=0;i<3;i++)p.cds[i]=Math.max(0,p.cds[i]-dt);
  for(let i=1;i<=3;i++)if(HELD[i])useSkill(i-1);

  const esp=eSpeedMul(S.floor);
  for(const e of S.enemies){
    if(e.flash>0)e.flash-=dt;
    if(e.dotT>0){e.dotT-=dt;e.hp-=e.dot*dt;if(e.hp<=0){killE(e);continue;}}
    tickST(e,dt,false);if(e.hp<=0)continue;
    if(e.frz>0||stActive(e,"frz")){e.frz=Math.max(0,e.frz-dt);continue;}
    if(e.stun>0){e.stun-=dt;continue;}
    const slowMul=stActive(e,"par")?.5:1;
    if(e.regen)e.hp=Math.min(e.max,e.hp+e.regen*dt);
    e.x+=e.kbx;e.y+=e.kby;e.kbx*=.78;e.kby*=.78;
    if(!walk(e.x,e.y,e.r)){e.x-=e.kbx;e.y-=e.kby;e.kbx=e.kby=0;}
    const d=Math.hypot(p.x-e.x,p.y-e.y);
    if(!e.agro&&d<11)e.agro=true;
    if(!e.agro)continue;
    const ux=(p.x-e.x)/(d||1),uy=(p.y-e.y)/(d||1);
    let sx=0,sy=0;
    for(const o of S.enemies){if(o===e)continue;const dd=d2(e.x,e.y,o.x,o.y);
      if(dd<.8&&dd>.0001){const l=Math.sqrt(dd);sx+=(e.x-o.x)/l;sy+=(e.y-o.y)/l;}}
    if(e.boss){bossAI(e,d,ux,uy,dt);continue;}
    if(e.wind>0){
      e.wind-=dt;
      if(e.wind<=0){
        if(e.boom){S.fx.push({t:"boom",x:e.x,y:e.y,tm:0,R:2.4,col:"#ffd040",dmg:e.dmg,en:1});killE(e);}
        else if(e.rng){S.bullets.push({x:e.x,y:e.y,vx:ux*(e.homing?5.5:8),vy:uy*(e.homing?5.5:8),
          dmg:e.dmg,t:0,col:e.homing?"#e07aa0":e.slow?"#3fa08a":"#c89aff",r:.2,
          slow:e.slow?1:0,homing:e.homing?1:0,st:e.stKind});tone(340,.08,"square",.06,180);}
        else if(d<e.aR+p.r+.4)hurtP(e.dmg,e.n+"の攻撃");}
      continue;}
    let mx=0,my=0;
    if(e.ai==="tick"){
      if(d<3.4){e.fuseT=(e.fuseT==null?3:e.fuseT-dt);
        if(e.fuseT<=0){S.fx.push({t:"boom",x:e.x,y:e.y,tm:0,R:3.4,col:"#c0d040",dmg:e.dmg,en:1});killE(e);continue;}
        if(rnd()<dt*12)S.parts.push({x:e.x+rr(-.3,.3),y:e.y+rr(-.3,.3),vx:rr(-.4,.4),vy:rr(-.4,.4),t:0,life:.35,col:"#d8e060",sz:2.5});}
      else if(e.fuseT==null){mx=ux;my=uy;}
    }
    else if(e.ai==="kite"){if(d>e.keep){mx=ux;my=uy;}else if(d<e.keep*.7){mx=-ux;my=-uy;}}
    else if(e.ai==="hop"){                      // 跳ね虫: 断続的に飛び込む
      e.hopT-=dt;
      if(e.hopT<=0){e.hopT=rr(.7,1.3);e.kbx=ux*.24;e.kby=uy*.24;}
      if(d>e.aR*.9){mx=ux*.35;my=uy*.35;}}
    else if(d>e.aR*.85){mx=ux;my=uy;}
    if(e.ai==="lunge"){e.hopT-=dt;     // 影走り: 溜めてから踏み込む
      if(e.hopT<=0&&d<6){e.hopT=rr(1.4,2.2);e.kbx=ux*.5;e.kby=uy*.5;}
      mx*=.5;my*=.5;}
    mv(e,(mx+sx*.5)*e.sp*esp*slowMul*dt,(my+sy*.5)*e.sp*esp*slowMul*dt);
    if(e.touch&&d<e.r+p.r+.15){e.touchT-=dt;    // 接触ダメージ(スキル動作中は無敵)
      if(e.touchT<=0){e.touchT=e.touch;if(p.dashT<=0)hurtP(e.dmg*.75,e.n+"との接触");}}
    if(e.elite&&e.elite.id==="fire"&&rnd()<dt*2.5)
      S.fx.push({t:"pool",x:e.x,y:e.y,tm:0,dur:2.4,R:.9,col:"#ff7a3a",dmg:e.dmg*.5,en:1,tick:0});
    e.cdT-=dt;
    if(d<e.aR+p.r&&e.cdT<=0){e.cdT=e.cd;e.wind=CFG.WIND*(e.heavy?1.5:1);
      tone(e.rng?520:260,.09,"square",.05,e.rng?700:180);}}

  /* 弾: 細かく刻んで壁抜けを防ぐ */
  for(let i=S.bullets.length-1;i>=0;i--){
    const b=S.bullets[i];b.t+=dt;
    if(b.homing&&b.t<1.8){const dx=p.x-b.x,dy=p.y-b.y,l=Math.hypot(dx,dy)||1,s0=Math.hypot(b.vx,b.vy);
      b.vx=lerp(b.vx,dx/l*s0,.045);b.vy=lerp(b.vy,dy/l*s0,.045);}
    let dead=b.t>2.8;
    const steps=Math.max(1,Math.ceil(Math.hypot(b.vx,b.vy)*dt/.35));
    for(let st=0;st<steps&&!dead;st++){
      b.x+=b.vx*dt/steps;b.y+=b.vy*dt/steps;
      if(solid(b.x|0,b.y|0)){dead=true;break;}
      if(b.mine){
        for(const q of S.props)if(q.t==="barrel"&&q.hp>0&&d2(b.x,b.y,q.x,q.y)<.36){
          breakPot(q);if(b.boom)S.fx.push({t:"boom",x:b.x,y:b.y,tm:0,R:b.boom,col:b.col,dmg:b.dmg*.7,hit:new Set()});dead=true;break;}
        if(dead)break;
        for(const e of S.enemies)if(d2(b.x,b.y,e.x,e.y)<Math.pow(.28+e.r,2)){
          if(b.boom)S.fx.push({t:"boom",x:b.x,y:b.y,tm:0,R:b.boom,col:b.col,dmg:b.dmg*.7,hit:new Set()});
          hurtE(e,b.dmg,b.crit,b.vx*.02,b.vy*.02);dead=true;break;}
      }else if(d2(b.x,b.y,p.x,p.y)<.16){
        hurtP(b.dmg,b.homing?"追尾弾":"敵の投射攻撃");
        if(b.slow){p.sMs=.65;p.shrineT=Math.max(p.shrineT,2);updBuffs();}
        if(b.st)applyST(p,b.st,2.2,true);
        dead=true;}}
    if(dead)S.bullets.splice(i,1);}

  for(let i=S.fx.length-1;i>=0;i--){
    const f=S.fx[i];const first=f.tm===0;f.tm+=dt;
    if(f.t==="boom"){
      if(first){burst(f.x,f.y,f.col,18,2);
        if(f.en){if(d2(f.x,f.y,p.x,p.y)<f.R*f.R)hurtP(f.dmg,"爆発");}
        else {hitPotsCircle(f.x,f.y,f.R);for(const e of S.enemies.slice()){
          if(f.hit&&f.hit.has(e))continue;
          if(d2(f.x,f.y,e.x,e.y)<Math.pow(f.R+e.r,2)){if(f.hit)f.hit.add(e);
            hurtE(e,f.dmg,false,0,0,true);}}}}
      if(f.tm>.34)S.fx.splice(i,1);}
    else if(f.t==="pool"){f.tick-=dt;
      if(f.tick<=0){f.tick=.4;if(d2(f.x,f.y,p.x,p.y)<f.R*f.R){hurtP(f.dmg*.4,"炎上した地面");applyST(p,"brn",2.5,true);}}
      if(f.tm>f.dur)S.fx.splice(i,1);}
    else if(f.tm>(f.t==="line"?.16:f.t==="slash"?.22:.42))S.fx.splice(i,1);}

  for(let i=S.drops.length-1;i>=0;i--){
    const d=S.drops[i];d.t+=dt;
    const pr=d.gold?1.6:(d.pot||d.shard)?1.0:.65;
    if(d2(d.x,d.y,p.x,p.y)<pr*pr){
      if(d.shard){if(p.hp>=p.max)continue;
        p.hp=Math.min(p.max,p.hp+p.max*CFG.SHARD_HEAL);
        burst(p.x,p.y,"#6ae0a0",6,1);tone(760,.07,"sine",.08,1040);}
      else if(d.gold){S.gold+=d.gold;SFX.gold();}
      else if(d.pot){if(S.pots>=CFG.POTION_MAX)continue;S.pots++;SFX.pot();}
      else{S.bag.push(d.it);SFX.gold();}
      S.drops.splice(i,1);}}
  for(const q of S.props)if(q.t==="shrine")q.tm+=dt;

  for(let i=S.parts.length-1;i>=0;i--){const q=S.parts[i];q.t+=dt;
    if(q.t>=q.life){S.parts.splice(i,1);continue;}
    q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.9;q.vy*=.9;}
  for(let i=S.nums.length-1;i>=0;i--){S.nums[i].t+=dt;if(S.nums[i].t>.8)S.nums.splice(i,1);}
  for(let i=S.corpses.length-1;i>=0;i--){S.corpses[i].t+=dt;if(S.corpses[i].t>4)S.corpses.splice(i,1);}
  if(S.comboT>0){S.comboT-=dt;if(S.comboT<=0)S.combo=0;}
  while(S.dmgLog.length&&S.dmgLog[0].t<S.runT-5)S.dmgLog.shift();
  S.dps=Math.round(S.dmgLog.reduce((a,x)=>a+x.v,0)/5);
  S.portal.t+=dt;S.stairs.t+=dt;
  updAction();updHUD();}

function bossAI(e,d,ux,uy,dt){
  const p=S.p;
  if(e.phase===1&&e.hp<e.max*.5){e.phase=2;e.sp*=1.15;e.cd*=.8;toast("ボスが激昂した");shk(9);SFX.boss();}
  if(e.tel>0){e.tel-=dt;
    if(e.tel<=0){
      if(e.telK==="charge")S.fx.push({t:"boom",x:e.x+Math.cos(e.telA)*2.8,y:e.y+Math.sin(e.telA)*2.8,
        tm:0,R:2.4,col:e.col,dmg:e.dmg*1.4,en:1});
      else S.fx.push({t:"boom",x:e.telX,y:e.telY,tm:0,R:3.6,col:e.col,dmg:e.dmg*1.8,en:1});
      shk(9);}
    return;}
  e.cdT-=dt;e.sumT-=dt;
  if(e.sumT<=0){e.sumT=(e.phase===2?9:14)*(e.telMul||1);
    for(let i=0;i<(e.phase===2?4:2);i++)
      spawnE(rnd()<.5?"grunt":"swarm",e.x+rr(-3,3),e.y+rr(-3,3),S.floor,false);
    toast("増援");}
  if(e.cdT<=0){e.cdT=e.cd;
    const tm=e.telMul||1;
    if(d>5){e.tel=.75*tm;e.telK="charge";e.telA=Math.atan2(uy,ux);}
    else{e.tel=.85*tm;e.telK="slam";e.telX=p.x;e.telY=p.y;}
    tone(140,.3,"sawtooth",.12,90);return;}
  if(d<e.aR+p.r){e.touch-=dt;if(e.touch<=0){e.touch=1.2*(e.telMul||1);hurtP(e.dmg*.3,e.n+"の攻撃");}}
  if(d>e.aR*.9)mv(e,ux*e.sp*eSpeedMul(S.floor)*dt,uy*e.sp*eSpeedMul(S.floor)*dt);}

/* ---------- 行動ボタン ---------- */
function updAction(){
  const p=S.p,a=$("act");
  const onS=d2(p.x,p.y,S.stairs.x,S.stairs.y)<1.4;
  const onP=d2(p.x,p.y,S.portal.x,S.portal.y)<1.4;
  let sh=null,ch=null;
  for(const q of S.props){
    if(q.t==="shrine"&&!q.used&&d2(q.x,q.y,p.x,p.y)<1.6)sh=q;
    if(q.t==="chest"&&!q.open&&d2(q.x,q.y,p.x,p.y)<1.6)ch=q;}
  const clear=!enemyNear(p.x,p.y,CFG.EXIT_CLEAR);
  if(sh){a.style.display="block";a.className="use";a.textContent=sh.s.n+" — "+sh.s.d;a.dataset.a="shrine";}
  else if(ch){a.style.display="block";a.className="use";a.textContent="宝箱を開ける";a.dataset.a="chest";}
  else if(onS){a.style.display="block";
    if(S.boss){a.className="no";a.textContent="ボスを倒せ";a.dataset.a="";}
    else if(!clear){a.className="no";a.textContent="周囲に敵がいる（10m以内）";a.dataset.a="";}
    else{a.className="down";a.textContent="深度 "+(S.floor+1)+" へ — "+dangerOf(S.floor+1).n;a.dataset.a="down";}}
  else if(onP){a.style.display="block";
    if(!clear){a.className="no";a.textContent="周囲に敵がいる（10m以内）";a.dataset.a="";}
    else{a.className="up";a.textContent="拠点へ帰還 ("+S.bag.length+"個)";a.dataset.a="up";}}
  else a.style.display="none";}
function doAction(){
  const a=$("act").dataset.a,p=S.p;
  if(!a)return;
  if(a==="down"){ask("深度 "+(S.floor+1)+" へ進む",
    "危険度: "+dangerOf(S.floor+1).n,()=>enterFloor(S.floor+1));}
  else if(a==="up"){ask("拠点へ帰還する",
    S.bag.length+"個を持ち帰る（ここで確定します）",()=>endRun(true));}
  else if(a==="shrine"){
    for(const q of S.props)if(q.t==="shrine"&&!q.used&&d2(q.x,q.y,p.x,p.y)<1.6){
      const rate=shrineRate(q.s);
      ask(q.s.n+" に触れる",`${q.s.d}\n成功率 ${Math.round(rate*100)}%（運 ${p.d.luk}）\n失敗すると逆の効果`,
        ()=>{q.used=1;p.shrine=q.s;p.shrineT=q.s.dur;
          if(rnd()<rate){q.s.f(p);SFX.shrine();buzz([0,30,40,30]);toast("成功: "+q.s.n);
            S.fx.push({t:"ring",x:q.x,y:q.y,tm:0,R:3,col:"#ffe090"});}
          else{q.s.bad(p);SFX.ng();buzz(90);
            S.fx.push({t:"ring",x:q.x,y:q.y,tm:0,R:3,col:"#d05a54"});}
          updBuffs();});
      break;}}
  else if(a==="chest"){
    for(const q of S.props)if(q.t==="chest"&&!q.open&&d2(q.x,q.y,p.x,p.y)<1.6){openLock(q);break;}}
  $("act").style.display="none";}

let LK=null;
function chestRarity(){
  const early=S.floor<4,roll=rnd(),mf=S.p.d.mf+S.p.mDrop+S.p.sDrop-2;
  const bonus=clamp(mf*.04,0,.10);
  if(early)return roll<.72?0:roll<.94?1:2;
  if(roll<.50-bonus)return 0;
  if(roll<.82-bonus*.5)return 1;
  if(roll<.95)return 2;
  return roll<.992?3:4;}
function nextLockTarget(){
  const rar=LK.rar,round=LK.round,luk=S.p.d.luk;
  LK.center=rr(.18,.82);
  const earlyEase=clamp((6-S.floor)*.025,0,.12);
  LK.zone=clamp(.30+earlyEase+luk*.006-rar*.035-round*.045,.09,.50);
  LK.speed=.62+S.floor*.012+rar*.18+round*.22+rnd()*.28;}
function openLock(q){
  S.paused=true;for(let i=0;i<4;i++)HELD[i]=false;
  const luk=S.p.d.luk,rar=q.rar??chestRarity();q.rar=rar;
  LK={q,rar,round:0,ok:0,pos:rnd(),dir:rnd()<.5?1:-1,center:.5,zone:.3,speed:.8,done:false};
  nextLockTarget();
  $("lockD").textContent=`中身 ${CFG.RARITY[rar][0]} / 運 ${luk} — 成功数で中身は変わらない。判定位置は毎回変化し、3回目ほど難しい`;
  renderLock();$("lockPop").classList.add("on");}
function renderLock(){
  const z=$("lockZone"),w=LK.zone*100;
  z.style.left=((LK.center-LK.zone/2)*100)+"%";z.style.width=w+"%";
  $("lockPin").style.left=(LK.pos*100)+"%";
  const ps=$("lockPips");ps.innerHTML="";
  for(let i=0;i<3;i++){const d=document.createElement("div");
    d.className="pip"+(i<LK.round?(LK.res&&LK.res[i]?" ok":" ng"):"");ps.appendChild(d);}}
function lockTick(dt){
  if(!LK||LK.done)return;
  LK.pos+=LK.dir*LK.speed*dt;
  if(LK.pos>1){LK.pos=1;LK.dir=-1;}if(LK.pos<0){LK.pos=0;LK.dir=1;}
  $("lockPin").style.left=(LK.pos*100)+"%";}
function lockHit(){
  if(!LK||LK.done)return;
  LK.res=LK.res||[];
  const hit=Math.abs(LK.pos-LK.center)<LK.zone/2;
  LK.res[LK.round]=hit;if(hit){LK.ok++;SFX.ok();buzz(20);}else{SFX.ng();buzz(60);}
  LK.round++;if(LK.round<3)nextLockTarget();
  renderLock();
  if(LK.round>=3){
    LK.done=true;
    setTimeout(()=>{
      $("lockPop").classList.remove("on");
      const q=LK.q;q.open=1;S.paused=false;
      SFX.chest();
      dropItem(q.x+rr(-1,1),q.y+rr(-1,1),LK.rar);
      dropGold(q.x,q.y,Math.round((35+S.floor*15)*(1+LK.rar*.35)));
      toast(`${CFG.RARITY[LK.rar][0]}の宝箱 ${LK.ok}/3`);
      LK=null;},520);}}

function tileSprites(){
  if(TSPR)return TSPR;
  const HW=CFG.TILE_W/2,HH=CFG.TILE_H/2,WH=28;
  const mk=(w,h,ox,oy,fn)=>{const c=document.createElement("canvas");
    c.width=Math.ceil(w*DPR);c.height=Math.ceil(h*DPR);
    c._w=w;c._h=h;c._ox=ox;c._oy=oy;
    const g=c.getContext("2d");g.setTransform(DPR,0,0,DPR,0,0);fn(g,ox,oy);return c;};
  const floors=[];
  for(let v=0;v<5;v++){const b=v*3;
    floors.push(mk(CFG.TILE_W+2,CFG.TILE_H+2,HW+1,HH+1,(g,ox,oy)=>{
      const fg=g.createLinearGradient(ox-HW,oy-HH,ox+HW,oy+HH);
      fg.addColorStop(0,`rgb(${35+b},${32+b},${42+b})`);fg.addColorStop(.55,`rgb(${24+b},${23+b},${31+b})`);
      fg.addColorStop(1,`rgb(${16+b},${16+b},${22+b})`);g.fillStyle=fg;
      g.beginPath();g.moveTo(ox,oy-HH);g.lineTo(ox+HW,oy);
      g.lineTo(ox,oy+HH);g.lineTo(ox-HW,oy);g.closePath();g.fill();
      g.strokeStyle="rgba(0,0,0,.5)";g.lineWidth=1;g.stroke();
      g.strokeStyle="rgba(150,135,170,.10)";g.lineWidth=.7;g.beginPath();
      g.moveTo(ox-HW*.62,oy+HH*.12);g.lineTo(ox-HW*.18,oy-HH*.08);g.lineTo(ox+HW*.18,oy+HH*.16);
      if(v%2){g.moveTo(ox+HW*.12,oy-HH*.52);g.lineTo(ox+HW*.3,oy-HH*.12);g.lineTo(ox+HW*.58,oy);}g.stroke();
      g.fillStyle="rgba(205,190,220,.08)";for(let i=0;i<4;i++)g.fillRect(ox-HW*.7+((i*17+v*11)%36),oy-HH*.55+((i*7+v*5)%12),1,1);}));}
  const wall=mk(CFG.TILE_W+2,CFG.TILE_H+WH+2,HW+1,HH+WH+1,(g,ox,oy)=>{
    g.fillStyle="#101015";
    g.beginPath();g.moveTo(ox-HW,oy);g.lineTo(ox,oy+HH);
    g.lineTo(ox,oy+HH-WH);g.lineTo(ox-HW,oy-WH);g.closePath();g.fill();
    g.fillStyle="#0b0b0f";
    g.beginPath();g.moveTo(ox+HW,oy);g.lineTo(ox,oy+HH);
    g.lineTo(ox,oy+HH-WH);g.lineTo(ox+HW,oy-WH);g.closePath();g.fill();
    g.fillStyle="#1d1d26";
    g.beginPath();g.moveTo(ox,oy-HH-WH);g.lineTo(ox+HW,oy-WH);
    g.lineTo(ox,oy+HH-WH);g.lineTo(ox-HW,oy-WH);g.closePath();g.fill();
    g.strokeStyle="rgba(150,150,190,.22)";g.lineWidth=1;g.stroke();
    g.strokeStyle="rgba(120,110,140,.18)";g.lineWidth=.8;
    for(let y=oy-WH+6;y<oy;y+=7){g.beginPath();g.moveTo(ox-HW+(y%14?5:0),y);g.lineTo(ox+HW-(y%14?5:0),y);g.stroke();}
    g.strokeStyle="rgba(220,205,235,.12)";g.beginPath();g.moveTo(ox-HW*.8,oy-WH-2);g.lineTo(ox,oy-HH-WH+3);g.stroke();});
  TSPR={floors,wall};return TSPR;}
const blit=(c,sx,sy)=>ctx.drawImage(c,0,0,c.width,c.height,sx-c._ox,sy-c._oy,c._w,c._h);
function eShape(g,k,sx,sy,h,w,body,rim){
  g.fillStyle=body;g.strokeStyle=rim;g.lineWidth=1.7;g.beginPath();
  if(k==="swarm"){
    g.ellipse(sx,sy-h*.42,w*1.05,h*.44,0,0,TAU);
    for(let i=-1;i<=1;i++){g.moveTo(sx+i*w*.6,sy-h*.2);g.lineTo(sx+i*w*.95,sy+1);}
    g.fill();g.stroke();return;}
  if(k==="brute"){
    g.moveTo(sx,sy-h);g.lineTo(sx+w*1.35,sy-h*.74);g.lineTo(sx+w*1.05,sy-h*.12);
    g.lineTo(sx+w*.55,sy+2);g.lineTo(sx-w*.55,sy+2);
    g.lineTo(sx-w*1.05,sy-h*.12);g.lineTo(sx-w*1.35,sy-h*.74);
    g.closePath();g.fill();g.stroke();return;}
  if(k==="caster"){
    g.moveTo(sx,sy-h*1.12);g.quadraticCurveTo(sx+w,sy-h*.3,sx+w*.7,sy+2);
    g.lineTo(sx-w*.7,sy+2);g.quadraticCurveTo(sx-w,sy-h*.3,sx,sy-h*1.12);
    g.moveTo(sx+w*1.1,sy+1);g.lineTo(sx+w*.8,sy-h);
    g.closePath();g.fill();g.stroke();return;}
  if(k==="archer"){
    g.ellipse(sx,sy-h*.5,w*.66,h*.52,0,0,TAU);
    g.moveTo(sx+w+h*.42,sy-h*.5);g.arc(sx+w,sy-h*.5,h*.42,-1.1,1.1);
    g.fill();g.stroke();return;}
  if(k==="bomber"){
    g.arc(sx,sy-h*.5,w,0,TAU);
    g.moveTo(sx,sy-h);g.quadraticCurveTo(sx+w*.7,sy-h*1.3,sx+w*.3,sy-h*1.5);
    g.fill();g.stroke();return;}
  if(k==="boss"){
    g.moveTo(sx,sy-h);g.quadraticCurveTo(sx+w*1.25,sy-h*.7,sx+w*.9,sy+2);
    g.lineTo(sx-w*.9,sy+2);g.quadraticCurveTo(sx-w*1.25,sy-h*.7,sx,sy-h);
    g.moveTo(sx-w*.55,sy-h*.92);g.lineTo(sx-w*1.15,sy-h*1.3);
    g.moveTo(sx+w*.55,sy-h*.92);g.lineTo(sx+w*1.15,sy-h*1.3);
    g.closePath();g.fill();g.stroke();return;}
  g.moveTo(sx,sy-h);
  g.quadraticCurveTo(sx+w,sy-h*.72,sx+w*.78,sy-h*.16);
  g.quadraticCurveTo(sx+w*.5,sy+2,sx,sy+2);
  g.quadraticCurveTo(sx-w*.5,sy+2,sx-w*.78,sy-h*.16);
  g.quadraticCurveTo(sx-w,sy-h*.72,sx,sy-h);
  g.moveTo(sx-w*.42,sy-h*.9);g.lineTo(sx-w*.72,sy-h*1.2);
  g.moveTo(sx+w*.42,sy-h*.9);g.lineTo(sx+w*.72,sy-h*1.2);
  g.closePath();g.fill();g.stroke();}
function enemySprite(k,h,w,body,rim){
  const hi=Math.round(h),wi=Math.round(w),key=k+"|"+hi+"|"+wi+"|"+body+"|"+rim;
  let c=SPR.get(key);if(c)return c;
  const W=Math.ceil(wi*3.4)+14,H=Math.ceil(hi*1.75)+16;
  c=document.createElement("canvas");
  c.width=Math.ceil(W*DPR);c.height=Math.ceil(H*DPR);
  c._w=W;c._h=H;c._ox=W/2;c._oy=H-8;
  const g=c.getContext("2d");g.setTransform(DPR,0,0,DPR,0,0);
  eShape(g,k,c._ox,c._oy,hi,wi,body,rim);
  if(SPR.size>500)SPR.clear();
  SPR.set(key,c);return c;}

function draw(){
  const p=S.p;if(!p||!map)return;
  const c=iso(p.x,p.y);
  camX=lerp(camX,c.sx,CFG.CAM_LERP);camY=lerp(camY,c.sy,CFG.CAM_LERP);
  let ox=VW/2-camX,oy=VH*CFG.CAM_Y-camY;
  if(S.shake>0&&S.settings.shake){ox+=rr(-S.shake,S.shake);oy+=rr(-S.shake,S.shake);}
  ctx.fillStyle="#07070a";ctx.fillRect(0,0,VW,VH);
  ctx.save();ctx.translate(ox,oy);
  const HW=CFG.TILE_W/2,HH=CFG.TILE_H/2,TS=tileSprites(),RG=24;
  const mnX=Math.max(0,(p.x-RG)|0),mxX=Math.min(MW-1,(p.x+RG)|0);
  const mnY=Math.max(0,(p.y-RG)|0),mxY=Math.min(MH-1,(p.y+RG)|0);
  const visXY=(wx,wy)=>{const sx=(wx-wy)*HW+ox,sy=(wx+wy)*HH+oy;
    return !(sx<-80||sx>VW+80||sy<-100||sy>VH+80);};
  for(let y=mnY;y<=mxY;y++)for(let x=mnX;x<=mxX;x++){

    if(sx+ox<-80||sx+ox>VW+80||sy+oy<-100||sy+oy>VH+80)continue;
    blit(TS.floors[(x*7+y*13)%5],sx,sy);}
  for(const q of S.corpses){
    const sx=(q.x-q.y)*HW,sy=(q.x+q.y)*HH;
    if(sx+ox<-40||sx+ox>VW+40||sy+oy<-40||sy+oy>VH+40)continue;
    ctx.globalAlpha=Math.max(0,.3*(1-q.t/4));ctx.fillStyle=darken(q.col,.5);
    ctx.beginPath();ctx.ellipse(sx,sy,8*q.sz,3.6*q.sz,0,0,TAU);ctx.fill();}
  ctx.globalAlpha=1;
  const L=[];
  for(let y=mnY;y<=mxY;y++)for(let x=mnX;x<=mxX;x++)if(map[y*MW+x]===0){
    if(!(map[y*MW+x+1]||map[y*MW+x-1]||map[(y+1)*MW+x]||map[(y-1)*MW+x]))continue;
    const sx=(x-y)*HW,sy=(x+y)*HH;
    if(sx+ox<-80||sx+ox>VW+80||sy+oy<-110||sy+oy>VH+80)continue;

  L.push({d:S.portal.x+S.portal.y,t:"portal"});
  L.push({d:S.stairs.x+S.stairs.y,t:"stairs"});
  for(const q of S.props)if(visXY(q.x,q.y))L.push({d:q.x+q.y,t:"prop",o:q});
  for(const q of S.fx)if(visXY(q.x,q.y))L.push({d:q.y*2,t:"fx",o:q});
  for(const q of S.drops)if(visXY(q.x,q.y))L.push({d:q.x+q.y,t:"drop",o:q});
  for(const q of S.enemies)if(visXY(q.x,q.y))L.push({d:q.x+q.y,t:"e",o:q});
  L.push({d:p.x+p.y,t:"p"});
  for(const q of S.bullets)if(visXY(q.x,q.y))L.push({d:q.x+q.y,t:"b",o:q});
  L.sort((a,b)=>a.d-b.d);
  for(const n of L){
    if(n.t==="w")blit(TS.wall,(n.x-n.y)*HW,(n.x+n.y)*HH);
    else if(n.t==="portal")dPortal();
    else if(n.t==="stairs")dStairs();
    else if(n.t==="prop")dProp(n.o);
    else if(n.t==="fx")dFx(n.o);
    else if(n.t==="drop")dDrop(n.o);
    else if(n.t==="e")dEnemy(n.o);
    else if(n.t==="p")dPlayer();
    else if(n.t==="b")dBullet(n.o);}
  ctx.globalCompositeOperation="lighter";
  for(const q of S.parts){const sx=(q.x-q.y)*HW,sy=(q.x+q.y)*HH;
    if(sx+ox<-40||sx+ox>VW+40||sy+oy<-40||sy+oy>VH+40)continue;
    ctx.fillStyle=q.col;ctx.globalAlpha=1-q.t/q.life;
    ctx.fillRect(sx-q.sz/2,sy-q.sz/2-6,q.sz,q.sz);}
  ctx.globalAlpha=1;ctx.globalCompositeOperation="source-over";
  if(S.settings.dmg)for(const n of S.nums){const s=iso(n.x,n.y),k=n.t/.8;
    ctx.globalAlpha=1-k*k;
    ctx.font=(n.c==="#ffd45e"?"800 21px":"700 14px")+" -apple-system,sans-serif";
    ctx.textAlign="center";ctx.lineWidth=3;ctx.strokeStyle="rgba(0,0,0,.75)";
    const yy=s.sy-22-k*28,tx=n.txt||n.v;
    ctx.strokeText(tx,s.sx,yy);ctx.fillStyle=n.c;ctx.fillText(tx,s.sx,yy);}
  ctx.globalAlpha=1;ctx.restore();
  const pc=iso(p.x,p.y),lx=pc.sx+ox,ly=pc.sy+oy,LR=VW*CFG.LIGHT_R;
  ctx.save();ctx.translate(lx,ly);ctx.scale(1,CFG.LIGHT_STRETCH);
  const g=ctx.createRadialGradient(0,0,LR*.2,0,0,LR);
  g.addColorStop(0,"rgba(0,0,0,0)");
  g.addColorStop(.5,`rgba(0,0,0,${CFG.DARKNESS*.32})`);
  g.addColorStop(.8,`rgba(0,0,0,${CFG.DARKNESS*.76})`);
  g.addColorStop(1,`rgba(0,0,0,${CFG.DARKNESS})`);
  ctx.fillStyle=g;ctx.fillRect(-VW*2,-VH*2,VW*4,VH*4);ctx.restore();
  if(S.flash>0){ctx.fillStyle=`rgba(190,30,40,${S.flash*.9})`;ctx.fillRect(0,0,VW,VH);}
  drawMM();}
function guide(ox,oy,tg,col,al,idx,label){
  const p=S.p,s=iso(tg.x,tg.y),pc=iso(p.x,p.y);
  const a=Math.atan2((s.sy+oy)-(pc.sy+oy),(s.sx+ox)-(pc.sx+ox));
  const px=VW-48,py=Math.max(178,Math.min(VH-286,178+idx*58));
  ctx.save();ctx.globalCompositeOperation="source-over";
  ctx.fillStyle="rgba(8,7,14,.66)";ctx.strokeStyle=col+".45)";ctx.lineWidth=1;
  ctx.beginPath();ctx.roundRect(px-31,py-24,62,48,6);ctx.fill();ctx.stroke();
  ctx.globalCompositeOperation="lighter";ctx.translate(px,py-6);ctx.rotate(a);ctx.fillStyle=col+al;
  ctx.beginPath();ctx.moveTo(15,0);ctx.lineTo(-9,8);ctx.lineTo(-5,0);ctx.lineTo(-9,-8);ctx.closePath();ctx.fill();
  ctx.restore();
  ctx.fillStyle=col+".82)";ctx.font="800 10px sans-serif";ctx.textAlign="center";
  ctx.fillText(label+" "+Math.round(Math.hypot(tg.x-p.x,tg.y-p.y))+"m",px,py+18);}

function updHUD(){
  const p=S.p;if(!p)return;
  $("hpF").style.width=(p.hp/p.max*100)+"%";
  $("hpT").textContent=Math.ceil(p.hp)+"/"+Math.ceil(p.max);
  $("mpF").style.width=(p.mp/p.d.mpMax*100)+"%";
  $("mpT").textContent="MP "+Math.floor(p.mp)+"/"+p.d.mpMax;
  const b=S.base;
  $("xpF").style.width=(b.lv>=CFG.LV_CAP?100:b.xp/xpNeed(b.lv)*100)+"%";
  $("lvT").textContent="Lv"+b.lv+(b.para?"+"+b.para:"");
  const dg=dangerOf(S.floor);
  $("flT").innerHTML=S.floor+' <span style="color:'+dg.c+';font-size:9px">'+dg.n+'</span>';
  $("goldT").textContent=S.gold+" G";
  $("dpsT").textContent="DPS "+S.dps;
  const t=Math.floor(S.runT);
  $("tmT").textContent=Math.floor(t/60)+":"+String(t%60).padStart(2,"0");
  /* 持ち物はレアリティと個数だけ（中身は帰還後に分かる） */
  const cnt=[0,0,0,0,0];for(const it of S.bag)cnt[it.rar]++;
  $("loot").innerHTML=cnt.map((v,i)=>v?`<span class="${RC[i]}">${CFG.RARITY[i][0]} ${v}</span>`:"")
    .filter(Boolean).join("")||'<span style="color:#3d3750">未取得</span>';
  $("s0").querySelector(".cd").style.transform=
    "scaleY("+clamp(p.cd/(CFG.ATK_CD/(p.d.as*p.mAs*p.sAs)),0,1)+")";

let deathReturnTimer=null,deathCountdownTimer=null;
function leaveEnd(){clearTimeout(deathReturnTimer);clearInterval(deathCountdownTimer);
  deathReturnTimer=deathCountdownTimer=null;$("scEnd").classList.remove("on");openTown();}
function endRun(alive,cause){
  S.paused=true;
  const got=S.bag.slice();
  if(alive){S.stash.push(...got);SFX.extract();}else SFX.death();
  S.pots=CFG.POTION_BASE;
  S.log.runs.push({t:Math.round(S.runT),floor:S.floor,start:S.startFloor,alive,
    items:got.length,kills:S.p.kills,lv:S.base.lv,gold:S.gold,ups:S.p.ups.slice()});
  save();
  $("endT").textContent=alive?"帰還":"死亡";
  $("endS").textContent=alive?`深度 ${S.floor} から ${got.length} 個を持ち帰った`
    :`深度 ${S.floor} で力尽きた — ${got.length} 個を失った`;
  const body=$("endB");body.innerHTML=`<div class="card">
    <div class="stat"><span>潜行時間</span><b>${Math.floor(S.runT/60)}分${Math.floor(S.runT%60)}秒</b></div>
    <div class="stat"><span>到達深度</span><b>${S.floor}</b></div>
    <div class="stat"><span>撃破</span><b>${S.p.kills}</b></div>
    <div class="stat"><span>ラン強化</span><b>${S.p.ups.join(" / ")||"なし"}</b></div></div>`;
  if(!alive){const why=document.createElement("div");why.className="card deathCause";
    why.innerHTML=`<div class="skull">☠</div><div class="ty">死因</div><b>${cause||"敵の攻撃"}</b>
      <div class="sub">未帰還の装備 ${got.length} 個を失った</div>`;body.prepend(why);}
  if(alive&&got.length){
    const h=document.createElement("h3");h.textContent="持ち帰った装備";body.appendChild(h);
    for(const it of got){const d=document.createElement("div");d.className="card";
      d.innerHTML=`<div class="row" style="align-items:flex-start">
        <div class="${RC[it.rar]}" style="flex:0 0 auto">${icon(it.slot,24)}</div>

        <div class="st">${statsHTML(it,S.gear[it.slot])}</div></div></div>`;
      body.appendChild(d);}}
  S.bag.length=0;$("scEnd").classList.add("on");
  clearTimeout(deathReturnTimer);clearInterval(deathCountdownTimer);
  if(!alive){let left=10;$("btnBack").textContent=`拠点へ戻る（${left}秒）`;
    deathCountdownTimer=setInterval(()=>{left--;$("btnBack").textContent=`拠点へ戻る（${Math.max(0,left)}秒）`;},1000);
    deathReturnTimer=setTimeout(leaveEnd,10000);}else $("btnBack").textContent="拠点へ";}

  box.innerHTML=`<div class="ty" style="margin:0 0 6px">選択中 ${fuseSel.length}個 / +${totalXP}exp / 費用 ${cost}G</div>
    <div class="stat"><span>強化後予測</span><b>Lv${prev.lv}${prev.up?` <span class="up">(+${prev.up})</span>`:""}</b></div>
    <div class="stat"><span>${AFN(target.main.id)}（次Lv基礎）</span><b>${mainV(nxt)} <span class="up">(+${mainV(nxt)-mainV(target)})</span></b></div>`+
    (eq?deltaHTML(target.slot,nxt):"");
  c.appendChild(box);
  const go=document.createElement("div");go.className="btn gold"+(fuseSel.length&&S.gold>=cost?"":" no");
  go.textContent=`選択素材をまとめて合成 (${fuseSel.length}個)`;
  tapEl(go,()=>{if(!fuseSel.length)return;if(S.gold<cost){toast("金貨が足りない");return;}
    S.gold-=cost;target.xp+=totalXP;
    for(const f of fuseSel){const k=S.stash.indexOf(f);if(k>=0)S.stash.splice(k,1);}
    let up=0;while(target.lv<MAXLV&&target.xp>=fuseNeed(target)){target.xp-=fuseNeed(target);target.lv++;up++;}
    fuseSel=[];target.score=iScore(target);S.p.d=derive();recalcHP(S.p);up?SFX.lvl():SFX.ok();toast(up?`強化成功 Lv${target.lv}`:`経験値 +${totalXP}`);save();openFuse(target);});
  c.appendChild(go);
  if(!list.length){const d=document.createElement("div");d.className="card";d.innerHTML='<div class="st">素材にできる同部位の装備がない。</div>';c.appendChild(d);}
  for(const f of list){const on=fuseSel.includes(f),d=document.createElement("div");d.className="card tap"+(on?" sel":"");d.style.borderColor=on?"var(--gold)":"";
    d.innerHTML=`<div class="row"><div class="${RC[f.rar]}">${icon(iconKey(f),22)}</div>
      <div style="flex:1"><div class="nm ${RC[f.rar]}">${on?"✓ ":""}${f.name}</div>
      <div class="ty">${CFG.RARITY[f.rar][0]} / 深度${f.ilvl} / Lv${f.lv} — +${fuseXP(f)}exp</div></div></div>`;
    tapEl(d,()=>{const i=fuseSel.indexOf(f);if(i>=0)fuseSel.splice(i,1);else fuseSel.push(f);openFuse(target);});c.appendChild(d);}
  const clear=document.createElement("div");clear.className="btn gh";clear.textContent="選択解除";tapEl(clear,()=>{fuseSel=[];openFuse(target);});c.appendChild(clear);
  const x=document.createElement("div");x.className="btn popClose";x.textContent="閉じる";
  tapEl(x,()=>{$("itPop").classList.remove("on");fuseSel=[];openTown();});c.appendChild(x);
  $("itPop").classList.add("on");}

function equip(it){
  if(it.wt&&WCLS[it.wt]!==S.cls){toast(WCLS[it.wt]==="warrior"?"剣は戦士専用":"杖は魔術師専用");return;}
  const old=S.gear[it.slot];
  S.gear[it.slot]=it;
  const i=S.stash.indexOf(it);if(i>=0)S.stash.splice(i,1);
  if(old)S.stash.push(old);
  S.p.d=derive();recalcHP(S.p);
  SFX.chest();save();}
function openGearDetail(slotK,inDungeon){
  const it=S.gear[slotK],c=$("itC");c.classList.remove("gearCompare");
  c.innerHTML=`<div style="font-size:15px;font-weight:800;margin-bottom:10px">${SLOTN(slotK)}</div>`;
  if(it){c.innerHTML+=`<div class="${RC[it.rar]}" style="margin-bottom:8px">${icon(iconKey(it),34)}</div>
    <div class="nm ${RC[it.rar]}" style="text-align:center">${it.name}</div>
    <div class="st optBox" style="text-align:center">${statsHTML(it)}</div>`;}
  else c.innerHTML+='<div class="card"><div class="st">装備されていません。</div></div>';
  const add=(text,cls,fn)=>{const d=document.createElement("div");d.className="btn "+cls;d.textContent=text;tapEl(d,fn);c.appendChild(d);};
  if(it)add("評価","gold",()=>showItem(it,inDungeon));
  add("装備変更","pri",()=>openPick(slotK,inDungeon));
  if(it)add("外す","gh",()=>{S.stash.push(it);S.gear[slotK]=null;S.p.d=derive();recalcHP(S.p);save();
    $("itPop").classList.remove("on");inDungeon?openPause():openTown();});
  add("閉じる","popClose",()=>$("itPop").classList.remove("on"));$("itPop").classList.add("on");}
function itemStatTotals(it){const t={};if(!it)return t;
  if(it.main)t[it.main.id]=(t[it.main.id]||0)+mainV(it);
  for(const a of it.affs)t[a.id]=(t[a.id]||0)+a.v;return t;}
function compareItemStats(it,other,isAfter){if(!it)return "効果なし";
  const own=itemStatTotals(it),base=itemStatTotals(other);
  let h=Object.keys(own).map(k=>{const d=(own[k]||0)-(base[k]||0),cls=isAfter?(d>0?"up":d<0?"dn":""):"";
    return `<span class="${cls}">${AFN(k)} +${own[k]}${AFP(k)?"%":""}</span>`;}).join("<br>");
  if(it.pw){const p=POWER(it.pw);if(p)h+=`<div class="leg">◆ ${p.n} — ${p.d}</div>`;}return h;}
function openGearCompare(slotK,it,inDungeon){
  const old=S.gear[slotK],a=itemStatTotals(old),b=itemStatTotals(it),keys=[...new Set([...Object.keys(a),...Object.keys(b)])],
    before=optTotals(null,null),after=optTotals(it,slotK),c=$("itC");c.classList.add("gearCompare");
  const itemBox=(x,label,after)=>`<div class="compareItem${after?" after":""}"><div class="ty">${label}</div>
    <div class="${x?RC[x.rar]:""}">${icon(x?iconKey(x):slotK,30)}</div>
    <div class="nm ${x?RC[x.rar]:""}">${x?x.name:"装備なし"}</div>
    <div class="st">${compareItemStats(x,after?old:it,after)}</div></div>`;
  c.innerHTML=`<div style="font-size:15px;font-weight:800">${SLOTN(slotK)}の変更確認</div>
    <div class="compareHead">${itemBox(old,"変更前",false)}${itemBox(it,"変更後",true)}</div>
    <div class="ty">両装備についているステータスのみ</div>
    <div class="compareStats optBox">${keys.map(k=>{const av=before[k]||0,bv=after[k]||0,d=bv-av,p=AFP(k),cls=d>0?"up":d<0?"dn":"";
      return `<div class="stat"><span>${AFN(k)}</span><b>${av}${p?"%":""} → <span class="after ${cls}">${bv}${p?"%":""} (${d>0?"+":d===0?"±":""}${d})</span></b></div>`;}).join("")}</div>`;
  const equipB=document.createElement("div");equipB.className="btn pri";equipB.textContent="この装備に変更";
  tapEl(equipB,()=>{equip(it);$("itPop").classList.remove("on");inDungeon?openPause():openTown();});c.appendChild(equipB);
  const back=document.createElement("div");back.className="btn gh";back.textContent="候補一覧へ戻る";tapEl(back,()=>openPick(slotK,inDungeon));c.appendChild(back);
  $("itPop").classList.add("on");}
function openPick(slotK,inDungeon){
  const list=S.stash.filter(i=>i.slot===slotK&&!Object.values(S.gear).includes(i)).sort((a,b)=>b.score-a.score),c=$("itC");
  c.classList.remove("gearCompare");c.innerHTML=`<div style="font-size:15px;font-weight:800;margin-bottom:4px">${SLOTN(slotK)}を変更</div>
    <div class="sub" style="margin-bottom:12px">保有装備からアイコンを選択</div>`;
  if(!list.length)c.innerHTML+='<div class="card"><div class="st">変更できる保有装備がありません。</div></div>';
  else{const g=document.createElement("div");g.className="grid";for(const it of list){const d=document.createElement("div");
    d.className="cell "+RC[it.rar];d.style.borderColor=it.rar===4?"#ff8adf":CFG.RARITY[it.rar][3];d.setAttribute("aria-label",it.name);d.title=it.name;
    d.innerHTML=icon(iconKey(it),30)+`<div class="lvl">${it.ilvl}</div>`;tapEl(d,()=>openGearCompare(slotK,it,inDungeon));g.appendChild(d);}c.appendChild(g);}
  const x=document.createElement("div");x.className="btn popClose";x.textContent="戻る";tapEl(x,()=>openGearDetail(slotK,inDungeon));c.appendChild(x);
  $("itPop").classList.add("on");}

/* ---------- ダンジョン内の一時停止 ---------- */
/* 職業切替: レベル/ステータス/装備は職業ごと、金貨と倉庫は共有 */
/* 職業切替: レベルとステータスは職業ごと。装備・金貨・倉庫は共有。 */
function switchClass(k){
  S.chars[S.cls]={base:S.base};
  const sv=S.chars[k];
  S.base=sv&&sv.base?sv.base
    :{lv:1,xp:0,pts:0,str:0,mag:0,def:0,agi:0,spi:0,luk:0};
  S.cls=k;S.alloc=null;
  const w=S.gear.weapon;                       // 装備できない武器だけ外す
  if(w&&w.wt&&WCLS[w.wt]!==k){S.stash.push(w);S.gear.weapon=null;
    toast(CLASSES[k].name+"は"+(w.wt==="sword"?"剣":"杖")+"を装備できないため外しました");}
  S.p=newPlayer();
  SFX.lvl();save();openTown();}
function openPause(){
  S.paused=true;for(let i=0;i<4;i++)HELD[i]=false;IN.dx=IN.dy=0;
  $("scPause").classList.add("on");
  $("pauseS").textContent=`深度 ${S.floor} / 未帰還 ${S.bag.length}個`;
  for(const t of document.querySelectorAll("#scPause .tab"))t.classList.toggle("on",t.dataset.p===S.ptab);
  const b=$("pauseBody");b.innerHTML="";
  const addGiveUp=()=>{
    const gv=document.createElement("div");gv.className="btn gh";gv.style.marginTop="8px";
    gv.textContent="ここで力尽きる（戦利品は失う）";
    tapEl(gv,()=>{$("scPause").classList.remove("on");
      ask("ここで力尽きる",`今回拾った ${S.bag.length} 個を失って拠点に戻ります。`,()=>endRun(false,"探索を断念した"));});
    b.appendChild(gv);};
  if(S.ptab==="drops"){
    addGiveUp();
    const h=document.createElement("h3");h.textContent="今回拾った未鑑定装備";b.appendChild(h);
    if(!S.bag.length){const d=document.createElement("div");d.className="card";d.innerHTML='<div class="st">まだ装備を拾っていない。</div>';b.appendChild(d);}
    else{
      const list=document.createElement("div");list.className="bagList";
      for(const it of S.bag){const r=document.createElement("div");r.className=`bagRow ${RC[it.rar]}`;
        r.innerHTML=`<span>${SLOTN(it.slot)} / ${CFG.RARITY[it.rar][0]}</span><span>深度 ${it.ilvl}</span>`;
        list.appendChild(r);}
      b.appendChild(list);}
    const note=document.createElement("div");note.className="st";note.style.marginTop="10px";
    note.textContent="未帰還の装備は種類・レア度・深度だけ確認できる。オプションは帰還後に鑑定される。";
    b.appendChild(note);
  }else if(S.ptab==="gear"){
    const h=document.createElement("div");h.className="card";
    h.innerHTML=`<div class="st">ここで装備できるのは<b>持ち帰り済み</b>のものだけ。
      今回拾った ${S.bag.length} 個は帰還するまで使えない。</div>`;
    b.appendChild(h);
    gearGrid(b,true);
    const h2=document.createElement("h3");h2.textContent="能力値";b.appendChild(h2);statBlock(b);
  }else if(S.ptab==="char"){allocBlock(b,openPause);}
  else{
    const addToggle=(k,lbl)=>{const d=document.createElement("div");d.className="btn"+(S.settings[k]?" gold":" gh");d.textContent=lbl+"："+(S.settings[k]?"ON":"OFF");
      tapEl(d,()=>{S.settings[k]=S.settings[k]?0:1;save();openPause();});b.appendChild(d);};
    const h=document.createElement("h3");h.textContent="設定";b.appendChild(h);
    addToggle("map","ミニマップ");addToggle("dmg","ダメージ数字");addToggle("shake","画面揺れ");}
  if(S.ptab!=="drops")addGiveUp();}

/* ---------- クラス選択 / 潜行 ---------- */
function openClass(){
  S.scene="class";S.paused=true;
  const c=$("classList");c.innerHTML="";
  for(const k of CKEYS){const C=CLASSES[k];
    const d=document.createElement("div");d.className="card tap";
    d.innerHTML=`<div class="nm" style="color:${C.col}">${C.name}</div>
      <div class="st">${C.desc}</div>
      <div class="st" style="margin-top:8px;color:#7f7c8c">
        HP ${C.hp} / MP ${C.mp} / 射程 ${C.range.toFixed(1)}<br>
        技: ${C.skills.map(s=>s.n+"("+s.c+")").join("・")}</div>`;
    tapEl(d,()=>{S.cls=k;S.gear={};for(const s of SLOTK)S.gear[s]=null;
      S.p=newPlayer();$("scClass").classList.remove("on");save();openTown();});
    c.appendChild(d);}
  $("scClass").classList.add("on");}
function confirmDive(fl){
  ask("ダンジョンに潜る",
    "深度 "+fl+" から開始します。\n危険度: "+dangerOf(fl).n+"\n未鑑定品は帰還するまで確定しません。",
    ()=>beginRun(fl));}
function startDive(){
  // 階層が数百/数千になっても、ページ切り替えで開始地点を選ぶ
  const st=CFG.SKIP_STEP;
  const maxStart=Math.max(1,Math.floor((S.deepest-1)/st)*st+1);
  if(maxStart<=1){confirmDive(1);return;}
  const starts=[];for(let f=1;f<=maxStart;f+=st)starts.push(f);
  const pageSize=6,maxPage=Math.max(0,Math.ceil(starts.length/pageSize)-1);
  S.startPage=clamp(S.startPage||0,0,maxPage);
  const from=starts.length-(S.startPage+1)*pageSize,to=starts.length-S.startPage*pageSize;
  const page=starts.slice(Math.max(0,from),to);
  const c=$("itC");
  c.innerHTML=`<div style="font-size:15px;font-weight:800;margin-bottom:4px">開始する深度</div>
    <div class="sub" style="margin-bottom:10px">解放済み ${starts.length}地点 / 最大 ${maxStart}F</div>`;
  const nav=document.createElement("div");nav.className="g2";
  const newer=document.createElement("div");newer.className="btn gh"+(S.startPage<=0?" no":"");newer.textContent="より深い";
  tapEl(newer,()=>{if(S.startPage<=0)return;S.startPage--;startDive();});nav.appendChild(newer);
  const older=document.createElement("div");older.className="btn gh"+(S.startPage>=maxPage?" no":"");older.textContent="より浅い";
  tapEl(older,()=>{if(S.startPage>=maxPage)return;S.startPage++;startDive();});nav.appendChild(older);c.appendChild(nav);
  for(const fl of page.reverse()){
    const d=document.createElement("div");d.className="btn"+(fl===maxStart?" pri":"");
    d.textContent="深度 "+fl+" — "+dangerOf(fl).n;
    tapEl(d,()=>{$("itPop").classList.remove("on");confirmDive(fl);});c.appendChild(d);}
  const x=document.createElement("div");x.className="btn popClose";x.textContent="やめる";
  tapEl(x,()=>$("itPop").classList.remove("on"));c.appendChild(x);$("itPop").classList.add("on");}
function beginRun(fl){
  $("scTown").classList.remove("on");
  S.scene="dungeon";S.paused=false;S.runT=0;S.startFloor=fl;
  S.dmgLog.length=0;S.dps=0;
  S.p=newPlayer();S.bag.length=0;
  $("s0").querySelector("span").textContent="攻撃";
  for(let i=1;i<=3;i++){const sk=CLASSES[S.cls].skills[i-1];
    $("s"+i).querySelector("span").textContent=sk.n;
    $("s"+i).querySelector(".cost").textContent=sk.c;}
  $("pauseB").classList.add("show");
  enterFloor(fl);updBuffs();updHUD();}

/* ---------- 保存 ---------- */
const KEY="descent_v5";
function save(){try{localStorage.setItem(KEY,JSON.stringify({cls:S.cls,deepest:S.deepest,
  gold:S.gold,stash:S.stash,gear:S.gear,base:S.base,pots:S.pots,log:S.log,
  settings:S.settings,admin:S.admin,chars:S.chars}));}catch(e){}}
function load(){try{
  const d=JSON.parse(localStorage.getItem(KEY)||"null");
  if(!d||!d.cls||!CLASSES[d.cls])return false;
  S.cls=d.cls;S.deepest=d.deepest||1;S.gold=d.gold||0;S.stash=d.stash||[];
  const fix=it=>{
    if(!it)return null;
    if(it.slot==="belt")return null;                 // ベルトは廃止
    if(it.slot==="ring1"||it.slot==="ring2")it.slot="ring";
    if(!it.main){                                    // 旧: 主ステが affs[0] だった
      const sd=SLOTS.find(x=>x.k===it.slot)||SLOTS[1];
      const a=(it.affs&&it.affs.shift())||{id:sd.main,v:1};
      it.main={id:sd.k==="weapon"?"atk":sd.main,v:a.v};}
    if(it.slot==="weapon"&&!it.wt){it.wt="sword";it.base=pick(WEAPN.sword);}
    if(!it.lv){it.lv=1;it.xp=0;}
    it.affs=(it.affs||[]).filter(a=>AFF.some(x=>x.id===a.id));
    it.score=iScore(it);return it;};
  S.stash=S.stash.map(fix).filter(Boolean);
  S.gear=d.gear||{};
  const ng={};for(const k of SLOTK)ng[k]=null;
  for(const k in S.gear){const it=fix(S.gear[k]);if(it&&!ng[it.slot])ng[it.slot]=it;}
  S.gear=ng;
  S.pots=d.pots==null?CFG.POTION_BASE:Math.min(CFG.POTION_MAX,d.pots);S.log=d.log||{runs:[]};
  S.settings=Object.assign({map:1,dmg:1,shake:1},d.settings||{});
  S.admin=!!d.admin;S.chars=d.chars||{};
  const nb=Object.assign({lv:1,xp:0,pts:0,str:0,mag:0,def:0,agi:0,spi:0,luk:0},d.base||{});
  delete nb.need;
  if(nb.dex!==undefined||nb.vit!==undefined){   // 旧スキーマは全部振り直しにして返す
    nb.pts+=(nb.str|0)+(nb.dex|0)+(nb.vit|0)+(nb.ene|0)+(nb.luk|0);
    nb.str=nb.mag=nb.def=nb.agi=nb.spi=nb.luk=0;
    delete nb.dex;delete nb.vit;delete nb.ene;delete nb.para;}
  S.base=nb;
  return true;}catch(e){return false;}}

/* ---------- 起動 ---------- */
resize();
for(let i=0;i<4;i++)holdBtn($("s"+i),i);
hook($("pot"),()=>{if(S.scene==="dungeon"&&!S.paused)usePotion();});
hook($("act"),()=>{if(S.scene==="dungeon"&&!S.paused)doAction();});
hook($("pauseB"),()=>{if(S.scene==="dungeon"&&!S.paused){S.ptab="drops";openPause();}});
tapEl($("btnResume"),()=>{$("scPause").classList.remove("on");S.paused=false;updHUD();});
tapEl($("btnDive"),startDive);
tapEl($("btnBack"),leaveEnd);
tapEl($("askY"),()=>{$("askPop").classList.remove("on");S.paused=askPrevPaused;const f=askFn;askFn=null;if(f)f();});
tapEl($("askN"),()=>{$("askPop").classList.remove("on");S.paused=askPrevPaused;askFn=null;});
hook($("lockHit"),lockHit);
for(const t of document.querySelectorAll("#scTown .tab"))tapEl(t,()=>{S.tab=t.dataset.t;openTown();});
for(const t of document.querySelectorAll("#scPause .tab"))tapEl(t,()=>{S.ptab=t.dataset.p;openPause();});

if(load()){S.p=newPlayer();openTown();}else openClass();

let last=performance.now(),acc=0;const STEP=1/60;
function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-last)/1000;last=now;
  if(dt>.25)dt=.25;
  if(LK&&!LK.done)lockTick(dt);
  if(S.scene==="dungeon"){
    acc+=dt;let n=0;
    while(acc>=STEP&&n++<4){update(STEP);acc-=STEP;}
    if(acc>STEP*4)acc=0;
    draw();}}
requestAnimationFrame(frame);
</script>
